<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZombieSafeHouse · Pannello sponsor</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#140f1f;--moon:#f7d64a;--red:#d7263d;--night:#241a4a;--paper:#f3e9d2;--green:#3f9b5f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--night);color:#fff;padding:14px 16px;border-bottom:4px solid var(--moon);display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px;letter-spacing:.5px}header span{font-size:12px;opacity:.8}
main{max-width:760px;margin:0 auto;padding:14px}
.box{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:20px}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:2px solid var(--ink);font-size:16px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:12px 14px;border:3px solid var(--ink);background:var(--moon);font-weight:700;font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button.red{background:var(--red);color:#fff}button.ghost{background:#fff}button:disabled{opacity:.5}
#map{height:320px;border:3px solid var(--ink);margin-top:10px}
.msg{padding:10px;margin:10px 0;border:2px solid var(--ink);font-weight:700}.ok{background:#e3f3e7}.ko{background:#ffd9de}
.sp{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border-top:2px dashed #ccc;padding:10px 0}
.sp small{display:block;color:#5a5470}.tag{display:inline-block;padding:2px 8px;border:2px solid var(--ink);font-size:12px;font-weight:700}
.on{background:#e3f3e7}.off{background:#eee}.hint{font-size:13px;color:#5a5470;margin-top:6px}
.hidden{display:none}
</style></head><body>
<header><div><b>ZombieSafeHouse</b><br><span>Pannello sponsor · INDZ</span></div><button class="ghost" id="logout" style="display:none">Esci</button></header>
<main>
<div class="box" id="loginBox"><h2>Accesso amministratore</h2>
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <div style="margin-top:12px"><button id="loginBtn">Entra</button></div><div id="loginMsg"></div></div>

<div id="adminArea" class="hidden">
<div class="box"><h2>➕ Nuovo sponsor</h2>
 <label>Nome dell’attività</label><input id="f_name" placeholder="Es. Ferramenta Volta">
 <div class="row"><div><label>Sigla nel bollino (2 lettere)</label><input id="f_logo" maxlength="3" placeholder="FV"></div>
  <div><label>Categoria</label><input id="f_cat" placeholder="Es. Ferramenta e sicurezza"></div></div>
 <div class="row"><div><label>Pacchetto</label><select id="f_pack"><option value="vetrina">Vetrina</option><option value="vetrina_plus">Vetrina Plus</option><option value="partner_categoria">Partner di categoria</option><option value="agenzia">Agenzia</option><option value="acchiappa">Acchiappa-clienti</option><option value="nazionale">Partner nazionale</option></select></div>
  <div><label>Prezzo fondatori</label><select id="f_found"><option value="true">Sì</option><option value="false">No</option></select></div></div>
 <label>Indirizzo</label><div class="row"><input id="f_addr" placeholder="Via Roma 10, Volta Mantovana"><button id="findBtn" style="flex:0 0 auto">📍 Trova</button></div>
 <div id="map"></div><div class="hint">Trascina il segnaposto rosso sul punto esatto dell’attività. Coordinate: <b id="coords">–</b></div>
 <div class="row"><div><label>Telefono</label><input id="f_tel"></div><div><label>WhatsApp</label><input id="f_wa" placeholder="+39 333…"></div></div>
 <label>Sito</label><input id="f_web" placeholder="https://…">
 <div class="row"><div><label>Instagram</label><input id="f_ig" placeholder="https://instagram.com/…"></div><div><label>Facebook</label><input id="f_fb" placeholder="https://facebook.com/…"></div></div>
 <label>Offerta per chi usa l’app</label><input id="f_offer" placeholder="Es. −10% sulle grate con il codice dell’app">
 <label>Rimedi collegati (facoltativo, separati da virgola)</label><input id="f_tags" placeholder="porta, grate, luci">
 <label>Visibile nell’app subito?</label><select id="f_active"><option value="true">Sì, attivo</option><option value="false">No, lo attivo dopo</option></select>
 <div style="margin-top:14px"><button class="red" id="saveBtn">Salva sponsor</button></div><div id="saveMsg"></div></div>

<div class="box"><h2>📋 Sponsor inseriti</h2><div id="list">Caricamento…</div></div>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://wmweptdpfworispqjhto.supabase.co','sb_publishable_kaNxtTEWBzAdqGVAp_wLdA_XzOtNQFp');
const $=s=>document.querySelector(s);let map,mk,pos=null;
const msg=(el,t,ok)=>{el.innerHTML=`<div class="msg ${ok?'ok':'ko'}">${t}</div>`;};
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
async function isAdmin(){const{data:u}=await SB.auth.getUser();if(!u||!u.user)return false;const{data}=await SB.from('admins').select('user_id').eq('user_id',u.user.id).maybeSingle();return!!data;}
async function enter(){if(!(await isAdmin())){msg($('#loginMsg'),'Sei entrato, ma il tuo account non è amministratore. Esegui in Supabase la riga “insert into public.admins…” con la tua email, poi ricarica.',false);return;}
  $('#loginBox').classList.add('hidden');$('#adminArea').classList.remove('hidden');$('#logout').style.display='';initMap();loadList();}
$('#loginBtn').onclick=async()=>{const{error}=await SB.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value});if(error){msg($('#loginMsg'),'Email o password non corretti.',false);return;}enter();};
$('#logout').onclick=async()=>{await SB.auth.signOut();location.reload();};
SB.auth.getSession().then(({data})=>{if(data.session)enter();});
function initMap(){if(map)return;map=L.map('map').setView([45.3255,10.6582],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  mk=L.marker([45.3255,10.6582],{draggable:true}).addTo(map);mk.on('dragend',()=>setPos(mk.getLatLng()));map.on('click',e=>{mk.setLatLng(e.latlng);setPos(e.latlng);});}
function setPos(ll){pos={lat:+ll.lat.toFixed(6),lon:+ll.lng.toFixed(6)};$('#coords').textContent=pos.lat+', '+pos.lon;}
$('#findBtn').onclick=async()=>{const a=$('#f_addr').value.trim();if(!a)return;$('#findBtn').disabled=true;
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=it&q='+encodeURIComponent(a)).then(x=>x.json());
    if(!r[0])alert('Indirizzo non trovato: prova a scriverlo in modo diverso, oppure tocca la mappa sul punto giusto.');
    else{const ll={lat:+r[0].lat,lng:+r[0].lon};map.setView(ll,18);mk.setLatLng(ll);setPos(ll);}}catch(e){alert('Ricerca non riuscita: tocca la mappa sul punto giusto.');}
  $('#findBtn').disabled=false;};
$('#saveBtn').onclick=async()=>{const name=$('#f_name').value.trim(),m=$('#saveMsg');
  if(!name){msg(m,'Scrivi il nome dell’attività.',false);return;}if(!pos){msg(m,'Indica il punto sulla mappa: “Trova” oppure tocca la mappa.',false);return;}
  const parts=$('#f_addr').value.split(',');const row={slug:slug(name),name,logo_text:($('#f_logo').value.trim()||name.split(/\s+/).map(w=>w[0]).join('').slice(0,2)).toUpperCase(),
    category:$('#f_cat').value.trim()||'Attività',package:$('#f_pack').value,founder:$('#f_found').value==='true',address:$('#f_addr').value.trim(),comune:(parts[1]||'').trim(),
    lat:pos.lat,lon:pos.lon,phone:$('#f_tel').value.trim(),whatsapp:$('#f_wa').value.trim(),website:$('#f_web').value.trim(),instagram:$('#f_ig').value.trim(),facebook:$('#f_fb').value.trim(),active:$('#f_active').value==='true'};
  $('#saveBtn').disabled=true;
  const{data,error}=await SB.from('sponsors').upsert(row,{onConflict:'slug'}).select().single();
  if(error){msg(m,'Errore: '+error.message,false);$('#saveBtn').disabled=false;return;}
  const off=$('#f_offer').value.trim();if(off){await SB.from('offers').insert({sponsor_id:data.id,title:off,remedy_tags:$('#f_tags').value.split(',').map(s=>s.trim()).filter(Boolean)});}
  msg(m,`✅ ${name} salvato${row.active?' e visibile nell’app':''}.`,true);$('#saveBtn').disabled=false;loadList();};
async function loadList(){const{data,error}=await SB.from('sponsors').select('*').order('created_at',{ascending:false});const L=$('#list');
  if(error){L.textContent='Errore: '+error.message;return;}if(!data.length){L.textContent='Nessuno sponsor ancora.';return;}
  L.innerHTML=data.map(s=>`<div class="sp"><div><b>${s.name}</b> <span class="tag ${s.active?'on':'off'}">${s.active?'attivo':'non attivo'}</span><small>${s.category||''} · ${s.package} · ${s.address||''}</small><small>📍 ${s.lat??'–'}, ${s.lon??'–'}</small></div>
    <div class="row" style="flex-direction:column"><button class="ghost" data-t="${s.id}" data-a="${s.active}">${s.active?'Disattiva':'Attiva'}</button><button class="ghost" data-show="${s.lat},${s.lon}">Mappa</button></div></div>`).join('');
  L.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{await SB.from('sponsors').update({active:b.dataset.a!=='true'}).eq('id',b.dataset.t);loadList();});
  L.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{const[a,o]=b.dataset.show.split(',').map(Number);if(!isNaN(a)){map.setView([a,o],18);mk.setLatLng([a,o]);window.scrollTo(0,0);}});}
</script></body></html>
