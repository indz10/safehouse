<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#241a4a">
<title>ZombieSafeHouse</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZombieSafeHouse">
<meta name="description" content="Valuta quanto è sicura la tua casa vera e difendila in un gioco a fumetto. Sponsor e community della tua zona.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Fase 7c: i caratteri non bloccano più la prima schermata (prima si aspettava Google prima di disegnare) -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ===== TOKEN =====
   Notte  #241A4A  · Inchiostro #140F1F · Carta #F3E9D2
   Luna   #F7D64A  · Sangue    #D7263D · Zombie #6FB59A */
:root{
  --night:#241a4a; --night2:#33276a; --ink:#140f1f; --paper:#f3e9d2; --paper2:#e8dcbf;
  --moon:#f7d64a; --blood:#d7263d; --zom:#6fb59a; --steel:#7c8794; --ok:#3f9b5f;
  --display:'Bangers','Impact','Haettenschweiler','Avenir Next Condensed','Arial Narrow Bold',sans-serif;
  --body:'Comic Neue','Trebuchet MS',system-ui,sans-serif;
  --line:3px solid var(--ink);
  --nav-h:68px;
  --tb-h:50px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);font-weight:700;color:var(--ink);background:var(--night);
  background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:9px 9px;}
button,input,select{font-family:inherit;font-weight:700;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper);margin-top:calc(var(--tb-h) + env(safe-area-inset-top));
  padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));overflow-x:hidden}
.dots{background-image:radial-gradient(rgba(20,15,31,.13) 1.1px,transparent 1.2px);background-size:7px 7px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95}
h2{font-size:34px}
h3{font-size:24px}
p{line-height:1.45}
.muted{color:#5b5368;font-weight:400}

/* ---- pannelli fumetto ---- */
.page{padding:16px 14px 8px}
.panel{background:#fff;border:var(--line);box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px;position:relative}
.panel.paper{background:var(--paper)}
.panel.night{background:var(--night);color:#fff}
.panel.moon{background:var(--moon)}
.caption{display:inline-block;background:var(--moon);border:var(--line);padding:6px 10px;font-weight:700;font-size:14px;line-height:1.3;box-shadow:3px 3px 0 var(--ink)}
.bubble{position:relative;background:#fff;border:var(--line);border-radius:22px;padding:12px 14px;line-height:1.4}
.bubble:after{content:"";position:absolute;left:28px;bottom:-14px;width:18px;height:18px;background:#fff;border-right:var(--line);border-bottom:var(--line);transform:skewX(-35deg) rotate(45deg)}
.sfx{font-family:var(--display);color:var(--moon);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);letter-spacing:.03em}

/* ---- bottoni ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--line);background:var(--blood);color:#fff;
  font-family:var(--display);font-size:24px;letter-spacing:.04em;padding:12px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--moon);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.small{font-size:18px;padding:8px 12px;min-height:42px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}

/* ---- HERO ---- */
.hero{position:relative;height:calc(100svh - var(--nav-h) - var(--tb-h) - env(safe-area-inset-bottom) - env(safe-area-inset-top));max-height:900px;min-height:600px;overflow:hidden;border-bottom:var(--line);background:var(--night)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .title{position:absolute;left:16px;right:16px;top:calc(18px + env(safe-area-inset-top));}
.hero .title h1{font-size:clamp(58px,17vw,92px);color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--blood);transform:rotate(-3deg);transform-origin:left}
.hero .title h1 span{display:block;color:var(--moon)}
.hero .boom{position:absolute;right:10px;top:51%;font-size:34px;transform:rotate(9deg)}
@media (prefers-reduced-motion:no-preference){
  .hero .title h1{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
  .hero .boom{animation:slam .5s .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{opacity:1}}
}

/* ---- nav ---- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:50;border-top:3px solid var(--moon)}
.nav button{background:none;border:0;color:#cfc6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--moon)}
.nav button.on svg{transform:scale(1.12)}

/* ---- wizard ---- */
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:10px;border:2px solid var(--ink);background:#fff}
.steps i.on{background:var(--blood)}
.steps i.done{background:var(--ink)}
.field{width:100%;border:var(--line);padding:12px;background:#fff;font-size:17px;min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--ink);background:#fff;padding:9px 12px;font-size:15px;line-height:1.2;text-align:left;min-height:42px}
.chip.on{background:var(--ink);color:var(--moon)}
.chip.ai{position:relative}
.chip.ai.on:after{content:"IA";position:absolute;top:-9px;right:-6px;background:var(--zom);color:var(--ink);border:2px solid var(--ink);font-size:10px;padding:1px 4px}
.q{padding:14px 0;border-bottom:2px dashed rgba(20,15,31,.25)}
.q:last-child{border-bottom:0}
.q label{font-size:17px;display:block}
.q .hint{font-weight:400;font-size:13px;color:#5b5368;margin-top:2px}

/* ---- foto ---- */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shot{border:var(--line);background:#fff;aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:6px;cursor:pointer}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .lbl{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font-size:12px;padding:4px}
.shot input{display:none}
.finding{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:2px dashed rgba(20,15,31,.2)}
.finding:last-child{border:0}
.tag{display:inline-block;border:2px solid var(--ink);font-size:11px;padding:1px 6px;background:var(--zom)}
.tag.sp{background:var(--moon)}
.tag.cm{background:#c9b8ff}
.tag.ia{background:var(--zom)}

/* ---- risultato ---- */
.score{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.bars .b{margin:7px 0}
.bars .b > div:last-child{height:14px;border:2px solid var(--ink);background:#fff;margin-top:3px}
.bars .fill{display:block;height:100%;background:var(--blood);transition:width .7s}
.bars .fill.good{background:var(--ok)}
.bars .fill.mid{background:var(--moon)}

/* ---- gioco ---- */
.game-scene{border:var(--line);box-shadow:5px 5px 0 var(--ink);background:var(--night);position:relative;overflow:hidden}
.game-scene svg{display:block;width:100%;height:auto}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hud div{border:var(--line);background:#fff;padding:8px;text-align:center}
.hud b{font-family:var(--display);font-weight:400;font-size:28px;display:block;line-height:1}
.hud small{font-size:12px;font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:var(--line);background:#fff;padding:9px 4px;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--moon)}
.upg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:var(--line);background:#fff;padding:10px;margin-bottom:10px}
.upg.on{background:#e3f3e8}
.upg b{font-size:16px}
.upg small{display:block;font-weight:400;font-size:13px;line-height:1.3;margin-top:2px}
.pop{position:absolute;font-size:40px;pointer-events:none;transform:rotate(-8deg)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop 1.1s ease-out forwards}@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}20%{transform:scale(1.15) rotate(-8deg);opacity:1}80%{opacity:1}100%{transform:translateY(-30px) scale(1) rotate(-8deg);opacity:0}}}
.zw{transition:transform 3.2s linear}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:50vh}
.msg{max-width:86%;border:var(--line);padding:10px 12px;line-height:1.4;font-size:15px;white-space:pre-wrap}
.msg.bot{background:#fff;align-self:flex-start;border-radius:4px 18px 18px 18px}
.msg.me{background:var(--moon);align-self:flex-end;border-radius:18px 4px 18px 18px}
.msg.typing{opacity:.7}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--paper);padding:10px 0;display:flex;gap:8px}
.composer input{flex:1}
/* Radio Operatore (Fase 7a): pagina a misura di schermo, i messaggi scorrono dentro */
.radiopg{display:flex;flex-direction:column;padding-bottom:6px;overflow:hidden}
.radiopg .rphead{gap:10px;margin-bottom:8px;flex:none}.radiopg .rphead h2{font-size:24px;line-height:1.1}.radiopg .rphead p{font-size:13px}
.radiopg .rpico{width:44px;height:44px;border:var(--line);background:var(--zom);display:grid;place-items:center;flex:none}
.radiopg .chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 8px}
.radiopg .rpchips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;flex:none;padding:6px 0 2px;-webkit-overflow-scrolling:touch}
.radiopg .rpchips .chip{flex:none;white-space:nowrap;font-size:13px;min-height:34px;padding:6px 10px}
.radiopg .composer{position:static;flex:none;padding:8px 0 0}
.radiopg .cback{flex:none;padding:0 0 6px}
body:has(.radiopg) #accFab{display:none}

/* ---- varie ---- */
.notice{border:2px dashed var(--ink);padding:10px;font-size:13px;font-weight:400;background:rgba(255,255,255,.6)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{z-index:130!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--ink);color:var(--moon);border:3px solid var(--moon);padding:10px 14px;z-index:80;font-size:15px;max-width:90%}
.sponsor{display:flex;gap:10px;align-items:center}
.sponsor .logo{width:46px;height:46px;border:var(--line);display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--moon);flex:none}
.hidden{display:none!important}

/* ---- v2.1 ---- */
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 12px}
.sb{border:var(--line);background:#fff;padding:6px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sb span{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px;background:#fff}
.sb.on{background:var(--moon)} .sb.on span{background:var(--blood);color:#fff}
.sb.done{background:var(--ink);color:var(--moon)} .sb.done span{background:var(--moon);color:var(--ink)}
.sb[disabled]{opacity:.55}
.tavola svg{display:block;width:100%;height:auto}
.bubble.op{margin-left:8px}
.chip{border:var(--line);box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
.chip.on{transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--blood)}
.chip.opt.on:before{content:"✓ ";color:var(--moon)}
.maptools{display:flex;gap:6px;padding:8px;background:var(--ink);flex-wrap:wrap}
.maptools .chip{font-size:13px;padding:6px 10px;min-height:34px;box-shadow:none;border:2px solid var(--moon)}
.maptools .chip.on{background:var(--moon);color:var(--ink)}
.maptools .chip:not(.on){background:transparent;color:#e5def5;border-color:#6b5fa0}
.mapsvg svg{display:block;width:100%;height:auto}
.mapinfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:var(--line);background:var(--paper);min-height:52px;font-size:14px}
.mapinfo b{font-size:16px}
.stat{flex:1;border:2px solid var(--ink);background:var(--paper);padding:6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.stat small{font-size:11px;font-weight:400}
details summary{list-style:none;margin:8px 0 4px}
.maphero{position:relative;border-bottom:var(--line)}
.maphero svg{display:block;width:100%;height:210px}
.mh-t{position:absolute;left:14px;right:14px;bottom:16px}
.mh-t h2{color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--blood);font-size:44px;margin-bottom:6px}
.game-scene{position:relative}
.cap{position:absolute;left:8px;top:8px;max-width:72%;background:var(--moon);border:var(--line);padding:6px 9px;font-size:14px;line-height:1.25;opacity:0}
.cap.in{opacity:1;animation:capin .35s ease-out}
@keyframes capin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.blink{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{fill:#f7d64a}}
.flash{animation:flash .6s 3}
@keyframes flash{50%{opacity:.15}}
.zw,.actor{transform-box:view-box}
.smoke circle{animation:rise 3s ease-in-out infinite alternate}
@keyframes rise{to{transform:translate(6px,-6px)}}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.cmp th,.cmp td{border:2px solid var(--ink);padding:6px;text-align:left}.cmp th{background:var(--ink);color:var(--moon)}
.b2b{display:grid;gap:8px}.b2b div{background:#fff;color:var(--ink);border:var(--line);padding:8px}.b2b b{display:block}.b2b small{display:block;font-weight:400;font-size:12px}.b2b span{display:block;font-family:var(--display);font-size:20px;color:var(--blood)}
.zseg button{font-size:15px;padding:9px}
/* ---- CONTATTI ---- */
.pillars{display:grid;gap:10px}.pillars .panel{margin:0}.pillars .pi{font-size:26px}.pillars b{display:block;font-family:var(--display);font-weight:400;font-size:22px;margin-top:4px}.pillars p{font-weight:400;font-size:14px;margin-top:4px}
.values{display:grid;gap:10px}.values b{display:block}.values p{font-weight:400;font-size:14px;margin-top:2px}
.fl{display:block;font-size:14px;margin:10px 0 4px}.fl small{font-weight:400}
textarea.field{resize:vertical;font-weight:400}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;margin-top:10px}.ck input{width:20px;height:20px;flex:none;margin-top:1px}
.ferr{color:var(--blood);font-size:14px;min-height:20px;margin:8px 0}
.company div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:2px dashed rgba(20,15,31,.15)}.company div:last-child{border:0}.company span{font-weight:400;font-size:13px}.company b{text-align:right;font-size:14px}
.todo{background:#fff3cd;border:1.5px dashed var(--blood);color:var(--blood);font-size:11px;padding:1px 5px;font-weight:700}
.foot{background:var(--ink);color:#e5def5;border:var(--line);padding:16px;margin:14px 0}.foot p{font-weight:400;font-size:14px;margin-top:4px}.foot small{display:block;margin-top:12px;font-weight:400;font-size:11px;color:#9a91b8}
.musicfab{position:fixed;top:calc(env(safe-area-inset-top) + 12px);bottom:auto;left:max(62px,calc(50vw - 196px));right:auto;z-index:95;width:34px;height:34px;border:var(--line);background:var(--moon);box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center}
.musicfab.off{background:#cfc6e6}
@media (orientation:landscape) and (max-height:600px){body.inbattle .musicfab{bottom:8px;right:calc(env(safe-area-inset-right) + 8px)}}
.composer{padding-right:52px}
/* ---- errori ---- */
.errbox{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:200;width:min(480px,94vw);background:#fff3f3;border:3px solid var(--blood);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;font-size:13px}
.errbox b{display:block;color:var(--blood);font-size:15px}.errbox small{display:block;font-weight:400;margin:2px 0 6px}
.errbox code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-word;background:#fff;border:1.5px solid var(--ink);padding:6px;max-height:120px;overflow:auto}
.errbox div{display:flex;gap:8px;margin-top:8px}.errbox button{border:2px solid var(--ink);background:#fff;padding:6px 10px;font-size:13px}@keyframes alertb{50%{background:#5a1f2a}}
/* ---- PREMIO DEL GIORNO ---- */
.daily{background:#fff8d6}
.dtrack{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.dday{border:2px solid var(--ink);background:#fff;text-align:center;padding:3px 0}.dday small{display:block;font-size:9px;font-weight:400}.dday span{font-size:18px}
.dday.done{background:#e3f3e8}.dday.now{background:var(--moon);box-shadow:3px 3px 0 var(--blood);transform:translateY(-2px)}.dday.big span{font-size:22px}
.missions{border-top:2px dashed rgba(20,15,31,.2);margin-top:10px;padding-top:8px}.mis{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}.mis small{font-size:11px;font-weight:400}
/* ---- FINALI SIMULAZIONE ---- */
.finale{padding:0;overflow:hidden}.finale .fin-h{padding:10px 12px}.finale h3{margin-top:4px}
.fin-art svg{display:block;width:100%;height:auto;border-top:var(--line);border-bottom:var(--line)}
.finale p{padding:0 12px}.fin-list{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 12px}.fin-list span{font-size:11px;border:1.5px solid var(--ink);padding:2px 6px;background:#eee;color:#888}.fin-list span.on{background:var(--moon);color:var(--ink)}
/* ---- FORTUNA ---- */
.luck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.luckc{border:var(--line);background:var(--moon);box-shadow:4px 4px 0 var(--ink);padding:12px 8px;text-align:center}
.luckc .lk{font-size:34px;display:block}.luckc b{display:block;font-family:var(--display);font-weight:400;font-size:20px}.luckc small{font-size:13px}
.jarbar{display:flex;height:18px;border:2px solid var(--ink);background:#fff;margin:8px 0;overflow:hidden}.jarbar span{height:100%;border-right:1.5px solid var(--ink)}
.jarleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:400}.jarleg i{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink);margin-right:3px;vertical-align:-1px}
.wheelbox{position:relative;width:min(300px,80vw);margin:6px auto 14px}
.wheel{display:block;width:100%;height:auto;transform-origin:50% 50%;filter:drop-shadow(4px 4px 0 #140f1f)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:34px;color:var(--blood);z-index:2;-webkit-text-stroke:2px var(--ink);line-height:1}
.wres{text-align:center;min-height:52px;margin-top:10px;font-weight:700}
.odds{margin-top:10px;border:2px solid var(--ink);background:#fff;padding:8px 10px;font-size:13px}.odds summary{font-weight:700;cursor:pointer}.odds .row{padding:3px 0}

#fumetto{position:fixed;inset:0;z-index:400;background:#0c0912;display:flex;flex-direction:column;padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));overflow:hidden}
.ftop{display:flex;align-items:center;gap:8px;color:#fff;padding:4px 2px 8px}.ftop b{font-family:var(--display);font-size:20px;color:var(--moon);letter-spacing:.5px}.ftop span{flex:1;font-size:12.5px;color:#c9b8ff;font-weight:700}
.ftop button{width:38px;height:38px;border:3px solid #fff;background:none;color:#fff;font-weight:900;font-size:16px}
.fpage{flex:1;display:grid;grid-template-rows:27% 1fr 30%;gap:7px;min-height:0;background:#f3e9d2;padding:7px;border:3px solid #f3e9d2}
.frow{display:grid;grid-template-columns:1.05fr 1fr;gap:7px;min-height:0}
.fpan{position:relative;overflow:hidden;border:4px solid #140f1f;background:#241a4a;opacity:0;transform:scale(1.18) rotate(-1.5deg);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.fpan.in{opacity:1;transform:none}
.p3{transform:scale(1.18) rotate(1.5deg)}
.fbg,.fbg svg{position:absolute;inset:0;width:100%;height:100%}.fbg svg{object-fit:cover}
.fsvg{position:absolute;inset:0;width:100%;height:100%}
.fcap{position:absolute;left:6px;top:6px;background:#fff;border:3px solid #140f1f;padding:3px 8px;font-weight:800;font-size:12.5px;max-width:70%}
.fcap.r{left:auto;right:6px;top:auto;bottom:6px;background:var(--moon)}
.fcap.b{top:auto;bottom:6px;left:6px;right:6px;max-width:none;font-size:12.5px;line-height:1.3}
.fsfx{position:absolute;font-family:Bangers,Impact,sans-serif;color:#fff;-webkit-text-stroke:2px #140f1f;text-shadow:3px 3px 0 #140f1f,0 0 14px rgba(255,90,60,.7);transform:rotate(-8deg);letter-spacing:1px;opacity:0;transition:opacity .2s .35s,transform .3s .35s}
.fpan.in .fsfx{opacity:1}
.s1{right:10px;top:34px;font-size:26px;color:#c9ffd0}
.s2{left:6px;top:8px;font-size:24px;color:var(--moon)}
.win{left:50%;top:22%;font-size:48px;color:var(--moon);transform:translateX(-50%) rotate(-6deg) scale(.4)}.fpan.in .win{transform:translateX(-50%) rotate(-6deg) scale(1)}
.lose{left:50%;top:22%;font-size:44px;color:#ff5a3c;transform:translateX(-50%) rotate(5deg) scale(.4)}.fpan.in .lose{transform:translateX(-50%) rotate(5deg) scale(1)}
.fhorde{position:absolute;left:0;right:0;bottom:0;height:78%;}
.fhorde .zart{position:absolute;bottom:0;width:46%;height:auto;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));transform:translateX(-120%);transition:transform 1.1s cubic-bezier(.3,.8,.3,1) var(--d,0s)}
.fhorde .w0{left:-6%;bottom:2%;width:52%;z-index:3}.fhorde .w1{left:30%;bottom:12%;width:40%;z-index:2}.fhorde .w2{left:58%;bottom:20%;width:32%;z-index:1;filter:brightness(.7)}.fhorde .w3{left:12%;bottom:26%;width:28%;z-index:0;filter:brightness(.55)}.fhorde .w4{left:66%;bottom:30%;width:24%;z-index:0;filter:brightness(.45)}
.fpan.in .fhorde .zart{transform:none;animation:zbob .45s ease-in-out infinite alternate;animation-delay:calc(1.1s + var(--d,0s))}
@keyframes zbob{to{translate:0 -4px;rotate:2deg}}
.fhorde.in .zart{transform:none}.p4 .fhorde{height:60%}.p4 .fhorde .zart{width:30%}.p4 .fhorde .w0{left:30%}.p4 .fhorde .w1{left:52%}
.fhands{position:absolute;inset:0}.fhand{position:absolute;left:-60%;width:78%;transition:left .35s cubic-bezier(.2,1.4,.4,1)}
.fhand.h0{top:30%}.fhand.h1{top:52%;transition-delay:.12s}.fhand.h2{top:70%;transition-delay:.24s}
.fpan.in .fhand{left:-4%}
.fx{pointer-events:none}.fbam{transform-origin:205px 150px;transform:scale(0);transition:transform .25s cubic-bezier(.2,1.8,.4,1) .45s}.fpan.in .fbam{transform:scale(1)}
.fthrow .zart{position:absolute;bottom:18%;width:26%;opacity:.9}.fthrow .t0{left:4%;transform:rotate(-30deg)}.fthrow .t1{right:4%;transform:scaleX(-1) rotate(-30deg)}
.fpan.in .fthrow .t0{animation:flyl .9s ease-out both .2s}.fpan.in .fthrow .t1{animation:flyr .9s ease-out both .2s}
@keyframes flyl{from{transform:translate(60%,0) rotate(0)}to{transform:translate(-30%,-40%) rotate(-70deg)}}@keyframes flyr{from{transform:scaleX(-1) translate(60%,0) rotate(0)}to{transform:scaleX(-1) translate(-30%,-40%) rotate(-70deg)}}
.fshield{transform-origin:200px 140px;animation:shp 1.2s ease-in-out infinite alternate}@keyframes shp{to{opacity:.65;transform:scale(1.03)}}
.ffire{transform-origin:center bottom;animation:ffl .35s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes ffl{to{transform:scaleY(1.18) skewX(4deg)}}
.p4.ko .fbg{filter:saturate(.7) brightness(.75)}
.fbot{display:flex;gap:8px;padding-top:8px}.fbot .btn{flex:1}
#fumetto.done .fpage{animation:none}

.fpage{grid-template-rows:minmax(0,26fr) minmax(0,44fr) minmax(0,30fr)!important}
.frow{height:100%;grid-template-rows:100%}
.frow>.fpan,.fpage>.fpan{height:100%;min-height:0}
.p4 .fhorde{height:72%!important;bottom:4%!important}.p4 .fhorde .zart{width:19%!important;bottom:0!important}.p4 .fhorde .w0{left:34%!important}.p4 .fhorde .w1{left:56%!important}
.p4 .fsfx{top:10%!important}
.fthrow .zart{width:17%!important;bottom:26%!important}

.fsfx{z-index:6}.fcap{z-index:7}
.p4.ko .fhorde{height:58%!important;bottom:22%!important}.p4.ko .fhorde .zart{width:15%!important}.p4.ko .fhorde .w0{left:6%!important}.p4.ko .fhorde .w1{left:auto!important;right:6%!important}
.fbot .btn{font-size:15px!important;padding:10px 8px!important;line-height:1.15}

.frzb{filter:none!important;will-change:transform}

.fx-pioggia{animation:none!important;background:none!important;overflow:hidden}

<body>
<div id="app"></div>
<script>
/* Mostra gli errori in chiaro dentro l'app.
   Sul telefono il browser nasconde i dettagli ("Script error"): per questo
   avvolgiamo tutti i gestori (tocchi, timer, animazioni) e catturiamo l'errore vero. */
(function(){let shown=0;window.__last='avvio';
  function show(err,where){if(shown>2)return;shown++;
    const msg=err&&err.message?err.name+': '+err.message:String(err);
    const st=err&&err.stack?String(err.stack).split('\n').slice(0,4).map(s=>s.trim().replace(/\(?(blob|data|https?|about):[^)\s]*/g,'').trim()).join(' | '):'';
    const d=document.createElement('div');d.className='errbox';d.setAttribute('role','alert');
    d.innerHTML='<b>Si è verificato un errore</b><small></small><code></code><div><button type="button" data-c>Copia dettagli</button><button type="button" data-x>Chiudi</button></div>';
    d.querySelector('small').textContent='Fai uno screenshot di questo riquadro e mandalo in chat.';
    const full=msg+'\nDove: '+(where||'')+'\nUltima azione: '+window.__last+(st?'\n'+st:'')+'\n'+(navigator.userAgent.match(/(iPhone|iPad|Android)[^;)]*|Version\/[\d.]+|OS [\d_]+/g)||[]).join(' ');
    d.querySelector('code').textContent=full;
    d.querySelector('[data-x]').onclick=()=>d.remove();
    d.querySelector('[data-c]').onclick=()=>{try{navigator.clipboard.writeText(full);}catch(e){}};
    (document.body||document.documentElement).appendChild(d);}
  window.__report=show;
  const wrap=(fn,where)=>typeof fn!=='function'?fn:function(){try{return fn.apply(this,arguments);}catch(e){show(e,where);}};
  const ael=EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener=function(t,fn,o){if(typeof fn==='function'){if(!fn.__w)fn.__w=wrap(fn,'evento '+t);return ael.call(this,t,fn.__w,o);}return ael.call(this,t,fn,o);};
  const rel=EventTarget.prototype.removeEventListener;
  EventTarget.prototype.removeEventListener=function(t,fn,o){return rel.call(this,t,fn&&fn.__w||fn,o);};
  ['onclick','onpointerdown','onpointerup','onpointermove','onkeydown','onchange','oninput','onload','onerror'].forEach(p=>{
    const proto=p==='onload'||p==='onerror'?null:HTMLElement.prototype;if(!proto)return;
    const desc=Object.getOwnPropertyDescriptor(HTMLElement.prototype,p);if(!desc||!desc.set)return;
    Object.defineProperty(HTMLElement.prototype,p,{configurable:true,enumerable:true,get(){return desc.get.call(this);},
      set(fn){desc.set.call(this,typeof fn==='function'?wrap(function(ev){window.__last=p.slice(2)+' su '+(this.id?'#'+this.id:'')+(this.dataset?Object.keys(this.dataset).map(k=>'['+k+'='+this.dataset[k]+']').join(''):'')+(this.textContent?' «'+this.textContent.trim().slice(0,24)+'»':'');return fn.call(this,ev);},p):fn);}});});
  const st=window.setTimeout,si=window.setInterval,raf=window.requestAnimationFrame;
  window.setTimeout=function(fn,ms,...a){return st.call(window,wrap(fn,'timer'),ms,...a);};
  window.setInterval=function(fn,ms,...a){return si.call(window,wrap(fn,'intervallo'),ms,...a);};
  window.requestAnimationFrame=function(fn){return raf.call(window,wrap(fn,'animazione'));};
  window.addEventListener('error',e=>{if(e.error)show(e.error,'pagina');else if(e.message&&e.message!=='Script error.')show(new Error(e.message),(e.filename||'pagina')+':'+e.lineno);});
  window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&/play\(\)|NotAllowedError|AbortError|fullscreen|orientation/i.test(String(r.message||r)))return;show(r instanceof Error?r:new Error('Promessa rifiutata: '+String(r)),'promessa');});
})();
</script>
