const dist=d=>d<1000?d+' m':(d/1000).toFixed(1).replace('.',',')+' km';
const mapsLink=(name,z)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name+' '+((z&&z.address)||''))}`;
function bizSheet(b,z){const key='biz-'+(z.seed||7)+'-'+b.i;
  const nav=b.ll?`https://www.google.com/maps/dir/?api=1&destination=${b.ll[0]},${b.ll[1]}`:mapsLink(b.name,z);
  const tel=(b.tel||'').replace(/[^\d+]/g,'');const web=b.web&&/^https?:/.test(b.web)?b.web:(b.web?'https://'+b.web:'');
  openSheet(`${b.ic} ${esc(b.name)}`,`<p class="muted">${esc(b.cat)} · a ${dist(b.d)}${b.cand?' · <b style="color:#b8860b">📌 posto sponsor libero</b>':''}</p>
   <div class="row" style="gap:8px;align-items:center;margin:8px 0">${rvLine(key,5,4)}${rvBtn(key,b.name,5,4)}</div>
   <div class="splinks"><a class="btn small ghost" href="${nav}" target="_blank" rel="noopener">🧭 Indicazioni</a>${tel?`<a class="btn small ghost" href="tel:${tel}">📞 Chiama</a>`:''}${web?`<a class="btn small ghost" href="${esc(web)}" target="_blank" rel="noopener">🌐 Sito</a>`:''}</div>
   <div class="claim"><b>${b.cand?'Questa attività può diventare il presidio sponsor della zona':'È la tua attività?'}</b><p>${b.cand?'Bollino giallo sulla mappa, offerta con codice in cassa, preventivi dai clienti della zona, presidio nel gioco (+5% barricata a chi abita vicino) e statistiche.':'Mettiti in evidenza: bollino sulla mappa, offerte con codice, contatti diretti, presenza nel gioco e statistiche delle visite.'}</p><button class="btn wide" data-claim>${b.cand?'Diventa sponsor':'Mettiti in evidenza'}</button></div>`,
   card=>{card.querySelector('[data-claim]').onclick=()=>{closeSheet();S.motivo=b.cand?'sponsor':'negozio';S.motivoBiz=b.name;go('contatti');};});}
function poiSheet(r,z){const key='p-'+(z.address||'')+'-'+r.name;const ic=(RES_ICON[r.kind]||['📍'])[0];
  openSheet(`${ic} ${esc(r.name)}`,`<p class="muted">Servizio pubblico · a ${dist(r.dist)}</p><div class="row" style="gap:8px;align-items:center;margin:8px 0">${rvLine(key,6,4)}${rvBtn(key,r.name,6,4)}</div>
   <div class="splinks"><a class="btn small" href="${mapsLink(r.name,z)}" target="_blank" rel="noopener">🧭 Indicazioni</a></div>`);}
/* codice sconto personale */
function couponFor(k){S.coupons=S.coupons||{};let c=S.coupons[k];if(!c||c.exp<Date.now()){c={code:'ZSH-'+(SPONSORS[k].logo||'SP')+'-'+(1000+Math.floor(Math.random()*9000)),exp:Date.now()+7*864e5,used:false};S.coupons[k]=c;if(window.dbCoupon)dbCoupon(k,c);}return c;}
function couponHTML(k){const c=couponFor(k);const d=new Date(c.exp);
  return`<div class="coupon ${c.used?'used':''}"><small>Il tuo codice personale</small><b>${c.code}</b><span>${SP_OFF[k]||'Sconto per chi usa l’app'}</span><small>Valido fino al ${d.getDate()}/${d.getMonth()+1} · mostralo in cassa</small>
   ${c.used?'<em>✅ Codice usato: Crediti Casa Vera e Scudo aggiornati</em>':'<button class="btn small alt" data-cused>Ho usato il codice in negozio</button>'}</div>`;}
function useCoupon(k){const c=couponFor(k);if(c.used)return;c.used=true;S.couponUsed=true;
  if(typeof G!=='undefined'&&G.type){ccvInit();G.ccv.bal+=40;G.ccv.log.unshift({t:'Acquisto con codice da '+SPONSORS[k].name,c:40});toast('+40 Crediti Casa Vera nel gioco');}else{S.pend=(S.pend||[]).concat('coins');toast('Premio in attesa nel gioco');}sfx('coin');vibe();}
/* scheda sponsor completa */
sponsorSheet=function(k,z){const s=SPONSORS[k];if(window.dbEvent)dbEvent(k,'scheda');z=z||S.zone||{seed:7,address:''};const sp=sponsorSpots(z).find(x=>x.k===k);const L=SP_LINK[k]||{};
  openSheet(`⭐ ${esc(s.name)}`,`<p class="muted" style="margin-bottom:6px">${SP_CAT[k]||'Sponsor'}${sp?' · a '+dist(sp.d):''} · <b>partner verificato</b></p>
   <div class="row" style="gap:8px;align-items:center;margin-bottom:8px">${rvLine('sp-'+k,8,4.2)}${rvBtn('sp-'+k,s.name)}</div>
   <div class="spact">
     <button class="btn" data-sa="coupon">🎟️ Ottieni lo sconto</button>
     <button class="btn alt" data-sa="quote">📩 Chiedi un preventivo</button>
     ${L.tel?`<a class="btn ghost" href="tel:${L.tel}">📞 Chiama</a>`:`<button class="btn ghost" data-sa="tel">📞 Chiama</button>`}
     ${L.wa?`<a class="btn ghost" href="https://wa.me/${L.wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:`<button class="btn ghost" data-sa="wa">💬 WhatsApp</button>`}
     <a class="btn ghost" href="${mapsLink(s.name,z)}" target="_blank" rel="noopener">🧭 Indicazioni</a>
     ${L.web?`<a class="btn ghost" href="${L.web}" target="_blank" rel="noopener">🌐 Sito</a>`:''}${L.ig?`<a class="btn ghost" href="${L.ig}" target="_blank" rel="noopener">📷 Instagram</a>`:''}${L.fb?`<a class="btn ghost" href="${L.fb}" target="_blank" rel="noopener">📘 Facebook</a>`:''}
   </div>
   <div id="spBox"></div>
   <p style="font-weight:400;font-size:13px;margin-top:10px">Alleato del quartiere: lo trovi sulla mappa vera e come edificio nel gioco. Ogni acquisto con il codice alza il tuo <b>Scudo della casa vera</b>.</p>
   <button class="btn small ghost" data-tosp style="margin-top:8px">Tutti gli sponsor</button><p class="muted" style="font-size:11px;margin-top:6px">Contenuto sponsorizzato · contatti di esempio nell’anteprima.</p>`,
  card=>{const box=card.querySelector('#spBox');
    const showCoupon=()=>{box.innerHTML=couponHTML(k);const u=box.querySelector('[data-cused]');if(u)u.onclick=()=>{useCoupon(k);showCoupon();};};
    if(S.coupons&&S.coupons[k])showCoupon();
    card.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{const a=b.dataset.sa;vibe();
      if(a==='coupon'){showCoupon();box.scrollIntoView({behavior:'smooth',block:'center'});}
      else if(a==='quote'){box.innerHTML=`<div class="quote"><b>Richiesta a ${esc(s.name)}</b><input class="field" id="qN" placeholder="Nome"><input class="field" id="qT" placeholder="Telefono o email"><textarea class="field" id="qM" rows="3">${S.result?`Ho valutato la casa con ZombieSafeHouse (indice ${fmtI(S.result.idx)}). Vorrei un preventivo.`:'Vorrei un preventivo.'}</textarea><label class="row" style="gap:6px;font-size:12px;font-weight:400"><input type="checkbox" id="qOk"> Acconsento a essere ricontattato da questo sponsor</label><button class="btn wide" id="qGo">Invia la richiesta</button></div>`;
        box.querySelector('#qGo').onclick=()=>{if(!box.querySelector('#qN').value.trim()||!box.querySelector('#qT').value.trim()){toast('Scrivi nome e contatto');return;}if(!box.querySelector('#qOk').checked){toast('Serve il consenso per inoltrarla');return;}
          S.leads=(S.leads||0)+1;if(window.dbLead)dbLead(k,{name:box.querySelector('#qN').value.trim(),contact:box.querySelector('#qT').value.trim(),message:box.querySelector('#qM').value.trim()});box.innerHTML=`<div class="notice">✅ Richiesta inviata a ${esc(s.name)}. Ti ricontatterà a breve.</div>`;sfx('coin');};}
      else toast('Nella versione online: il contatto diretto dello sponsor');});
    card.querySelector('[data-tosp]').onclick=()=>{closeSheet();go('sponsor');};});};
/* acquisto con codice: vale anche per lo Scudo */
if(typeof scudoSteps==='function'){const _ss=scudoSteps;scudoSteps=function(){const s=_ss();if(S.couponUsed)s[4][2]=true;return s;};}
/* mappa illustrata interattiva (Mondo, quando la mappa vera non è disponibile) */
function fallbackMap(el,z){const info=document.createElement('div');info.className='mapinfo';info.innerHTML='<span class="muted">Tocca uno sponsor, un’attività, un servizio o un’area.</span>';
  const draw=()=>{const L=S.rmL||{spons:true,biz:true,pub:true,comm:false};let svg=mapScene(z,{poi:L.pub,users:false,heat:false,me:true,mode:'day',spons:L.spons,comm:L.comm});
    if(L.biz)svg=svg.replace(/<\/svg>\s*$/,bizLayer(z)+'</svg>');const m=el.querySelector('.fbm');m.innerHTML=svg;};
  el.insertAdjacentHTML('beforeend','<div class="fbm"></div>');el.appendChild(info);draw();{const w=el.closest('.mapwrap');const ri=w&&w.querySelector('.rm-info');if(ri)ri.remove();}
  el.onclick=e=>{const t=e.target;const sp=t.closest('[data-spn]'),bz=t.closest('[data-biz]'),po=t.closest('[data-poi]'),hx=t.closest('[data-hex]');
    if(sp){vibe();sponsorSheet(sp.dataset.spn,z);}else if(bz){vibe();bizSheet(bizSpots(z)[+bz.dataset.biz],z);}else if(po){vibe();poiSheet(z.resources[+po.dataset.poi],z);}else if(hx){info.innerHTML=hexInfo(z,+hx.dataset.hex);}};
  const box=el.closest('.mapwrap');if(box)box.querySelectorAll('[data-rml]').forEach(b=>b.onclick=()=>{S.rmL[b.dataset.rml]=!S.rmL[b.dataset.rml];b.classList.toggle('on');draw();});}
</script>
<script>
/* =========================================================
   SIMULAZIONE: DALLA CASA SINGOLA AL QUARTIERE
   - Mondo vero (Valuta → Simula): "La mia casa" | "Il mio quartiere"
     la notte simulata sulle aree della community (dati aggregati)
   - Mondo di gioco (Gioco → Quartiere): anteprima animata della
     notte su tutti gli edifici, prima di combattere
   ========================================================= */
S.simMode=S.simMode||'casa';S.qtog=S.qtog||{gruppo:false,raccolta:false,luci:false,rimedi:true};
const _renderGioco=renderGioco;
renderGioco=function(){if(S.simMode==='quart')return renderSimQuart();_renderGioco();const pg=app.querySelector('.page');if(pg&&!pg.querySelector('.simseg')){const h=pg.querySelector('h2');let anc=h;while(anc&&anc.parentElement!==pg)anc=anc.parentElement;(anc||pg.firstElementChild).insertAdjacentHTML('afterend',simSeg());bindSimSeg();}};
function simSeg(){return`<div class="seg simseg"><button class="${S.simMode==='casa'?'on':''}" data-sm="casa">🏠 La mia casa</button><button class="${S.simMode==='quart'?'on':''}" data-sm="quart">🏘️ Il mio quartiere</button></div>`;}
function bindSimSeg(){app.querySelectorAll('[data-sm]').forEach(b=>b.onclick=()=>{S.simMode=b.dataset.sm;vibe();renderGioco();window.scrollTo(0,0);});}
/* ---------- calcolo ---------- */
function svgPoint(svg,el){try{const r=el.getBoundingClientRect();if(r.width||r.height){const pt=svg.createSVGPoint();pt.x=r.x+r.width/2;pt.y=r.y+r.height/2;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return{x:q.x,y:q.y};}}catch(e){}try{const b=el.getBBox();return{x:b.x+b.width/2,y:b.y+b.height/2};}catch(e){return null;}}
function myIdxNow(){try{return computeScore(gameAnswers(),S.zone).idx;}catch(e){return S.result?S.result.idx:5;}}
function qCells(){const z=S.zone,cs=commCells(z).map((c,i)=>({...c,i}));const t=S.qtog;
  return cs.map(c=>{let a=c.n>=K_MIN?c.avg:(z.avgU||5.5);
    if(t.gruppo)a-=.7;if(t.luci)a-=.5;if(t.raccolta&&(z.resources||[]).length)a-=.35;a=Math.max(1,Math.min(10,a));
    return{...c,eff:a,known:c.n>=K_MIN,out:a<=4.2?'tiene':a<=6?'regge':'cede'};});}
function myCell(cs,svg){const me=svg&&[...svg.querySelectorAll('text')].find(t=>t.textContent.trim()==='TU');let p=me?svgPoint(svg,me):null;if(!p)p={x:200,y:210};
  let best=null,bd=1e9;cs.forEach(c=>{const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<bd){bd=d;best=c;}});return best;}
/* ---------- pagina: il mio quartiere (mondo vero) ---------- */
function renderSimQuart(){
  if(!S.zone){app.innerHTML=`<div class="page"><h2 class="disp" style="font-size:32px;margin-top:6px">Simulazione</h2>${simSeg()}<div class="notice">Per simulare il quartiere serve l’indirizzo della tua casa.</div><button class="btn wide" data-go="valuta">Valuta la mia casa</button></div>`;bindSimSeg();if(typeof bindGo==='function')bindGo();return;}
  const cs=qCells(),tot=cs.reduce((a,c)=>a+c.n,0),avg=cs.reduce((a,c)=>a+c.avg*c.n,0)/Math.max(1,tot);
  app.innerHTML=`<div class="page"><h2 class="disp" style="font-size:32px;margin-top:6px">Simulazione del quartiere</h2>${simSeg()}
   <p class="muted" style="margin:4px 0 10px">La tua zona vera, area per area: come passerebbe la notte. Solo dati aggregati, mai una casa singola.</p>
   <div class="panel mapwrap" style="padding:0;overflow:hidden;position:relative"><div id="qmap">${mapScene(S.zone,{poi:true,users:false,heat:false,me:true,mode:'night',spons:true,comm:true})}</div><div class="qcap" id="qcap"></div><div class="qclock" id="qclock"></div><div class="qbar"><i id="qprog"></i></div><div class="qlive" id="qlive"></div><div class="mapinfo qinfo" id="qinfo"><span class="muted">Lancia la notte, poi tocca un’area per i dettagli.</span></div></div>
   <div class="grid3 qstats"><div class="stat"><b>${cs.length}</b><small>aree</small></div><div class="stat"><b>${tot}</b><small>vicini nella community</small></div><div class="stat"><b>${fmtI(avg)}</b><small>indice medio</small></div></div>
   <div class="panel"><b class="disp" style="font-size:20px">Strategie del quartiere</b><small class="muted" style="display:block;margin-bottom:6px">Accendile e rilancia la notte: guarda cosa cambia.</small>
    ${[['rimedi','🏠 La mia casa con i rimedi applicati in Simula'],['gruppo','👥 Gruppo di quartiere nell’app: i vicini si avvisano e si aiutano'],['raccolta','🏥 Punti di raccolta ai servizi pubblici'],['luci','💡 Luci a sensore nelle vie (offerta sponsor)']].map(([k,l])=>`<label class="qtog"><input type="checkbox" data-qt="${k}" ${S.qtog[k]?'checked':''}><span>${l}</span></label>`).join('')}</div>
   <button class="btn wide" id="qGo">🌙 Simula la notte del quartiere</button><div id="qrep"></div></div>`;
  bindSimSeg();app.querySelectorAll('[data-qt]').forEach(c=>c.onchange=()=>{S.qtog[c.dataset.qt]=c.checked;vibe();});
  $('#qGo').onclick=qSiege;}
function qSiege(){const box=$('#qmap'),svg=box.querySelector('svg');if(!svg)return;const btn=$('#qGo');btn.disabled=true;$('#qrep').innerHTML='';
  box.scrollIntoView({behavior:'smooth',block:'start'});
  const cs=qCells(),me=myCell(cs,svg);const myIdx=S.qtog.rimedi?myIdxNow():(S.result?S.result.idx:myIdxNow());
  me.eff=Math.min(me.eff,myIdx);me.out=myIdx<=4.2?'tiene':myIdx<=6?'regge':'cede';
  const NS='http://www.w3.org/2000/svg';let L=svg.querySelector('#qsimL');if(L)L.remove();L=document.createElementNS(NS,'g');L.id='qsimL';L.setAttribute('pointer-events','none');svg.appendChild(L);
  const vb=svg.viewBox.baseVal,W=vb&&vb.width||400,H=vb&&vb.height||420;const DUR=20000;
  const live=$('#qlive'),prog=$('#qprog');const cnt={tiene:0,regge:0,cede:0};const upd=()=>{if(live)live.innerHTML=`<span class="ok">✓ ${cnt.tiene} tengono</span><span class="mid">! ${cnt.regge} reggono</span><span class="ko">✕ ${cnt.cede} cedono</span>`;};upd();
  const cap=t=>{const c=$('#qcap');if(!c)return;c.textContent=t;c.classList.remove('in');void c.offsetWidth;c.classList.add('in');};
  const clock=t=>{const c=$('#qclock');if(c)c.textContent=t;};
  const hexEl=i=>svg.querySelector(`[data-hex="${i}"]`);
  const paint=(c,col,op)=>{const h=hexEl(c.i);if(!h)return;(h.tagName==='path'?[h]:[...h.querySelectorAll('path,polygon')]).forEach(p=>{p.style.transition='fill .5s,fill-opacity .5s';p.setAttribute('fill',col);p.setAttribute('fill-opacity',op);});};
  cs.forEach(c=>paint(c,'#1a1433',.35));
  /* gli zombie puntano soprattutto alle aree deboli */
  const pool=[];cs.forEach(c=>{const w=Math.max(1,Math.round((c.eff-2)*1.6));for(let k=0;k<w;k++)pool.push(c);});
  const Z=[];for(let k=0;k<64;k++){const side=k%3,sx=side===0?Math.random()*W:side===1?-10:W+10,sy=side===0?H+10:Math.random()*H;const tg=pool[Math.floor(Math.random()*pool.length)];
    const e=document.createElementNS(NS,'circle');e.setAttribute('r','4.2');e.setAttribute('fill','#7bd36b');e.setAttribute('stroke','#140f1f');e.setAttribute('stroke-width','1.5');L.appendChild(e);Z.push({e,sx,sy,tx:tg.x+(Math.random()-.5)*22,ty:tg.y+(Math.random()-.5)*22,d:Math.random()*5000});}
  const t0=performance.now();let raf;(function mv(){if(!document.body.contains(svg))return;const t=performance.now()-t0;Z.forEach(z=>{const p=Math.max(0,Math.min(1,(t-z.d)/8000));const q=1-Math.pow(1-p,2);z.e.setAttribute('cx',z.sx+(z.tx-z.sx)*q);z.e.setAttribute('cy',z.sy+(z.ty-z.sy)*q+Math.sin(t/180+z.d)*1.4);});
    if(prog)prog.style.width=Math.min(100,t/DUR*100)+'%';if(t<DUR+400)raf=requestAnimationFrame(mv);})();
  const col={tiene:'#3f9b5f',regge:'#f7d64a',cede:'#d7263d'};
  const mark=(c,txt,size=16)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',c.x);t.setAttribute('y',c.y+6);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',size);t.setAttribute('font-family','Bangers,Impact');t.setAttribute('stroke','#140f1f');t.setAttribute('stroke-width','3');t.setAttribute('paint-order','stroke');t.setAttribute('fill','#fff');t.textContent=txt;L.appendChild(t);return t;};
  const ring=document.createElementNS(NS,'circle');ring.setAttribute('cx',me.x);ring.setAttribute('cy',me.y);ring.setAttribute('r','30');ring.setAttribute('fill','none');ring.setAttribute('stroke','#f7d64a');ring.setAttribute('stroke-width','4');ring.setAttribute('stroke-dasharray','6 5');ring.innerHTML='<animate attributeName="r" values="26;34;26" dur="1.2s" repeatCount="indefinite"/>';L.appendChild(ring);
  const T=(ms,f)=>setTimeout(()=>{if(document.body.contains(svg))try{f();}catch(e){}},ms);
  /* ogni area si decide nel corso della notte: prima le più deboli */
  const order=cs.slice().sort((a,b)=>b.eff-a.eff);
  order.forEach((c,k)=>{const at=4000+k/order.length*12500;T(at,()=>{paint(c,col[c.out],c.known?.62:.38);cnt[c.out]++;upd();
    if(c.out==='cede'){const m=mark(c,'💥',18);setTimeout(()=>{m.textContent='✕';},700);sfx('crack');}else if(c===me||c.known)mark(c,c.out==='tiene'?'✓':'!');});});
  const steps=[[0,'22:00','L’orda arriva dalla campagna e dalle strade di ingresso.'],[3500,'23:00','Gli zombie puntano alle aree meno preparate.'],
   [7500,'00:30',S.qtog.gruppo?'Il gruppo di quartiere si attiva: i vicini si avvisano e si aiutano.':'Ogni casa si difende da sola: nessuno avvisa i vicini.'],
   [11500,'02:00',S.qtog.raccolta?'I servizi pubblici diventano punti di raccolta sicuri.':'Il momento più duro della notte.'],[15500,'04:30',S.qtog.luci?'Le luci a sensore nelle vie rallentano l’orda.':'L’orda insiste sulle ultime aree.'],[18000,'06:00','Alba. Ecco come ha passato la notte il quartiere.']];
  steps.forEach(([ms,h,t])=>T(ms,()=>{clock(h);cap(t);}));
  T(1,()=>sfx('horn'));
  T(7600,()=>{if(S.qtog.gruppo)cs.filter(c=>Math.hypot(c.x-me.x,c.y-me.y)<90&&c!==me).forEach(c=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',me.x);l.setAttribute('y1',me.y);l.setAttribute('x2',c.x);l.setAttribute('y2',c.y);l.setAttribute('stroke','#7bd36b');l.setAttribute('stroke-width','3');l.setAttribute('stroke-dasharray','5 4');L.appendChild(l);});});
  T(DUR,()=>{cancelAnimationFrame(raf);Z.forEach(z=>z.e.setAttribute('opacity','.22'));sfx('win');btn.disabled=false;btn.textContent='🌙 Rilancia la notte';
    /* dopo la notte ogni area si può toccare */
    svg.addEventListener('click',ev=>{let c=null;const h=ev.target.closest&&ev.target.closest('[data-hex]');if(h)c=cs.find(x=>x.i===+h.dataset.hex);
      if(!c){try{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());let bd=1e9;cs.forEach(x=>{const d=Math.hypot(x.x-q.x,x.y-q.y);if(d<bd){bd=d;c=x;}});if(bd>45)c=null;}catch(e){}}
      if(c){ev.stopPropagation();qArea(c,c===me);}});
    qReport(cs,me);});}
function qArea(c,mine){const tips={tiene:'Area preparata: tenetela così, invitate chi non ha ancora valutato la casa.',regge:'Regge a fatica: luci, gruppo di quartiere e qualche rinforzo alle porte fanno la differenza.',cede:'Area esposta: è qui che servono di più i rimedi e il gruppo di quartiere.'};
  const i=$('#qinfo');if(!i)return;i.innerHTML=`<b>${mine?'⭐ La tua area':'Area del quartiere'} · ${c.out==='tiene'?'✓ tiene':c.out==='regge'?'! regge a fatica':'✕ cederebbe'}</b>
   <span>${c.known?`${c.n} vicini hanno valutato la casa · indice medio ${fmtI(c.avg)}`:'Meno di 5 vicini: dati non mostrati, stima sulla zona'}</span><span>${tips[c.out]}</span>`;i.classList.remove('flash');void i.offsetWidth;i.classList.add('flash');vibe();}
function qReport(cs,me){const n=k=>cs.filter(c=>c.out===k).length,pp=k=>cs.filter(c=>c.out===k).reduce((a,c)=>a+c.n,0),tot=Math.max(1,cs.reduce((a,c)=>a+c.n,0));
  const safe=Math.round((pp('tiene')+pp('regge')*.5)/tot*100);const nights=Math.max(1,Math.round(30-cs.reduce((a,c)=>a+c.eff,0)/cs.length*3.2));
  const prev=S.qlast;S.qlast={safe,cede:n('cede')};const delta=prev?`<div class="qdelta ${safe>=prev.safe?'up':'down'}">Rispetto alla notte prima: ${safe-prev.safe>=0?'+':''}${safe-prev.safe}% vicini al sicuro · ${prev.cede-n('cede')>=0?prev.cede-n('cede'):'−'+(n('cede')-prev.cede)} aree in meno che cedono</div>`:'';
  const sp=Object.keys(SPONSORS);const out={tiene:'tiene',regge:'regge a fatica',cede:'cederebbe'}[me.out];
  const acts=[];if(!S.qtog.gruppo)acts.push(['👥','Attiva il gruppo di quartiere','I vicini si avvisano: le aree vicine reggono meglio.','qt:gruppo']);
  if(!S.qtog.luci&&sp[0])acts.push(['💡','Luci a sensore nelle vie',`${SPONSORS[sp[0]].name}: ${SP_OFF[sp[0]]||'offerta per la community'}`,'sp:'+sp[0]]);
  if(me.out!=='tiene')acts.push(['🏠','Rinforza la tua casa','Applica i rimedi in “La mia casa”: la tua area è tra le più esposte.','casa']);
  acts.push(['📣','Invita i vicini','Più vicini valutano la casa, più la simulazione diventa precisa.','inv']);
  $('#qrep').innerHTML=`<div class="panel qrep"><b class="disp" style="font-size:24px">Il quartiere dopo la notte</b>
   <div class="grid3" style="margin-top:8px"><div class="stat ok"><b>${n('tiene')}</b><small>aree tengono</small></div><div class="stat mid"><b>${n('regge')}</b><small>reggono a fatica</small></div><div class="stat ko"><b>${n('cede')}</b><small>cederebbero</small></div></div>
   <div class="qbig"><div><b>${safe}%</b><small>dei vicini al sicuro</small></div><div><b>${nights}</b><small>notti di resistenza del quartiere</small></div><div><b>${out}</b><small>la tua area</small></div></div>
   ${delta}<p class="muted" style="font-size:12px;margin-top:6px">👆 Tocca un’area sulla mappa per vederne il dettaglio.</p>
   <b style="display:block;margin-top:10px">Cosa farebbe la differenza</b>${acts.map(a=>`<button class="qact" data-qa="${a[3]}"><span>${a[0]}</span><b>${a[1]}</b><small>${a[2]}</small></button>`).join('')}
   <p class="muted" style="font-size:11.5px;margin-top:8px">Simulazione su dati aggregati per area (almeno 5 utenti). Nessuna casa singola viene mostrata o valutata.</p></div>`;
  $('#qrep').querySelectorAll('[data-qa]').forEach(b=>b.onclick=()=>{const a=b.dataset.qa;vibe();
    if(a.startsWith('qt:')){S.qtog[a.slice(3)]=true;renderSimQuart();setTimeout(qSiege,300);}
    else if(a.startsWith('sp:'))sponsorSheet(a.slice(3),S.zone);
    else if(a==='casa'){S.simMode='casa';renderGioco();window.scrollTo(0,0);}
    else{const txt='Valuta la tua casa con ZombieSafeHouse e aiuta il nostro quartiere a reggere la notte!';if(navigator.share)navigator.share({title:'ZombieSafeHouse',text:txt}).catch(()=>{});else toast('Messaggio pronto da condividere');}});
  }
/* ---------- gioco: anteprima della notte sul quartiere ---------- */
function preNightCalc(){const L=G.level,att=1+L*.13;const res=[];
  Object.entries(G.lots||{}).forEach(([id,o])=>{const lot=LOTS.find(l=>l.id===id);if(!lot)return;const isB=o.kind==='bld';
    const def=1.1+(o.lv||1)*.55+(o.prep||0)*.3+(o.fort||0)*.35+(isB?.5:0)+(o.ten?.25:0);const r=def/att;
    res.push({id,name:isB?(BLD[o.b]?BLD[o.b].name:'Edificio'):(lot.kind.charAt(0).toUpperCase()+lot.kind.slice(1)),out:r>=1.0?'tiene':r>=.78?'rischio':'cade'});});
  const sl=typeof scudoLv==='function'?scudoLv():0;const hr=(1.6+(G.fort?Object.keys(G.fort).length*.1:0)+sl*.12)/att;
  return{home:hr>=1.1?'tiene':hr>=.8?'rischio':'cade',res,L};}
function preNight(){const hood=app.querySelector('.hood'),svg=hood&&hood.querySelector('svg');if(!svg)return;hood.scrollIntoView({behavior:'smooth',block:'center'});
  const NS='http://www.w3.org/2000/svg';let L=svg.querySelector('#preL');if(L)L.remove();L=document.createElementNS(NS,'g');L.id='preL';svg.appendChild(L);
  const vb=svg.viewBox.baseVal,W=vb&&vb.width||400,H=vb&&vb.height||680,y0=(vb&&vb.y||0);
  const C=preNightCalc();const targets=C.res.map(r=>{const el=svg.querySelector(`[data-lot="${r.id}"]`);const p=el&&svgPoint(svg,el);return p?{...r,...p}:null;}).filter(Boolean);
  const meT=[...svg.querySelectorAll('text')].find(t=>t.textContent.trim()==='TU');const mp=meT&&svgPoint(svg,meT);if(mp)targets.push({id:'home',name:'Casa tua',out:C.home,...mp});
  const Z=[];for(let k=0;k<40;k++){const tg=targets.length?targets[k%targets.length]:{x:W/2,y:H/2};const e=document.createElementNS(NS,'circle');e.setAttribute('r','4.5');e.setAttribute('fill','#7bd36b');e.setAttribute('stroke','#140f1f');e.setAttribute('stroke-width','1.5');L.appendChild(e);
    Z.push({e,sx:40+Math.random()*(W-80),sy:y0+H-10,tx:tg.x+(Math.random()-.5)*16,ty:tg.y+(Math.random()-.5)*16,d:Math.random()*2400});}
  const t0=performance.now();(function mv(){const t=performance.now()-t0;Z.forEach(z=>{const p=Math.max(0,Math.min(1,(t-z.d)/6000)),q=1-Math.pow(1-p,2);z.e.setAttribute('cx',z.sx+(z.tx-z.sx)*q);z.e.setAttribute('cy',z.sy+(z.ty-z.sy)*q);});if(t<9000&&document.body.contains(svg))requestAnimationFrame(mv);})();
  sfx('horn');toast(`Anteprima della notte ${C.L}: l’orda esce dal cimitero`);
  setTimeout(()=>{if(!document.body.contains(svg))return;const col={tiene:'#3f9b5f',rischio:'#f7d64a',cade:'#d7263d'},ic={tiene:'✓',rischio:'!',cade:'✕'};
    targets.forEach(t=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',t.x);c.setAttribute('cy',t.y-18);c.setAttribute('r','11');c.setAttribute('fill',col[t.out]);c.setAttribute('stroke','#140f1f');c.setAttribute('stroke-width','2.5');L.appendChild(c);
      const x=document.createElementNS(NS,'text');x.setAttribute('x',t.x);x.setAttribute('y',t.y-13.5);x.setAttribute('text-anchor','middle');x.setAttribute('font-size','13');x.setAttribute('font-weight','900');x.setAttribute('fill',t.out==='rischio'?'#140f1f':'#fff');x.textContent=ic[t.out];L.appendChild(x);});
    Z.forEach(z=>z.e.setAttribute('opacity','.3'));sfx(targets.some(t=>t.out==='cade')?'crack':'win');
    const box=$('#preRep');if(box){const k=o=>targets.filter(t=>t.out===o);const risk=k('rischio').concat(k('cade'));
      box.innerHTML=`<div class="panel qrep"><b class="disp" style="font-size:22px">Anteprima della notte ${C.L}</b>
       <div class="grid3" style="margin-top:6px"><div class="stat ok"><b>${k('tiene').length}</b><small>tengono</small></div><div class="stat mid"><b>${k('rischio').length}</b><small>a rischio</small></div><div class="stat ko"><b>${k('cade').length}</b><small>cadrebbero</small></div></div>
       ${risk.length?`<p style="font-weight:400;margin:8px 0 4px">Da rinforzare prima di combattere:</p><ul class="prl">${risk.slice(0,6).map(t=>`<li><span style="color:${col[t.out]}">●</span> ${esc(t.name)} · ${t.out==='cade'?'cadrebbe':'a rischio'}</li>`).join('')}</ul>`:'<p style="font-weight:400;margin-top:8px">Il quartiere è pronto: tutti gli edifici reggono.</p>'}
       <div class="row" style="gap:8px;margin-top:8px"><button class="btn small ghost" data-pr="pot">🛠️ Rinforza</button><button class="btn small" data-pr="go">⚔️ Difendi ora</button></div></div>`;
      box.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{if(b.dataset.pr==='pot'){G.sub='pot';renderHub();window.scrollTo(0,0);}else{window.scrollTo(0,0);const f=$('#fight');if(f)f.click();}});
      box.scrollIntoView({behavior:'smooth',block:'nearest'});}},6800);}
function addPreNight(){if((G.sub||'q')!=='q'||app.querySelector('#preBtn'))return;const hood=app.querySelector('.hood');if(!hood)return;const pan=hood.closest('.panel')||hood;
  pan.insertAdjacentHTML('afterend',`<button class="btn wide alt" id="preBtn" style="margin-top:8px">🎬 Anteprima della notte ${G.level} sul quartiere</button><div id="preRep"></div>`);$('#preBtn').onclick=()=>{vibe();preNight();};}
</script>
<script>
/* =========================================================
   L'ACCOMPAGNATORE: guida passo passo per chi non è pratico
   - pulsante "🙋 Aiuto" sempre visibile
   - modalità "accompagnami": a ogni schermata dice cosa fare,
     con "Mostrami dove" che illumina il punto da toccare
   - domande libere all'IA (con risposte di riserva se offline)
   - testo grande e lettura ad alta voce
   ========================================================= */
S.acc=S.acc||{on:false,asked:false,big:false};
const ACC_FAQ=[[/scudo/i,'Lo Scudo della casa vera va da 0 a 5. Sale quando valuti la casa, migliori l’indice, fai le missioni reali e compri dagli sponsor con il codice. Nel gioco ti dà una barricata più forte.'],
 [/codice|sconto/i,'Apri Mondo, tocca un bollino giallo (uno sponsor) e poi “Ottieni lo sconto”. Il codice vale 7 giorni: mostralo in cassa.'],
 [/preventiv/i,'Apri la scheda di uno sponsor e tocca “Chiedi un preventivo”: scrivi nome e telefono, metti la spunta del consenso e invia.'],
 [/indice/i,'L’indice va da 0 a 10: più è basso, più la casa è sicura. Lo trovi nel verdetto della valutazione.'],
 [/foto/i,'Nella valutazione, passo 2: tocca i tre riquadri e fotografa la porta, una finestra del piano terra e il cancello. Le foto non vengono salvate.'],
 [/gioc|zombie|notte|carte/i,'Nel Gioco scegli la tua casa e tocca “Difendi il quartiere”. Alla prima notte un tutorial ti spiega tutto. Le carte si trascinano sulla strada dove arrivano gli zombie.'],
 [/quartiere/i,'In Simula trovi “Il mio quartiere”: mostra come passerebbe la notte la tua zona, area per area, senza mai mostrare le case dei singoli.'],
 [/privacy|dati/i,'I dati della tua casa restano sul tuo profilo. Sulla mappa non compaiono mai case private, solo aree con almeno 5 persone.'],
 [/sponsor|negozi|attivit/i,'Gli sponsor sono negozi e professionisti della tua zona. Li trovi in Mondo con il bollino giallo: offrono sconti, preventivi e recensioni vere.']];
function accNext(){const t=S.tab;const q=s=>document.querySelector(s);
  if(t==='home')return['Iniziamo dalla tua casa','Tocca il pulsante rosso “Valuta la mia casa”.','[data-go=valuta]'];
  if(t==='valuta'){
    if(!S.zone)return['Passo 1 · L’indirizzo','Scrivi qui l’indirizzo di casa tua, per esempio “Via Roma 10, Volta Mantovana”. Poi tocca “Analizza la zona”.','#addr'];
    if((S.step||0)===0)return['Passo 1 · La tua zona','Questa è la tua zona. Quando hai guardato, tocca “Avanti: le foto”.','#next0'];
    if(S.step===1)return['Passo 2 · Tre foto','Tocca i riquadri e fotografa porta, finestra e cancello. Poi tocca “Analizza con l’IA”. Se non vuoi fare foto, puoi andare direttamente alle domande in alto.','#aiBtn'];
    if(S.step===2){const o=q('.opt:not(.on)');return['Passo 3 · Le domande','Rispondi toccando la frase giusta. Una domanda alla volta: non c’è fretta.',o?'.opt:not(.on)':null];}
    return['Passo 4 · Il verdetto','Questo è il risultato: più l’indice è basso, più la casa è sicura. Sotto trovi i consigli. Poi prova la simulazione della notte.','[data-go=gioco]'];}
  if(t==='gioco'){if(S.simMode==='quart')return['Il tuo quartiere','Tocca “Simula la notte del quartiere” e guarda come reagisce la tua zona.','#qGo'];
    return['La simulazione','Tocca “Simula la notte dell’assedio” per vedere cosa succede alla tua casa. Poi prova i potenziamenti con “Applica”.','#siege'];}
  if(t==='mappa'){if(S.zv==='mondo')return['La mappa del paese','Scrivi il tuo indirizzo e tocca “Vai”. Poi tocca un bollino giallo per vedere offerte e contatti.','#mq'];
    return['La tua zona','In alto scegli: Sicurezza, Vivere qui, Vacanza o Mondo. “Mondo” mostra gli sponsor e i negozi.','[data-zv=mondo]'];}
  if(t==='orda'){if(typeof G==='undefined'||!G.type)return['Il gioco','Scegli il tipo di casa con cui giocare: tocca una delle case.','[data-type]'];
    if(G.view==='battle')return['La battaglia','Trascina una carta sulla strada dove arrivano gli zombie. Il tasto “Pausa” ferma tutto.','#hand'];
    return['La tua notte','Tocca il grande pulsante rosso “Difendi il quartiere”: la prima volta ti guida un tutorial.','#fight'];}
  return['Ricominciamo','Tocca “Casa” in basso a sinistra per tornare all’inizio.','[data-tab=home]'];}
function accShow(sel){document.querySelectorAll('.acc-hl').forEach(e=>e.classList.remove('acc-hl'));document.querySelectorAll('.acc-tip').forEach(e=>e.remove());
  const el=sel&&document.querySelector(sel);if(!el){toast('Scorri la pagina: il punto giusto è più in basso');return;}
  el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('acc-hl');
  setTimeout(()=>{const r=el.getBoundingClientRect();const tip=document.createElement('div');tip.className='acc-tip';tip.textContent='👆 Tocca qui';tip.style.left=Math.max(8,Math.min(innerWidth-130,r.left+r.width/2-60))+'px';tip.style.top=(r.bottom+8)+'px';document.body.appendChild(tip);},450);
  const off=()=>{el.classList.remove('acc-hl');document.querySelectorAll('.acc-tip').forEach(e=>e.remove());document.removeEventListener('pointerdown',off,true);};
  setTimeout(()=>document.addEventListener('pointerdown',off,true),500);setTimeout(off,9000);}
function accSay(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function accBar(){let b=document.getElementById('accBar');if(!S.acc.on){if(b)b.remove();return;}
  const [h,t,sel]=accNext();if(!b){b=document.createElement('div');b.id='accBar';document.body.appendChild(b);}
  b.innerHTML=`<div class="ab-t"><b>🙋 ${h}</b><span>${t}</span></div><div class="ab-b">${sel?'<button data-ab="show">Mostrami dove</button>':''}<button data-ab="guide">📖 Guida</button><button data-ab="x" aria-label="Chiudi">✕</button></div>`;
  b.querySelectorAll('[data-ab]').forEach(x=>x.onclick=e=>{e.stopPropagation();const a=x.dataset.ab;if(a==='show')accShow(sel);if(a==='guide')guideSheet(0);if(a==='x'){S.acc.on=false;accBar();toast('Accompagnatore spento: lo riaccendi con 🙋');}});}
function accPanel(){const [h,t,sel]=accNext();
  openSheet('🙋 Ti accompagno io',`<div class="accp"><div class="accnow"><small>Adesso</small><b>${h}</b><p>${t}</p>${sel?'<button class="btn wide" data-ap="show">👆 Mostrami dove toccare</button>':''}</div>
   <button class="btn wide alt" data-ap="guide" style="margin-bottom:8px">📖 Guida passo passo, con le scritte</button>
   <label class="qtog"><input type="checkbox" data-ap="on" ${S.acc.on?'checked':''}><span>Accompagnami passo passo in tutta l’app</span></label>
   <label class="qtog"><input type="checkbox" data-ap="big" ${S.acc.big?'checked':''}><span>Scritte più grandi</span></label>
   <div class="accq"><b>Fai una domanda</b><small>Scrivi come parleresti a una persona: “come prendo lo sconto?”, “cos’è lo scudo?”</small>
   <div class="row" style="gap:6px;margin-top:6px"><input class="field" id="accIn" placeholder="La tua domanda"><button class="btn small" data-ap="ask">Chiedi</button></div><div id="accOut"></div></div>
   <div class="accfaq">${['Come prendo lo sconto?','Cos’è lo Scudo?','Come si gioca?','I miei dati sono al sicuro?'].map(q=>`<button data-faq="${q}">${q}</button>`).join('')}</div></div>`,
  card=>{const ask=async q=>{const out=card.querySelector('#accOut');if(!q)return;out.innerHTML='<p class="muted">Ci penso…</p>';
      const loc=ACC_FAQ.find(([re])=>re.test(q));let ans=null;
      try{ans=await Promise.race([askAI('Sei l’accompagnatore dell’app ZombieSafeHouse. Rispondi in italiano semplicissimo, frasi brevi, massimo 4 frasi, indicando quale pulsante toccare. Sezioni: Casa, Valuta (indirizzo, 3 foto, domande, verdetto), Simula (La mia casa, Il mio quartiere), Gioco (quartiere, battaglia con carte, Arena, Amici), Mondo (mappa, sponsor con codice sconto e preventivo, Vivere qui, Vacanza). Lo Scudo della casa vera sale con valutazione, indice migliore, missioni reali e acquisti con codice.',[{role:'user',content:q}]),new Promise((_,r)=>setTimeout(()=>r(new Error('tempo')),9000))]);}catch(e){}
      out.innerHTML=`<div class="accans">${esc(ans||(loc?loc[1]:'Posso aiutarti su valutazione, simulazione, sponsor e gioco. Prova a chiedere: “come prendo lo sconto?”'))}</div>`;};
    card.querySelectorAll('[data-ap]').forEach(x=>{const a=x.dataset.ap;
      if(a==='show')x.onclick=()=>{closeSheet();setTimeout(()=>accShow(sel),250);};
      if(a==='guide')x.onclick=()=>guideSheet(0);
      if(a==='on')x.onchange=()=>{S.acc.on=x.checked;accBar();};
      if(a==='big')x.onchange=()=>{S.acc.big=x.checked;document.body.classList.toggle('bigtxt',x.checked);};
      if(a==='ask')x.onclick=()=>ask(card.querySelector('#accIn').value.trim());});
    card.querySelectorAll('[data-faq]').forEach(x=>x.onclick=()=>{card.querySelector('#accIn').value=x.dataset.faq;ask(x.dataset.faq);});});}
/* pulsante sempre visibile + proposta alla prima apertura */
(function(){const f=document.createElement('button');f.id='accFab';f.innerHTML='🙋<span>Aiuto</span>';f.setAttribute('aria-label','Aiuto: ti accompagno io');f.onclick=e=>{e.stopPropagation();vibe();accPanel();};document.body.appendChild(f);

    d.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>{if(x.dataset.h==='y'){S.acc.on=true;accBar();}d.remove();});},1800);}
  let tm=null;const ob=new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(()=>{if(S.acc.on)accBar();const fb=document.getElementById('accFab');if(fb)fb.style.display=document.body.classList.contains('inbattle')?'none':'';},350);});
  ob.observe(document.getElementById('app'),{childList:true,subtree:false});})();

/* ---------- guida passo passo scritta ---------- */
const GUIDE=[
 ['🏠','Valuta la tua casa','Dalla pagina Casa tocca il pulsante rosso “Valuta la mia casa”. Ci vogliono circa 5 minuti.',()=>{go('valuta');},'#addr'],
 ['📍','Scrivi l’indirizzo','Scrivi l’indirizzo di casa tua, per esempio “Via Roma 10, Volta Mantovana”, poi tocca “Analizza la zona”. Vedrai la tua zona disegnata a fumetto.',()=>{go('valuta');},'#addr'],
 ['📷','Le tre foto','Tocca i tre riquadri e fotografa la porta d’ingresso, una finestra del piano terra e il cancello. Le foto servono solo all’analisi e non vengono salvate.',()=>{go('valuta');},'#next0'],
 ['✍️','Rispondi alle domande','Leggi una domanda alla volta e tocca la risposta giusta. Molte sono già compilate. In alto vedi a che capitolo sei.',()=>{go('valuta');},null],
 ['🩺','Leggi il verdetto','L’indice va da 0 a 10: più è basso, più la casa è sicura. Sotto trovi i punti deboli e i rimedi, con il negozio della zona che li vende.',()=>{go('valuta');},null],
 ['🌙','Simula la notte','Nella pagina Simula tocca “Simula la notte dell’assedio” per vedere la tua casa sotto attacco. Poi tocca “Il mio quartiere” per vedere tutta la zona.',()=>{go('gioco');},'#siege'],
 ['🎟️','Sconti e preventivi','In Mondo tocca un bollino giallo: è uno sponsor. “Ottieni lo sconto” ti dà un codice da mostrare in cassa. “Chiedi un preventivo” manda la richiesta al negozio.',()=>{S.zv='mondo';go('mappa');},'#mq'],

<script>
/* =========================================================
   LA NOTTE DEL GIOCO = LA NOTTE VERA
   meteo reale della tua zona (Open-Meteo) + fase della luna:
   pioggia → zombie più lenti; nebbia → si vede poco;
   temporale/vento forte → blackout; luna piena → orda rabbiosa
   ma monete doppie. Senza rete: eventi casuali come prima.

const ZW={t:0,d:null};
function moonInfo(d=new Date()){const age=((d.getTime()-Date.UTC(2000,0,6,18,14))/864e5)%29.530588;const a=age<0?age+29.530588:age;const ill=(1-Math.cos(2*Math.PI*a/29.530588))/2;
  const n=a<1.8||a>27.7?'luna nuova':a<6.4?'luna crescente':a<8.4?'primo quarto':a<13.8?'gibbosa crescente':a<15.8?'luna piena':a<21?'gibbosa calante':a<23?'ultimo quarto':'luna calante';
  const ic=a<1.8||a>27.7?'🌑':a<6.4?'🌒':a<8.4?'🌓':a<13.8?'🌔':a<15.8?'🌕':a<21?'🌖':a<23?'🌗':'🌘';return{age:a,ill,n,ic,full:a>=13.8&&a<15.8};}
async function zWeather(){const R=S.zone&&S.zone.real;if(!R||!navigator.onLine)return null;if(ZW.d&&Date.now()-ZW.t<20*60*1000&&ZW.k===R.lat+','+R.lon)return ZW.d;
  try{const d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${R.lat.toFixed(3)}&longitude=${R.lon.toFixed(3)}&current=weather_code,precipitation,wind_speed_10m,wind_gusts_10m,visibility,temperature_2m,is_day&timezone=auto`,{signal:trSig(8000)}).then(x=>x.json());
    if(!d||!d.current)return null;ZW.d=d.current;ZW.t=Date.now();ZW.k=R.lat+','+R.lon;return ZW.d;}catch(e){return null;}}
function wName(c){return c===0?'sereno':c<=2?'poco nuvoloso':c===3?'nuvoloso':c===45||c===48?'nebbia':c>=51&&c<=57?'pioviggine':c>=61&&c<=67?'pioggia':c>=71&&c<=77?'neve':c>=80&&c<=82?'rovesci':c>=85&&c<=86?'neve':c>=95?'temporale':'variabile';}

  if(c>=95||(w.wind_gusts_10m||0)>=60)return{ev:'blackout',why:`${wIcon(c)} ${c>=95?'Temporale':'Vento forte'} sulla tua zona: salta la corrente, si vede solo vicino alla luce`};

<script>

   materiali e kit, Crediti Casa Vera, amici, codici sconto,
   risposte personali (scorte, kit medico, radio, mezzo).
   Resta nella casa vecchia (rimborsata in parte): edifici del

const MOVE_KEEP=['cibo','medico','radio','mezzo','acqua'];
function movePlan(){const out={lots:0,q:0,h:0,nl:0,nq:0,nh:0};const sum=(a,n)=>(a||[]).slice(0,n).reduce((x,y)=>x+(y||0),0);

    Object.entries(G.lots||{}).forEach(([id,b])=>{if(b.owner)return;const l=LOTS.find(x=>x.id===id);out.lots+=Math.round((l?l.cost:300)*.7);if(b.kind==='bld'&&BLD[b.b])out.lots+=Math.round(BLD[b.b].cost*.5);out.nl++;});

  out.tot=out.lots+out.q+out.h;out.cool=!!(typeof G!=='undefined'&&G.lastMove&&Date.now()-G.lastMove<30*864e5);if(out.cool)out.tot=0;return out;}

const tmDay=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function tmGen(){const R=S.zone&&S.zone.real;if(!R)return null;const r=rng(hash(tmDay()+'|'+S.zone.address));const pick=a=>a[Math.floor(r()*a.length)];const L=[];
  try{dayInit();}catch(e){}
  const ex=EXPS.filter(x=>x.real&&!x.hide);if(ex.length){const x=pick(ex);L.push({k:'exp',id:x.id,ic:'🎒',t:`Manda una squadra a <b>${esc(x.n)}</b> (${esc(x.d.split(' vero a ')[1]||'')}) e torna col bottino`,go:'day',rw:{c:80+Math.round(r()*40),g:1}});}
  try{if(G.realHood&&S.zone.address&&RM.cache[S.zone.address]){hqPlan(RM.cache[S.zone.address]);}}catch(e){}
  const sl=HQ.map&&HQ.map.sl?Object.entries(HQ.map.sl).filter(([,v])=>v.name):[];

  else{const w=realNightCond();L.push(w&&w.ev?{k:'ev',id:w.ev,ic:'🌙',t:`Vinci la notte di oggi con l’evento vero: <b>${{pioggia:'pioggia',nebbia:'nebbia',blackout:'blackout',luna:'luna piena'}[w.ev]}</b>`,go:'fight',rw:{c:140,g:3}}:{k:'win',id:'2',goal:2,ic:'🧟',t:'Vinci <b>2 notti</b> nel tuo quartiere vero',go:'fight',rw:{c:110,g:2}});}
  const sps=Object.entries(window.SP_GEO||{}).filter(([k,g])=>g&&g.lat!=null&&SPONSORS[k]);
  if(sps.length){const[k]=pick(sps);L.push({k:'cp',id:k,ic:'⭐',t:`Scopri l’offerta di <b>${esc(SPONSORS[k].name)}</b> e prendi il tuo codice sconto`,go:'sp',rw:{c:60,g:3}});}
  else{const pub=R.fac.filter(f=>['osp','farm','cc','vvf'].includes(f.k)&&f.d<2500);const cand=R.fac.filter(f=>f.cand&&f.d<2500);
    if(pub.length&&(r()<.5||!cand.length)){const f=pick(pub.slice(0,4));L.push({k:'poi',id:f.name,ic:'🏥',t:`Controlla orari e contatti di <b>${esc(f.name)}</b> (${dist(f.d)}): ti servono il giorno dell’emergenza`,go:'poi',ll:[f.lat,f.lon],kk:f.k,d:f.d,rw:{c:50,g:1}});}
    else if(cand.length){const f=pick(cand.slice(0,4));L.push({k:'biz',id:f.name,ic:'🔧',t:`Scopri <b>${esc(f.name)}</b> (${dist(f.d)}): può diventare il presidio sponsor della zona`,go:'biz',ll:[f.lat,f.lon],d:f.d,f,rw:{c:50,g:1}});}}
  L.forEach(m=>{m.goal=m.goal||1;m.prog=0;m.done=false;m.cl=false;});return{day:tmDay(),addr:S.zone.address,list:L,chest:false};}
function tmInit(){if(typeof G==='undefined'||!G.type)return null;if(!G.tm||G.tm.day!==tmDay()||G.tm.addr!==(S.zone&&S.zone.address))G.tm=tmGen();return G.tm;}
function tmEvent(k,id,ok){const T=G&&G.tm;if(!T||T.day!==tmDay())return;let hit=false;
  T.list.forEach(m=>{if(m.done)return;let p=false;
    if(m.k===k&&(m.id===id||k==='win'))p=true;if(k==='win'&&m.k==='def'&&G.q&&G.q[m.id]>=1)p=true;if(k==='evwin'&&m.k==='ev'&&m.id===id)p=true;if(k==='win'&&m.k==='win')p=true;
    if(m.k==='exp'&&k==='exp'&&m.id===id&&!ok)p=false;
    if(p){m.prog=Math.min(m.goal,m.prog+1);if(m.prog>=m.goal){m.done=true;m.cl=true;hit=true;G.coins+=m.rw.c;G.gems+=m.rw.g||0;setTimeout(()=>toast(`🎯 Missione completata: +🪙 ${m.rw.c}${m.rw.g?' +💎 '+m.rw.g:''}`),1600);try{sfx('coin');}catch(e){}}}});
  if(hit)try{saveLocal();}catch(e){}}
window.onExpDone=(id,ok)=>tmEvent('exp',id,ok);
window.onWaveEnd=(win,L,ev,coop)=>{if(!win||coop)return;tmEvent('win','x');if(ev)tmEvent('evwin',ev);};
const _couponForTM=couponFor;couponFor=function(k){const c=_couponForTM(k);try{tmEvent('cp',k);}catch(e){}return c;};

function tmHTML(){const T=tmInit();if(!T)return'';const done=T.list.filter(m=>m.cl).length;
  return`<div class="panel tmp"><div class="row spread"><b class="disp" style="font-size:22px">🎯 Missioni di oggi</b><span class="tag">${done}/${T.list.length}</span></div>

   ${T.list.map((m,i)=>`<div class="tm ${m.cl?'cl':m.done?'ok':''}"><span class="tmi">${m.cl?'✅':m.ic}</span><div class="tmt"><span>${m.t}</span>${m.goal>1?`<div class="vbar"><span style="width:${m.prog/m.goal*100}%"></span></div>`:''}<small>Premio: 🪙 ${m.rw.c}${m.rw.g?` · 💎 ${m.rw.g}`:''}</small></div>
     ${m.cl?'':m.done?`<button class="btn small" data-tmc="${i}">Riscatta</button>`:`<button class="btn small ghost" data-tmg="${i}">Vai</button>`}</div>`).join('')}
   ${done===T.list.length&&!T.chest?`<button class="btn wide alt" data-tmx>🎁 Apri lo scrigno: tutte fatte! (💎 10)</button>`:T.chest?'<p class="muted" style="font-size:12.5px;margin-top:6px">Scrigno aperto. Domani nuove missioni.</p>':`<p class="muted" style="font-size:12.5px;margin-top:6px">Completale tutte e 3 per lo scrigno: 💎 10.</p>`}</div>`;}
function tmBind(){const p=app.querySelector('.tmp');if(!p)return;const T=G.tm;
  p.querySelectorAll('[data-tmc]').forEach(b=>b.onclick=()=>{const m=T.list[+b.dataset.tmc];if(!m||!m.done||m.cl)return;m.cl=true;G.coins+=m.rw.c;G.gems+=m.rw.g||0;sfx('coin');vibe();toast(`+🪙 ${m.rw.c}${m.rw.g?` +💎 ${m.rw.g}`:''}`);renderHub();});
  const x=p.querySelector('[data-tmx]');if(x)x.onclick=()=>{T.chest=true;G.gems+=10;sfx('win');toast('🎁 Scrigno delle missioni: +💎 10');renderHub();};
  p.querySelectorAll('[data-tmg]').forEach(b=>b.onclick=()=>{const m=T.list[+b.dataset.tmg];if(!m)return;

<script>
/* =========================================================
   DIFESE E ZOMBIE DEL TERRITORIO
   Abilità della tua casa scelta dal quartiere vero:
   👥 vicini veri (utenti registrati entro 1,5 km), 🚒 idranti
   (vigili del fuoco vicini), 🔔 campane (chiesa vera),
   🌊 piena del fiume, ⛰ sassi dalla collina.

function terrHab(){const R=S.zone&&S.zone.real;if(!R)return null;
  const vic=(window.ZUSERS||[]).filter(u=>!(S.user&&u.user_id===S.user.id)&&trM(R.lat,R.lon,u.lat_r,u.lon_r)<=1500);
  if(vic.length){window.__vic=vic.map(u=>u.nick);return{k:'vicini',ic:'👥',n:'Vicini veri',cd:16,why:`${vic.length} ${vic.length===1?'superstite registrato':'superstiti registrati'} entro 1,5 km: @${vic.slice(0,3).map(u=>u.nick).join(', @')}`};}
  const vv=R.fac.find(f=>f.k==='vvf'&&f.d<=3000);if(vv)return{k:'idranti',ic:'🚒',n:'Idranti',cd:14,why:`Vigili del fuoco a ${dist(vv.d)}: idranti in tutta la via`};
  const ch=HQ.map&&HQ.map.sl&&HQ.map.sl.campanile&&HQ.map.sl.campanile.name;if(ch&&/·/.test(ch))return{k:'campane',ic:'🔔',n:'Campane',cd:15,why:ch.split('·')[1].trim()+': campane a martello, l’orda si blocca'};
  if(R.water&&R.water.d<500)return{k:'fiume',ic:'🌊',n:'Piena',cd:16,why:`${R.water.n} a ${R.water.d} m: la piena travolge la corsia bassa`};
  if(R.pos==='altura'||R.pos==='pendio')return{k:'collina',ic:'⛰',n:'Collina',cd:15,why:'Casa in alto: sassi che rotolano sull’orda'};
  return null;}

const ZVAR={annegato:['💧','Annegato: sale dal fiume, più resistente'],bracciante:['🌾','Bracciante: lento ma duro'],scalatore:['🧗','Scalatore: le salite non lo rallentano'],pendolare:['🚆','Pendolare: arriva di corsa']};
window.zTerrZ=(z,s)=>{const R=S.zone&&S.zone.real;if(!R||!z||z.ty==='boss'||z.ty==='oro')return;const H=G.hoods&&G.hoods[G.curHood];if(H&&H.id!=='own')return;const r=Math.random();
  if(R.water&&R.water.d<500&&z.lane===2&&r<.4){z.vic='💧';z.hp*=1.35;z.max*=1.35;z.spMul=1.12;}
  else if(R.type==='campagna'&&z.ty==='walker'&&r<.25){z.vic='🌾';z.hp*=1.6;z.max*=1.6;z.spMul=.85;}
  else if((R.pos==='pendio'||R.pos==='altura'||(s&&s.slope&&s.slope<1))&&r<.22){z.vic='🧗';z.noSlope=1;}

function terrZList(){const R=S.zone&&S.zone.real;if(!R)return[];const L=[];if(R.water&&R.water.d<500)L.push('annegato');if(R.type==='campagna')L.push('bracciante');if(R.pos==='pendio'||R.pos==='altura')L.push('scalatore');if(R.type==='centro')L.push('pendolare');return L;}

const _terrPanelH=terrPanelHTML;terrPanelHTML=function(){const h=_terrPanelH();if(!h)return h;const t=terrHab();const zl=terrZList();

  return h.replace('<ul class="terrl">',add+'<ul class="terrl">');};
</script>

 {t:'Provviste e carte',ic:'🃏',p:'La barra gialla si ricarica da sola. Ogni carta costa provviste. Prova: <b>tocca la carta</b>, poi <b>tocca la corsia</b> con lo zombie.',
  demo:()=>`<div class="hw-bar"><span></span></div><div class="hw-field sm"><div class="hw-house">🏠</div>${[0,1,2].map(l=>`<div class="hw-lane" data-hl="${l}">${l===1?'<span class="hw-z stop">🧟</span>':''}</div>`).join('')}</div>

 {t:'L’abilità della tua casa',ic:'⚡',p:'Il pulsante rotondo è un colpo speciale con ricarica. Con la casa vera dipende dal <b>tuo quartiere</b>.',

  bind:c=>{c.querySelector('[data-hh]').onclick=e=>{e.currentTarget.classList.add('fire');const t=typeof terrHab==='function'?terrHab():null;c.querySelector('#hwHab').textContent=t?({vicini:'👥 I tuoi vicini veri arrivano e colpiscono!',idranti:'🚒 Getto degli idranti su tutte le corsie!',campane:'🔔 Campane a martello: orda bloccata!',fiume:'🌊 La piena travolge la corsia bassa!',collina:'⛰ Sassi dalla collina!'}[t.k]):'🐕 WOOF! Il cane respinge una corsia.';vibe();setTimeout(()=>e.currentTarget&&e.currentTarget.classList.remove('fire'),700);};}},
 {t:'Il gioco è sul tuo territorio vero',ic:'🗺️',p:'Quello che c’è davvero intorno a casa tua cambia la partita.',

 {t:'Dopo la notte',ic:'⭐',p:'Fino a <b>3 stelle</b> per notte. Con le monete compri potenziamenti e case del quartiere. E ogni cosa che fai per la <b>casa vera</b> ti rende più forte anche qui.',

function howHTML(i){const h=HOW[i];return`<div class="hw" data-hi="${i}"><div class="hw-dots">${HOW.map((_,k)=>`<i class="${k===i?'on':k<i?'done':''}"></i>`).join('')}</div>
  <div class="hw-panel"><div class="hw-num">${i+1}/${HOW.length}</div><div class="hw-ic">${h.ic}</div><h3>${h.t}</h3><p>${h.p}</p><div class="hw-demo">${h.demo()}</div></div>

  ${i===HOW.length-1?`<button class="btn small ghost wide" data-hall style="margin-top:10px">📚 Tutte le regole, le carte e i nemici</button>`:'<button class="hw-skip" data-hskip>Salta: so già giocare</button>'}</div>`;}
openRules=function(start){let i=Math.max(0,Math.min(HOW.length-1,start||0));
  openSheet('📖 Come si gioca',howHTML(i),card=>{const draw=()=>{const w=card.querySelector('.hw');w.outerHTML=howHTML(i);bind();};
    const bind=()=>{const w=card.querySelector('.hw');const h=HOW[i];if(h.bind)h.bind(w);
      const n=w.querySelector('[data-hnext]');if(n)n.onclick=()=>{i++;draw();};const p=w.querySelector('[data-hprev]');if(p)p.onclick=()=>{i--;draw();};
      const s=w.querySelector('[data-hskip]');if(s)s.onclick=()=>{try{G.howSeen=1;}catch(e){}closeSheet();};
      const pl=w.querySelector('[data-hplay]');if(pl)pl.onclick=()=>{try{G.howSeen=1;}catch(e){}closeSheet();if(typeof G!=='undefined'&&G.type){go('orda');setTimeout(()=>{const f=app.querySelector('#fight');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});},200);}else go('orda');};
      const a=w.querySelector('[data-hall]');if(a)a.onclick=()=>{try{G.howSeen=1;}catch(e){}openSheet('📚 Tutte le regole',rulesHTML(),c2=>{const b=c2.querySelector('[data-tutagain]');if(b)b.onclick=()=>{G.tutDone=false;toast('Il tutorial ripartirà alla prossima battaglia');closeSheet();};});};
      let x0=null;w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
      w.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<60||e.target.closest('.hw-demo'))return;if(dx<0&&i<HOW.length-1){i++;draw();}else if(dx>0&&i>0){i--;draw();}},{passive:true});};
    bind();});};

<script>
/* =========================================================
   MANUALE COMPLETO DEL GIOCO (capitoli apribili)
   I numeri arrivano dai dati del gioco: restano sempre giusti.
   ========================================================= */
function manualHTML(){const sec=(id,t,body,open)=>`<details class="man" ${open?'open':''} id="man-${id}"><summary>${t}</summary><div class="man-b">${body}</div></details>`;
  const tab=(rows,cols)=>`<div class="mtab">${rows.map(r=>`<div>${r.map((c,i)=>i===0?`<span>${c}</span>`:i===1?`<b>${c}</b>`:`<small>${c}</small>`).join('')}</div>`).join('')}</div>`;
  const eur=n=>'🪙 '+n;
  const S1=sec('scopo','🎯 Lo scopo del gioco',`<p>Ogni partita è una <b>notte</b>: l’orda arriva e tu difendi <b>casa tua</b> e il <b>quartiere</b> fino all’alba. Se cade casa tua la notte è persa; gli altri edifici persi escono dal quartiere e fanno scendere di livello.</p>
    <p>Vincendo sali di <b>livello</b>: più zombie, più veloci, più premi. Scegli la difficoltà prima della notte:</p>${tab(Object.values(DIFF).map(d=>['⚔️',d.n,`zombie ×${String(d.hp).replace('.',',')} di vita · monete ×${String(d.coin).replace('.',',')}`]))}`,true);
  const S2=sec('schede','📱 Le schede del gioco',tab([['🏘️','Quartiere','la mappa, la notte, le missioni, le spedizioni, il bollettino del territorio'],['🔧','Potenzia','casa, attrezzi anti-zombie, carte'],['👥','Amici','amici, vicini, aiuti e inviti'],['🏆','Arena','tornei e sfide con gli altri superstiti']]));
  const S3=sec('casa','🏠 La tua casa e i potenziamenti',`<p>Puoi giocare con <b>“La tua casa vera”</b> (forma, piani e tipo presi dalla mappa) o con una casa a scelta. Ogni tipo ha resistenza, barricata, monete di partenza e un’abilità diversa.</p>
    <p>In <b>Potenzia</b> migliori la casa:</p>${tab(HUP.map(u=>['🔨',u.name,`${u.lv.join(' → ')}<br>${u.eff} · costi ${u.cost.map(eur).join(', ')}`]))}`);
  const S4=sec('quartiere','🏘️ Il quartiere vero',`<p>Con “Quartiere vero” la mappa del gioco è la tua zona: vie, case, campi e fiumi veri. Le frecce rosse <b>“🧟 ORDA DA VIA…”</b> mostrano da quali strade vere entra l’orda.</p>
    <p><b>Edifici in vendita (🪙):</b> sono case vere intorno alla tua. Comprali per allargare la difesa: ognuno è un edificio in più da proteggere, ma ti dà inquilini o un servizio. I servizi che puoi aprire:</p>${tab(Object.values(BLD).map(b=>[b.ic||'🏢',b.name,`${b.eff} · da ${eur(b.cost)}`]))}
    <p><b>Punti da fortificare:</b> sono posti veri (la rotonda o l’incrocio, i lampioni della via principale, la chiesa, le case dei vicini, i campi). Ognuno dà un aiuto fisso durante la notte:</p>${tab(SLOTS.map(s=>['🛡️',esc(s.name),s.eff]))}`);
  const S5=sec('piano','🛡️ Prima della notte: il piano',`<p>La <b>ricognizione</b> ti dice quanti zombie arrivano, di che tipo e verso quali edifici. Distribuisci i <b>punti difesa</b>: 🪵 barricata +40%, 🪤 3 trappole, 🎯 una torretta. “Piano automatico” li mette per te dove servono di più. L’orda punta agli edifici più deboli.</p>`);
  const S6=sec('carte','🃏 Durante la notte: provviste e carte',`<p>Le <b>provviste</b> (barra gialla in basso a sinistra) si ricaricano da sole. Ogni carta costa provviste (numero giallo). Le carte “su corsia” si <b>trascinano</b> sulla corsia, oppure tocchi la carta e poi la corsia. Hai 4 carte in mano: quando ne usi una entra la successiva.</p>${tab(RULES_CARDS.map(c=>[c[0],c[1]+` <i class="mcost">${c[2]}</i>`,`${c[3]} · ${c[4]}`]))}`);
  const S7=sec('tattica','🎯 Bersaglio, combo e rifornimenti',`<p><b>Bersaglio:</b> tocca uno zombie, diventa il bersaglio (mirino azzurro): difensori, torrette e rinforzi sparano prima a lui con <b>+35% di danni</b>. Usalo su bruti, caschi e boss.</p>
    <p><b>Combo:</b> ogni zombie scacciato ridà un po’ di provviste; 3, 5 o 8 di fila (entro 2 secondi l’uno dall’altro) danno provviste extra.</p><p><b>Rifornimenti:</b> a metà notte scegli 1 bonus tra 3.</p>
    <p><b>Più edifici:</b> nella mappa dell’assedio tocca un edificio per correre a difenderlo; “Vai dove serve” ti porta dove c’è più pericolo.</p>`);
  const S8=sec('abilita','⚡ L’abilità della casa',`<p>Il pulsante rotondo è un colpo speciale con ricarica. Con la casa vera dipende dal <b>tuo quartiere vero</b>, in quest’ordine:</p>${tab([['👥','Vicini veri','se ci sono utenti registrati entro 1,5 km: arrivano coi loro nick e colpiscono 3 zombie + 2 per ogni vicino'],['🚒','Idranti','vigili del fuoco entro 3 km: getto su tutte le corsie'],['🔔','Campane','chiesa vera nel quartiere: orda bloccata 2 secondi'],['🌊','Piena','fiume o lago entro 500 m: travolge la corsia bassa'],['⛰️','Collina','casa in alto o in pendenza: sassi su 7 zombie']])}<p>Con le altre case: cane, trattore, faro, valanga, onda, clacson, pigne o condomini, secondo il tipo.</p>`);
  const S9=sec('attrezzi','🧰 Attrezzi anti-zombie',`<p>Si sbloccano e migliorano in <b>Potenzia</b>; in battaglia hanno una ricarica.</p>${tab(TOOLS.map(t=>[t.ic||'🧰',t.name,`${t.d} · ricarica ${t.cd} s · sblocco ${t.unlock?eur(t.unlock):'gratis'}`]))}`);
  const S10=sec('nemici','🧟 I nemici',`${tab(RULES_Z.map(z=>[z[0],z[1],z[2]]))}<p><b>Zombie del tuo territorio</b> (riconoscibili dal simbolo sopra la testa):</p>${tab(Object.values(ZVAR).map(v=>[v[0],v[1].split(':')[0],v[1].split(':')[1]||'']))}`);
  const S11=sec('notte','🌦️ La notte vera: meteo e luna',`<p>L’evento della notte dipende dal <b>meteo reale</b> della tua zona e dalla <b>luna vera</b>:</p>${tab([['🌧️','Pioggia','zombie più lenti; se abiti in zona bassa la barricata perde il 10%'],['🌫️','Nebbia','si vede poco, gli zombie spuntano all’ultimo'],['⛈️','Blackout','temporale o vento forte: si vede solo vicino alla luce'],['🌕','Luna piena','orda più veloce, ma monete doppie'],['☀️','Notte tranquilla','nessun evento']])}`);
  const S12=sec('giorno','🎒 Il giorno: spedizioni e missioni',`<p><b>Spedizioni:</b> mandi una squadra in un posto vero della zona (supermercato, negozio per la casa, farmacia, distributore, sponsor). Il tempo dipende dalla <b>distanza vera</b> e dalle <b>salite</b>; torna con materiali (cibo, legno, metallo, batterie, medicine). Più è lontano, più c’è rischio. Gli sponsor veri: una volta al giorno, senza rischi.</p>
    <p><b>Missioni di oggi:</b> 3 al giorno sui posti veri (spedizioni, difese, meteo, sponsor, servizi). Ognuna ha un premio; tutte e 3 aprono lo <b>scrigno da 💎 10</b>. Cambiano a mezzanotte.</p>`);
  const S13=sec('territorio','🗺️ I bonus del territorio vero',`<p>Il pannello “Il territorio decide la notte” mostra cosa ti aiuta o ti penalizza davvero:</p>${tab([['🏥','Ospedale entro 1,5 km','resistenza casa +10%'],['💊','Farmacia entro 800 m','resistenza +5%'],['🚓','Forze dell’ordine entro 2 km','barricata +10%'],['🚒','Vigili del fuoco entro 3 km','barricata +5%'],['⛰️','Casa in altura','barricata +10%'],['💧','Zona bassa vicino all’acqua','barricata −10%'],['🥫','Supermercato oltre 2 km','resistenza −5%'],['⭐','Ogni sponsor entro 3 km (max 3)','barricata +5%']])}
    <p><b>Terreno:</b> salite vere rallentano l’orda (−20% zombie), discese la accelerano (+20%), le alture danno una vedetta.</p>`);
  const S14=sec('premi','⭐ Premi',`<p>Fino a <b>3 stelle</b> per notte (casa poco danneggiata, nessun edificio perso). In alto c’è l’<b>obiettivo bonus</b> dell’ondata. Raccogli il <b>bottino</b> (monete, gemme, cuori) toccandolo prima che sparisca. Ci sono anche <b>medaglie</b> per le imprese speciali.</p>
    <p><b>Monete 🪙</b>: potenziamenti, edifici, attrezzi. <b>Gemme 💎</b>: bonus speciali e acquisti rari.</p>`);
  const S15=sec('community','👥 Community e inviti',`<p><b>Mappa della community:</b> se accetti, gli altri vedono il tuo nickname, l’indice della casa e il livello, in una posizione approssimata di circa 200 m. Mai l’indirizzo.</p>
    <p><b>Inviti</b> (menu ☰): chi entra col tuo link e valuta la casa ti dà 💎 5; se abita entro 1,5 km diventa uno dei tuoi <b>vicini veri</b> e la tua abilità in battaglia si rafforza.</p>`);
  const S16=sec('vera','🔄 Casa vera ⇄ gioco',`<p>Quello che fai per la casa vera ti rende più forte nel gioco: la valutazione ti fa partire avvantaggiato, lo <b>Scudo</b> (0–5) cresce con le azioni sulla casa vera, i <b>Crediti Casa Vera</b> arrivano da sconti e preventivi usati davvero.</p>
    <p><b>Ho cambiato casa:</b> monete, gemme, livello, attrezzi e crediti vengono con te; edifici e potenziamenti restano nella casa vecchia con un rimborso (70% edifici, 50% punti e potenziamenti, una volta ogni 30 giorni).</p>
    <p><b>Salvataggi:</b> con l’accesso fatto la partita è sempre allineata tra iPhone, Mac e computer.</p>`);
  const S17=sec('classico','🕹️ Stile classico',`<p>Se lo scegli nella campagna: tocchi gli zombie per colpirli (testa = critico) e trascini il dito per colpirne tanti; il tocco consuma energia.</p>`);
  return`<div class="manual"><p class="muted" style="font-size:13px;margin:0 0 8px">Tocca un capitolo per aprirlo.</p>${[S1,S2,S3,S4,S5,S6,S7,S8,S9,S10,S11,S12,S13,S14,S15,S16,S17].join('')}
    <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn small" data-howagain>📖 Rivedi le 7 tavole</button><button class="btn small ghost" data-tutagain>Rifai il tutorial alla prossima battaglia</button></div></div>`;}
rulesHTML=manualHTML;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-howagain]');if(!b)return;openRules(0);});
</script>
<script>
/* =========================================================
   NIENTE RECENSIONI INVENTATE
   - le stelle generate a caso sono tolte ovunque
   - si mostrano solo recensioni verificate (da codice usato
     in negozio, tabella reviews) quando ci sono
   - il pulsante porta alle recensioni vere su Google Maps
     (link esterno: consentito)
   - controllo Google "aperta/chiusa" spento: le condizioni di
     Google vietano i suoi dati in app con mappe non Google
   ========================================================= */
CONFIG.GOOGLE_STATUS=false;
rvGen=function(){return[];};
try{if(S.rv)Object.keys(S.rv).forEach(k=>{S.rv[k]=(S.rv[k]||[]).filter(x=>x&&x.mine);});}catch(e){}
rvLine=function(key){const l=rvList(key,0,0);if(!l.length)return'<small class="muted">Nessuna recensione verificata, per ora</small>';const a=rvAvg(l);return`${rvStars(a)} <b>${a.toFixed(1).replace('.',',')}</b> <small class="muted">(${l.length} verificate)</small>`;};
rvBtn=function(key,name){const town=((S.zone&&S.zone.address)||'').split(',').slice(-1)[0]||'';return`<a class="btn small ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((name||'')+' '+town)}" target="_blank" rel="noopener">⭐ Recensioni su Google</a>`;};
const _zPlaceOff=zPlace;zPlace=async function(name,ll){if(!CONFIG.GOOGLE_STATUS)return null;return _zPlaceOff(name,ll);};
</script>
<script>
/* =========================================================
   VIVERE QUI e VACANZA IN ZONA con strutture VERE
   (OpenStreetMap: negozi, servizi, fermate, stazione, scuole,
   verde e sport entro 1,5 km; hotel, B&B, agriturismi,
   campeggi, ristoranti e cose da vedere fino a 8 km).
   Prezzi e annunci: solo da agenzie partner (per ora nessuno).
   Recensioni: solo verificate + link a Google.
   ========================================================= */
const ST_CAT=t=>{const s=t.shop,a=t.amenity,tu=t.tourism,h=t.historic,l=t.leisure;
  if(t.highway==='bus_stop')return['bus','Fermata bus','🚏'];if(t.railway==='station'||t.railway==='halt')return['treno','Stazione','🚆'];

   <details class="man" style="margin-top:8px"><summary>Come funziona</summary><div class="man-b">

async function wSheet(bid,lat,lon){openSheet('🌍 Edificio del mondo','<p><span class="spin"></span> Controllo l’edificio…</p>',()=>{});let q;

     ${q.can?`<button class="btn wide" data-wbuy>Compra questa casa · 🧱 ${wNum(q.price)}</button>`:`<p class="notice">${esc(q.why)}</p>`}
     <p class="muted" style="font-size:12.5px;margin-top:8px">Se un giorno l’abitante vero si iscrive, la casa passa a lui e tu ricevi tutto indietro più un bonus.</p>`;
  else if(q.status==='mine')act=`<p style="font-weight:400">Valore: <b>🧱 ${wNum(q.value)}</b> · rende <b>🧱 ${5+5*q.level}</b> al giorno.</p><div class="row" style="gap:8px;flex-wrap:wrap">${q.level<5?`<button class="btn" data-wup>Potenzia · 🧱 ${wNum(q.up_cost)}</button>`:''}<button class="btn ghost small" data-wsell>Vendi (70%: 🧱 ${wNum(Math.floor(q.value*.7))})</button></div>`;
  else if(q.status==='myhome')act=`<p style="font-weight:400">Nessuno può comprarla. Potenziandola sale di livello.</p>${q.level<5?`<button class="btn" data-wup>Potenzia · 🧱 ${wNum(q.up_cost)}</button>`:''}`;
  else if(q.status==='mypending')act='<p style="font-weight:400">Riapri l’app domani: la conferma in due giorni serve a evitare che qualcuno si prenda case non sue.</p>';
  else if(q.status==='owned')act=`<p style="font-weight:400">Proprietà di <b>@${esc(q.owner_nick||'superstite')}</b>. Non si può comprare.</p>`;
  else if(q.status==='home')act='<p style="font-weight:400">Qui abita un superstite registrato: è casa sua, non si può comprare.</p>';
  else if(q.status==='excluded')act='<p style="font-weight:400">Chi abita qui ha chiesto di non far parte del gioco.</p>';
  const mine=W.m&&W.m.home;const canClaim=S.user&&['free','owned'].includes(q.status);
  openSheet('🌍 Edificio del mondo',`<div class="bzc"><div class="bzc-hero" style="--c:${st[2]}"><span class="bzc-ic">${st[0]}</span><div class="bzc-t"><span class="bzc-cat">${st[1]}</span><h4>Edificio ${esc(bid.slice(1,8))}</h4><small>${lv}</small></div></div></div>
    <div style="margin-top:12px">${act}</div>
    ${canClaim?`<button class="bzc-own" data-wclaim>${mine?'Ti sei trasferito qui? Rendila casa tua →':'Abiti qui? Rendila casa tua →'}</button>`:''}
    <button class="bzc-rep" data-wexcl>Abiti qui e non vuoi che sia nel gioco? Chiedi l’esclusione</button>`,card=>{
    const b=card.querySelector('[data-wbuy]');if(b)b.onclick=async()=>{b.disabled=true;try{const r=await wRpc('world_buy',{p_bid:bid,p_lat:lat,p_lon:lon});toast(r.ok?`🔑 ${r.msg}: −🧱 ${wNum(r.price)}`:r.msg);if(r.ok){closeSheet();HQW.t=0;await wMine(true);wAfterChange();}else b.disabled=false;}catch(e){toast(e.message);b.disabled=false;}};
    const u=card.querySelector('[data-wup]');if(u)u.onclick=async()=>{u.disabled=true;try{const r=await wRpc('world_upgrade',{p_bid:bid});toast(r.ok?`⬆️ Livello ${r.level}`:r.msg);await wMine(true);if(r.ok)wSheet(bid,lat,lon);else u.disabled=false;}catch(e){toast(e.message);}};
    const s=card.querySelector('[data-wsell]');if(s)s.onclick=async()=>{if(!confirm('Vendere la casa? Ricevi il 70% del valore e torna libera.'))return;try{const r=await wRpc('world_sell',{p_bid:bid});toast(r.ok?`Venduta: +🧱 ${wNum(r.back)}`:r.msg);closeSheet();HQW.t=0;await wMine(true);wAfterChange();}catch(e){toast(e.message);}};
    const c=card.querySelector('[data-wclaim]');if(c)c.onclick=async()=>{if(!confirm('Confermi che questa è la casa dove abiti? Puoi cambiarla una volta ogni 30 giorni.'))return;try{const r=await wRpc('world_claim_home',{p_bid:bid,p_lat:lat,p_lon:lon});toast('🏠 '+r.msg);closeSheet();wMine(true);}catch(e){toast(e.message);}};

function wAfterChange(){try{if(S.tab==='orda'&&G.view==='hub')renderHub();}catch(e){}(window.__zlms||[]).forEach(lm=>{try{wDrawMap(lm,true);}catch(e){}});}
/* ---- mappa: stato degli edifici del mondo + tocco su un edificio ---- */
async function wDrawMap(lm,force){if(!lm||!lm.map||!W.on)return;const map=lm.map;if(map.getZoom()<14){(lm._w||[]).forEach(x=>x.remove());lm._w=[];return;}
  const b=map.getBounds();const key=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(3)).join(',');if(!force&&lm._wk===key)return;lm._wk=key;
  let rows=[];try{rows=await wRpc('world_view',{p_minlat:b.getSouth(),p_minlon:b.getWest(),p_maxlat:b.getNorth(),p_maxlon:b.getEast()})||[];}catch(e){return;}

/* codice dell'edificio dal disegno della mappa: stesso per tutti (stesse mappe), istantaneo, senza server */
function wFromTile(feats,lat,lon){for(const f of feats||[]){const g=f.geometry;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
    const hit=polys.find(pl=>pl[0]&&wInRing(pl[0],lon,lat));if(!hit)continue;const R=hit[0].slice(0,-1);if(R.length<3)continue;
    let A=0,cx=0,cy=0;for(let i=0;i<R.length;i++){const[x1,y1]=R[i],[x2,y2]=R[(i+1)%R.length];const c=x1*y2-x2*y1;A+=c;cx+=(x1+x2)*c;cy+=(y1+y2)*c;}
    if(Math.abs(A)<1e-12){cx=R.reduce((a,p)=>a+p[0],0)/R.length;cy=R.reduce((a,p)=>a+p[1],0)/R.length;}else{cx/=3*A;cy/=3*A;}
    const la=+cy.toFixed(5),lo=+cx.toFixed(5);return{bid:'g'+la.toFixed(5)+'_'+lo.toFixed(5),lat:la,lon:lo};}return null;}
function wInRing(r,x,y){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[xi,yi]=r[i],[xj,yj]=r[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function wPick(els,lat,lon){let best=null,bd=1e9;(els||[]).forEach(e=>{if(e.type!=='way'||!e.geometry||e.geometry.length<3||(e.tags&&!e.tags.building))return;
    const R=e.geometry.map(p=>[p.lon,p.lat]);const c=e.geometry.reduce((q,p)=>[q[0]+p.lat/e.geometry.length,q[1]+p.lon/e.geometry.length],[0,0]);
    const d=wInRing(R,lon,lat)?-1:trM(lat,lon,c[0],c[1]);if(d<bd){bd=d;best={bid:'w'+e.id,lat:+c[0].toFixed(6),lon:+c[1].toFixed(6),d};}});return best&&best.d<15?best:null;}
async function wIdentify(lat,lon){
  /* 1) edifici già in memoria (la tua zona e quelle già viste): istantaneo, senza server */
  const pools=Object.values(RM.cache||{}).map(m=>m&&m.els);try{Object.keys(localStorage).filter(k=>k.startsWith('zsh_rm2_')).forEach(k=>{try{pools.push(JSON.parse(localStorage.getItem(k)).m.els);}catch(e){}});}catch(e){}
  for(const els of pools){const b=wPick(els,lat,lon);if(b)return b;}
  /* 2) chiedo al server delle mappe, con riserva e un secondo tentativo */
  for(let t=0;t<2;t++){try{const els=await trOverpass(`[out:json][timeout:12];way["building"](around:12,${lat},${lon});out ids tags geom;`,12000,4);const b=wPick(els.map(e=>({...e,type:'way'})),lat,lon);if(b)return b;return null;}catch(e){if(t===0)await new Promise(r=>setTimeout(r,2500));}}
  throw new Error('occupato');}
const _liveMapW=liveMap;liveMap=async function(el,addr,o){const lm=await _liveMapW(el,addr,o);try{const map=lm.map;
  const homeG=()=>{try{if(window.__homeG||!S.zone||S.zone.address!==addr||map.getZoom()<14)return;const pt=map.project([lm.m.lon,lm.m.lat]);const fs=map.queryRenderedFeatures([[pt.x-3,pt.y-3],[pt.x+3,pt.y+3]],{layers:['bld']});
    const g=wFromTile(fs,lm.m.lat,lm.m.lon);if(g){window.__homeG=g;if(S.user&&!(S.zone.real&&S.zone.real.house&&S.zone.real.house.bid))wClaim(false);}}catch(e){}};map.on('idle',homeG);
  map.on('moveend',()=>{clearTimeout(lm._wt);lm._wt=setTimeout(()=>wDrawMap(lm),350);});setTimeout(()=>wDrawMap(lm),900);
  map.on('click','bld',async e=>{if(!W.on)return;const pts=map.queryRenderedFeatures(e.point,{layers:['poi-biz','poi-pub','poi-cand','poi-hid'].filter(id=>map.getLayer(id))});if(pts.length)return;

<script>

    ${A.length?A.map(a=>`<div class="sitem"><span class="sav">${esc((a.nick||'?')[0].toUpperCase())}</span><div class="stx">${socNick(a.user_id,a.nick)}<small>livello ${a.wlevel}${a.dist_km!=null?' · '+wNum(a.dist_km)+' km':''}</small></div><button class="btn small" data-pl="${a.user_id}">Apri</button></div>`).join(''):'<p class="muted">Nessun alleato ancora. Proponi un’alleanza dalla bacheca, dalla mappa o dalle classifiche, oppure invita qualcuno.</p>'}</div>
    <div class="panel"><b>🔎 Trova superstiti</b><p class="muted" style="font-size:12.5px;margin:4px 0 8px">Sulla mappa accendi il filtro 🤝 Alleati: vedi chi è visibile vicino a te e lo tocchi per allearti.</p><button class="btn ghost small" data-smap>🗺️ Apri la mappa</button></div>`;}
  else{const L=SOC.rank[SOC.rs+SOC.rp];body=`<div class="schips">${[['zona','📍 Zona'],['mondo','🌍 Mondo']].map(([k,l])=>`<button data-rs="${k}" class="${SOC.rs===k?'on':''}">${l}</button>`).join('')}<span style="flex:1"></span>${[['settimana','Settimana'],['sempre','Sempre']].map(([k,l])=>`<button data-rp="${k}" class="${SOC.rp===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="panel">${L==null?'<p class="muted"><span class="spin"></span> Carico…</p>':L.length?L.map(r=>`<div class="srank ${r.me?'me':''}"><span class="rpos">${r.pos<=3?['🥇','🥈','🥉'][r.pos-1]:r.pos}</span><div class="stx">${socNick(r.user_id,r.nick)}<small>livello ${r.wlevel}${r.comune?' · '+esc(r.comune):''}</small></div><b>🧱 ${wNum(r.punti)}</b></div>`).join(''):'<p class="muted">Nessuno in classifica ancora.</p>'}
    <p class="muted" style="font-size:12px;margin-top:8px">Punti = Mattoni guadagnati giocando (orde, missioni, affitti, aiuti). Regali e prestiti non contano.</p></div>`;}
  const errN=SOC.err?`<p class="notice">Il social non risponde ora (${esc(SOC.err)}). Se compare “does not exist”, manca il blocco SQL del social su Supabase.</p>`:'';
  B.innerHTML=errN+perHTML+body;
  B.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{SOC.scope=b.dataset.sc;socPaint();socLoad('feed');});
  B.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{SOC.rs=b.dataset.rs;socPaint();socLoad('rank');});
  B.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{SOC.rp=b.dataset.rp;socPaint();socLoad('rank');});
  B.querySelectorAll('[data-ayes],[data-ano]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await socRpc('world_ally_answer',{p_requester:b.dataset.ayes||b.dataset.ano,p_yes:!!b.dataset.ayes});toast('🤝 '+r.msg);}catch(e){toast(e.message);}socLoad('per',true);socLoad('allies',true);});
  B.querySelectorAll('[data-shelp]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await socRpc('world_send_help',{p_target:b.dataset.shelp});toast((r.ok?'🛡️ ':'')+r.msg);}catch(e){toast(e.message);}});
  const sm=B.querySelector('[data-smap]');if(sm)sm.onclick=()=>{S.mf=S.mf||{};S.mf.all=true;go('mappa');};}
/* ---------------- scheda del giocatore (da ovunque) ---------------- */
document.addEventListener('click',e=>{const n=e.target.closest&&e.target.closest('[data-pl]');if(!n||!n.dataset.pl)return;e.preventDefault();e.stopPropagation();playerSheet(n.dataset.pl);},true);
async function playerSheet(uid){if(!S.user){loginSheet();return;}openSheet('👤 Superstite','<p><span class="spin"></span> Carico…</p>',()=>{});let p;
  try{p=await socRpc('world_player',{p_user:uid});}catch(e){openSheet('👤 Superstite',`<p class="notice">${esc(e.message)}</p>`);return;}
  const allyBtn=p.me?'':p.ally==='ok'?'<span class="rok2">🤝 Siete alleati</span>':p.ally==='out'?'<span class="muted">Proposta inviata: aspetta che accetti</span>':p.ally==='in'?'<button class="btn" data-pa="yes">✅ Accetta l’alleanza</button>':'<button class="btn" data-pa="req">🤝 Proponi alleanza</button>';
  openSheet('👤 Superstite',`<div class="plhead"><span class="sav big">${esc((p.nick||'?')[0].toUpperCase())}</span><div><b class="disp" style="font-size:26px">@${esc(p.nick)}</b><small>Livello mondo ${p.wlevel} · ${p.houses} ${p.houses===1?'casa comprata':'case comprate'}${p.comune?' · '+esc(p.comune):''}</small></div></div>
    ${p.me?'<p class="muted">Questo sei tu.</p>':`<div class="placts">${allyBtn}
      ${p.asked&&!p.helped?'<button class="btn alt" data-pa="help">🛡️ Manda rinforzi (chiede aiuto)</button>':p.helped?'<span class="rok2">🛡️ Rinforzi mandati per questa orda</span>':''}
      ${p.ally==='ok'?'<button class="btn ghost" data-pa="gift">🎁 Regala o presta</button>':''}
      ${p.home&&!p.protected&&!p.attacked&&p.ally!=='ok'?'<button class="btn ghost" data-pa="atk">🧟 Manda un’orda · 🧱30</button>':p.protected?'<small class="muted">È molto più debole di te: è protetto dalle tue orde.</small>':''}</div>
    <h4 style="margin:14px 0 6px">💬 Saluta</h4><div class="shouts">${SHOUTS.slice(1).map((s,i)=>`<button data-sh="${i+1}">${esc(s)}</button>`).join('')}</div>`}`,card=>{
    card.querySelectorAll('[data-pa]').forEach(b=>b.onclick=async()=>{const k=b.dataset.pa;b.disabled=true;try{let r;
      if(k==='req')r=await socRpc('world_ally_request',{p_target:uid});else if(k==='yes')r=await socRpc('world_ally_answer',{p_requester:uid,p_yes:true});
      else if(k==='help')r=await socRpc('world_send_help',{p_target:uid});
      else if(k==='atk'){if(!confirm('Mandare un’orda a @'+p.nick+'? Costa 30 Mattoni.')){b.disabled=false;return;}r=await socRpc('world_send_attack',{p_target:uid});}
      else if(k==='gift'){closeSheet();try{aySheet(uid,p.nick);}catch(e){G.ss='impero';go('orda');}return;}
      toast(r.msg||'Fatto');playerSheet(uid);socLoad('allies',true);}catch(e){toast(e.message||'Non riuscito');b.disabled=false;}});
    card.querySelectorAll('[data-sh]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await socRpc('world_shout',{p_to:uid,p_code:+b.dataset.sh});toast((r.ok?'💬 ':'')+r.msg);}catch(e){toast(e.message);}setTimeout(()=>b.disabled=false,1500);});});}
/* ---------------- barra: 👥 Superstiti al posto di Io; Io sull'avatar in alto ---------------- */
ICON.social='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="8.5" cy="8" r="3.3"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2.5 20c0-3.6 2.7-6 6-6s6 2.4 6 6M14 14.6c3.4-.4 7 1.4 7 5"/></svg>';

renderNav=function(){try{document.body.dataset.tab=S.tab;}catch(e){}const items=[['home','Casa'],['mappa','Mappa'],['orda','Orda'],['social','Superstiti']];const act=NAV_ACT[S.tab]||S.tab;
