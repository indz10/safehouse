<script>
/* =========================================================
   TERRENO DEL QUARTIERE (salite, discese, alture, zone basse)
   e QUARTIERE VERO generato dalla zona valutata
   Produzione: quota da modello del rilievo (Copernicus DEM) per cella.
   ========================================================= */
function terrSeed(){const H=G.hoods&&G.hoods[G.curHood];if(H&&H.id!=='own')return H.seed;return G.realHood&&S.zone?(S.zone.seed||7)+101:777;}
function hills(){const r=rng(terrSeed());return Array.from({length:3},()=>({x:40+r()*320,y:40+r()*480,a:.55+r()*.5,s:70+r()*70}));}
function elev(x,y){let e=0;hills().forEach(h=>{e+=h.a*Math.exp(-((x-h.x)**2+(y-h.y)**2)/(2*h.s*h.s));});if(y<0)e+=.9+(-y)/120;if(y>520&&y<590)e-=.35;return e;}
function terrainAt(x,y){const e=elev(x,y),c=elev(200,640)+elev(200,450)*.5;const d=e-c/1.5;
  if(e>1)return{k:'altura',l:'⛰ Altura',m:.8,d:'Zombie −20%, vedetta +1'};
  if(y>515&&y<595&&e<.2)return{k:'bassa',l:'💧 Zona bassa',m:.95,d:'Barricata −25%: rischio allagamento'};
  if(d>.25)return{k:'salita',l:'⬆ Salita',m:.8,d:'L’orda sale: zombie −20%'};
  if(d<-.05)return{k:'discesa',l:'⬇ Discesa',m:1.2,d:'L’orda scende: zombie +20%'};
  return{k:'piano',l:'➖ Pianura',m:1,d:'Nessun effetto'};}
/* effetti in battaglia */
const _buildSites=buildSites;
buildSites=function(c){const out=_buildSites(c);out.forEach(s=>{const t=terrainAt(s.x,s.y);s.slope=t.m;s.terr=t;
  if(t.k==='altura'){if(s.def&&s.def[0])s.def[0].lv+=1;else s.def=[{lv:1,lane:1}];}
  if(t.k==='bassa'&&s.barMax)s.barMax=Math.round(s.barMax*.75);
  if(s.name&&t.k!=='piano')s.name+=' · '+t.l;const lb=G.lots[s.id];if(lb&&lb.owner){s.name+=' · di @'+FRIEND_NICK(lb.owner);s.short='@'+FRIEND_NICK(lb.owner).slice(0,8);}});return out;};
/* mappa del quartiere: rilievo, etichette e, se attivo, quartiere vero */
function freeSpots(n){const used=[...LOTS.map(l=>[l.x,l.y]),...SLOTS.map(s=>[s.x,s.y]),...Object.values(HOME_POS)];const out=[];
  for(let y=-90;y<600&&out.length<n;y+=26)for(let x=26;x<380&&out.length<n;x+=22){if(Math.abs(x-196)<20)continue;if(used.every(([a,b])=>Math.hypot(a-x,b-y)>34)&&out.every(o=>Math.hypot(o[0]-x,o[1]-y)>60)){out.push([x,y]);}}return out;}
const _hoodSVG=hoodSVG;
hoodSVG=function(){let s=_hoodSVG();
  const hl=hills().map(h=>[1,.7,.45].map((k,i)=>`<ellipse cx="${h.x}" cy="${h.y}" rx="${h.s*k}" ry="${h.s*k*.62}" fill="${i===2?'#8a5a34':'none'}" fill-opacity="${i===2?.12:0}" stroke="#8a5a34" stroke-width="1.4" stroke-dasharray="5 4" opacity=".75"/>`).join('')+`<text x="${h.x}" y="${h.y+4}" text-anchor="middle" font-family="Bangers,Impact" font-size="11" fill="#5a3b24" opacity=".85">COLLE</text>`).join('');
  const mine=[['home',...HOME_POS[HTYPES[G.type].zone]],...Object.keys(G.lots).map(id=>{const l=LOTS.find(x=>x.id===id);return l?[id,l.x,l.y]:null;}).filter(Boolean)];
  const tags=mine.map(([id,x,y])=>{const t=terrainAt(x,y);if(t.k==='piano')return'';const col={salita:'#3f9b5f',altura:'#3f9b5f',discesa:'#d7263d',bassa:'#2f7fb8'}[t.k];const w=t.l.length*5.4+8;
    return`<g pointer-events="none"><rect x="${x-w/2}" y="${y+22}" width="${w}" height="12" rx="3" fill="${col}" stroke="#140f1f" stroke-width="1.2"/><text x="${x}" y="${y+31}" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">${t.l}</text></g>`;}).join('');
  let real='';
  if(G.realHood&&S.zone){const sp=freeSpots(9);const kinds=[...new Set(S.zone.resources.map(r=>r.kind))].slice(0,5);
    real=kinds.map((k,i)=>{const r=S.zone.resources.find(x=>x.kind===k);const [x,y]=sp[i]||[0,0];return`<g data-rsv="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#140f1f" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13">${RES_ICON[k][0]}</text></g>`;}).join('')
     +Object.keys(SPONSORS).map((k,i)=>{const [x,y]=sp[5+i]||[0,0];return`<g data-rsp="${k}" style="cursor:pointer"><rect x="${x-18}" y="${y-14}" width="36" height="28" fill="#f7d64a" stroke="#140f1f" stroke-width="2.5"/><path d="M${x-22} ${y-12} L${x} ${y-26} L${x+22} ${y-12}Z" fill="#d7263d" stroke="#140f1f" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-family="Bangers,Impact" font-size="12" fill="#140f1f">${SPONSORS[k].logo}</text><text x="${x+15}" y="${y-12}" font-size="10">⭐</text><rect x="${x-18}" y="${y+16}" width="36" height="11" rx="3" fill="#fff" stroke="#140f1f" stroke-width="1.2"/><text x="${x}" y="${y+24.5}" text-anchor="middle" font-size="8" font-weight="700" fill="#140f1f">${rvStarsTxt('sp-'+k).split(' (')[0]}</text></g>`;}).join('');
    s=s.replace("'IL TUO QUARTIERE'","").replace('IL TUO QUARTIERE','QUARTIERE VERO');
    if(S.realNames&&S.realNames.length){const N=S.realNames.map(x=>x.toUpperCase().slice(0,22));[['PIAZZA GRANDE',0],['VIA ROMA',1],['VIALE DEI TIGLI',2],['STRADA ARGINE',3],['PORTO SUL FIUME',4]].forEach(([o,i])=>{if(N[i])s=s.split('>'+o+'<').join('>'+N[i]+'<');});}}
  const own=Object.entries(G.lots).filter(([,b])=>b.owner).map(([id,b])=>{const l=LOTS.find(x=>x.id===id);if(!l)return'';const n=FRIEND_NICK(b.owner);
    return`<g pointer-events="none"><circle cx="${l.x-16}" cy="${l.y-14}" r="8" fill="#c9b8ff" stroke="#140f1f" stroke-width="1.8"/><text x="${l.x-16}" y="${l.y-10.5}" text-anchor="middle" font-family="Bangers,Impact" font-size="10" fill="#140f1f">${n[0].toUpperCase()}</text>${b.sale?`<rect x="${l.x-22}" y="${l.y+16}" width="44" height="11" rx="3" fill="#f7d64a" stroke="#140f1f" stroke-width="1.2"/><text x="${l.x}" y="${l.y+24.5}" text-anchor="middle" font-size="7.5" font-weight="700" fill="#140f1f">€ in vendita</text>`:''}</g>`;}).join('');
  const H=G.hoods&&G.hoods[G.curHood];if(H&&H.id!=='own')s=s.replace('IL TUO QUARTIERE',`DI @${FRIEND_NICK(H.host).toUpperCase()} · ${(H.city||'').toUpperCase()}`);
  real+=own;
  const i=s.lastIndexOf('<g transform="translate(0');const cut=i>0?i:s.lastIndexOf('</svg>');
  return s.slice(0,cut)+`<g pointer-events="none">${hl}</g>`+tags+real+s.slice(cut);};
function realHoodCard(){
  if(!S.zone)return`<div class="panel moon rhood"><b class="disp" style="font-size:20px">🗺️ Gioca nel tuo quartiere vero</b><p style="font-weight:400;font-size:13px;margin:4px 0 8px">Valuta la casa vera: il quartiere del gioco prende fiume, colline, servizi e sponsor della tua zona reale.</p><button class="btn small" data-go="valuta">Valuta la mia casa</button></div>`;
  const on=!!G.realHood;const ht=terrainAt(...HOME_POS[HTYPES[G.type].zone]);
  return`<div class="panel rhood ${on?'moon':''}"><div class="row spread"><b class="disp" style="font-size:20px">🗺️ Quartiere vero</b><label class="sw"><input type="checkbox" id="rhOn" ${on?'checked':''}><span>${on?'Attivo':'Spento'}</span></label></div>
    <p style="font-weight:400;font-size:13px;margin:4px 0">${on?`Generato da <b>${esc(S.zone.address)}</b>: colline, servizi reali e sponsor della zona. Gli sponsor mandano più casse di rifornimenti.`:'Accendilo per giocare nel quartiere generato dalla tua zona reale.'}</p>
    <p style="font-size:13px;margin-top:4px">Casa tua: <b>${ht.l}</b> · ${ht.d}</p></div>`;}
function decorateHood(){const h=[...app.querySelectorAll('h3')].find(x=>x.textContent.trim().startsWith('Il quartiere'));if(!h||app.querySelector('.rhood'))return;
  h.insertAdjacentHTML('beforebegin',realHoodCard());const card=app.querySelector('.rhood');card.dataset.grp='q';card.hidden=(G.sub||'q')!=='q';
  bindGo();const t=$('#rhOn');if(t)t.onchange=()=>{G.realHood=t.checked;toast(G.realHood?'Quartiere vero attivo':'Torni al quartiere di fantasia');renderHub();};
  const svg=app.querySelector('.hood svg');if(svg)svg.addEventListener('click',e=>{const a=e.target.closest('[data-rsv]'),b=e.target.closest('[data-rsp]');
    if(a){const r=S.zone.resources.find(x=>x.kind===a.dataset.rsv);toast(`${RES_ICON[r.kind][0]} ${r.name} · servizio reale a ${r.dist<1000?r.dist+' m':(r.dist/1000).toFixed(1).replace('.',',')+' km'}`);}
    if(b){e.stopPropagation();sponsorSheet(b.dataset.rsp,S.zone);}});}
</script>
<script>
/* =========================================================
   PRESIDI DI ZONA (livello condiviso) + RECENSIONI OVUNQUE
   - presidi: luoghi pubblici e attività sponsor reali; ogni settimana
     li tiene chi stabilisce il record di resistenza. Nessuna casa privata.
   - recensioni: toccando attività e sponsor su qualsiasi mappa
   ========================================================= */
const PRES_BASE=[['piazza','Piazza principale','⛲','Luogo pubblico'],['parco','Parco giochi','🌳','Luogo pubblico'],['stazione','Stazione','🚆','Luogo pubblico']];
function presList(){
  const z=S.zone;const r=rng(((z&&z.seed)||7)+404);
  const seen=new Set();const real=z?z.resources.filter(x=>['farm','super','ferr','osp'].includes(x.kind)&&!seen.has(x.kind)&&seen.add(x.kind)).slice(0,2).map(x=>[('r-'+x.kind),x.name,RES_ICON[x.kind][0],'Attività della zona']):[['farm','Farmacia Centrale','💊','Attività della zona']];
  const sp=Object.keys(SPONSORS).slice(0,2).map(k=>['sp-'+k,SPONSORS[k].name,'⭐','Sponsor']);
  G.pres=G.pres||{};
  return[...PRES_BASE,...real,...sp].map(([id,name,ic,kind])=>{if(!G.pres[id]){const n=OPP_N[Math.floor(r()*OPP_N.length)];G.pres[id]={holder:n,rec:3+Math.floor(r()*6),mine:0};}return{id,name,ic,kind,...G.pres[id]};});}
function presHeld(){return Object.values(G.pres||{}).filter(p=>p.holder==='Tu').length;}
function presDays(){const d=new Date().getDay();return d===1?7:(8-d)%7||7;}
function presHTML(){const ps=presList();const held=presHeld();
  return`<div class="panel pres"><div class="row spread"><b class="disp" style="font-size:24px">🚩 Presidi della zona</b><span class="tag">azzeramento tra ${presDays()} g</span></div>
   <p style="font-weight:400;font-size:13px;margin:4px 0 8px">Luoghi pubblici e attività vere della tua zona${S.zone?` (${esc(S.zone.address)})`:''}. Li tiene chi resiste più ondate questa settimana. Ogni presidio tenuto: <b>+5% monete</b> in tutte le ondate${held?` · ora ne tieni <b>${held}</b>`:''}.</p>
   ${ps.map(p=>`<div class="presr ${p.holder==='Tu'?'mine':''}"><span class="pi">${p.ic}</span><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><small>${p.kind}${p.kind==='Sponsor'?' · '+rvStarsTxt('sp-'+p.id.slice(3)):''}</small>
     <small>${p.holder==='Tu'?'🚩 Lo tieni tu':'Tenuto da @'+esc(p.holder)} · record ${p.rec} ondate${p.mine&&p.holder!=='Tu'?` · il tuo ${p.mine}`:''}</small></div>
     <button class="btn small ${p.holder==='Tu'?'ghost':''}" data-pres="${p.id}">${p.holder==='Tu'?'Difendi':'Conquista'}</button></div>`).join('')}
   <p class="muted" style="font-size:11px;margin-top:6px">Nessuna casa privata: solo luoghi pubblici e attività che hanno scelto di partecipare.</p></div>`;}
function presPlay(id){const p=presList().find(x=>x.id===id);const ps=myProps();
  openSheet(`🚩 ${esc(p.name)}`,`<p class="muted" style="margin-bottom:8px">Record da battere: <b>${p.rec} ondate</b> (${p.holder==='Tu'?'tuo':'@'+esc(p.holder)}). Scegli la casa che difende il presidio.</p>
    ${ps.sort((a,b)=>b.pow-a.pow).map(x=>`<div class="choice2"><img alt="" src="${custImg(x.id,54,64)}"><span><b>${esc(x.name)}</b><small>Potenza ${x.pow}</small></span><span class="col2"><button class="btn small" data-pp="${x.id}">Gioca</button></span></div>`).join('')}`,
  card=>card.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{closeSheet();
    const opp={nick:p.holder==='Tu'?'record':p.holder,kind:'apt',pow:propPower(b.dataset.pp),cust:randCust(rng(7))};
    arenaPlay(b.dataset.pp,opp,{title:'Presidio · '+p.name,seed:id.length*977+7,targetOverride:p.rec,onEnd:res=>{const st=G.pres[id];st.mine=Math.max(st.mine||0,res.mine);let extra='';
      if(res.mine>st.rec){st.rec=res.mine;const was=st.holder;st.holder='Tu';G.gems+=8;extra=`<p><b>🚩 Presidio conquistato${was!=='Tu'?' da @'+esc(was):''}! +8 💎 e +5% monete in tutte le ondate.</b></p>`;}
      else extra=`<p>Record da battere: ${st.rec} ondate.</p>`;
      arenaResult({...res,opp:st.rec,res:res.mine>=st.rec?'win':'lose'},{nick:p.holder==='Tu'?'il record':p.holder},null,extra);}});}));}
function bindPres(){app.querySelectorAll('[data-pres]').forEach(b=>b.onclick=()=>presPlay(b.dataset.pres));}
/* ---------- stelle e recensioni ovunque ---------- */
function rvKeySp(k){return'sp-'+k;}
function rvStarsTxt(key){const l=rvList(key,8,4.2);const a=rvAvg(l);return`★ ${a.toFixed(1).replace('.',',')} (${l.length})`;}
function rvBtn(key,name,n=8,b=4.2){return`<button class="btn small ghost" data-rvx="${esc(key)}" data-rvn="${esc(name)}" data-rvc="${n}" data-rvb="${b}">Recensioni</button>`;}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-rvx]');if(!b)return;e.stopPropagation();reviewsSheet(b.dataset.rvx,b.dataset.rvn,+b.dataset.rvc,+b.dataset.rvb);},true);
</script>
<script>
/* =========================================================
   QUARTIERI CONDIVISI
   - ognuno ha il proprio quartiere; con un invito si entra nel
     quartiere di un altro (es. Mantova ↔ Firenze) e lo si difende insieme
   - gli edifici hanno un proprietario; si possono vendere e comprare
     tra i membri del quartiere
   - nessuna casa reale: solo edifici a fumetto
   ========================================================= */
const FRIEND_NICK=id=>{const f=(G.friends||[]).find(x=>x.id===id);return f?f.nick:id;};
function hoodsInit(){if(G.hoods)return;G.hoods={own:{id:'own',name:'Il tuo quartiere',city:S.zone?S.zone.address.split(',').slice(-1)[0].trim():'Il tuo comune',host:null,members:[],lots:G.lots}};G.curHood='own';
  G.invites=[{id:'h-luna',from:'f1',city:'Firenze'}];}
function curHood(){hoodsInit();return G.hoods[G.curHood];}
function makeGuestHood(inv){const r=rng(9131+inv.city.length*31);const ids=LOTS.map(l=>l.id).sort(()=>r()-.5);const lots={};
  ids.slice(0,7).forEach((id,i)=>{lots[id]=i%3===2?{kind:'bld',b:['farmacia','caserma','supermercato'][i%3===2?Math.floor(r()*3):0],lv:1+Math.floor(r()*2),owner:inv.from}:{kind:'house',lv:1+Math.floor(r()*2),ten:{n:['mecc','inf','guard','orto'][Math.floor(r()*4)]},prep:1+Math.floor(r()*2),owner:inv.from};});
  lots[ids[1]].sale=Math.round(LOTS.find(l=>l.id===ids[1]).cost*1.3/10)*10;
  return{id:inv.id,name:`Quartiere di @${FRIEND_NICK(inv.from)}`,city:inv.city,host:inv.from,members:[inv.from],lots,seed:inv.city.length*977+13};}
function setHood(id){hoodsInit();G.hoods[G.curHood].lots=G.lots;G.curHood=id;G.lots=G.hoods[id].lots;G.sel=null;vibe();toast(`Sei in: ${G.hoods[id].name}${G.hoods[id].city?' · '+G.hoods[id].city:''}`);renderHub();window.scrollTo(0,0);}
function hoodBar(){hoodsInit();const H=curHood();
  return`<div class="panel hoodbar"><div class="row spread"><b class="disp" style="font-size:20px">🏘️ I tuoi quartieri</b><small class="muted">difendili insieme</small></div>
   <div class="hchips">${Object.values(G.hoods).map(h=>`<button class="hchip ${h.id===G.curHood?'on':''}" data-hood="${h.id}"><b>${h.id==='own'?'Il mio':'@'+esc(FRIEND_NICK(h.host))}</b><small>${esc(h.city||'')}${h.members.length?` · ${h.members.length+1} giocatori`:''}</small></button>`).join('')}</div>
   ${(G.invites||[]).map(v=>`<div class="hinv"><span>📨 <b>@${esc(FRIEND_NICK(v.from))}</b> ti invita nel suo quartiere a <b>${esc(v.city)}</b></span><button class="btn small" data-hacc="${v.id}">Unisciti</button></div>`).join('')}
   <div class="row" style="gap:6px;margin-top:8px"><input class="field" id="hcode" placeholder="Codice invito (prova: ZSH-ROMA)" autocapitalize="characters" style="flex:1"><button class="btn small ghost" id="hjoin">Entra</button></div>
   ${H.id==='own'?`<button class="btn small alt" id="hinvite" style="margin-top:8px">Invita qualcuno nel tuo quartiere</button>`:`<p style="font-weight:400;font-size:13px;margin-top:8px">Sei ospite di @${esc(FRIEND_NICK(H.host))}: compra edifici liberi, difendi anche i suoi. Edifici in vendita hanno il bollino <b>€ in vendita</b>.</p>`}
   ${H.members.length?`<p class="muted" style="font-size:12px;margin-top:6px">In questo quartiere: Tu, ${H.members.map(m=>'@'+esc(FRIEND_NICK(m))).join(', ')}. L’orda attacca tutti gli edifici: chi gioca difende anche quelli degli altri.</p>`:''}</div>`;}
function bindHoods(){
  app.querySelectorAll('[data-hood]').forEach(b=>b.onclick=()=>setHood(b.dataset.hood));
  app.querySelectorAll('[data-hacc]').forEach(b=>b.onclick=()=>{const v=G.invites.find(x=>x.id===b.dataset.hacc);G.invites=G.invites.filter(x=>x!==v);G.hoods[v.id]=makeGuestHood(v);sfx('win');setHood(v.id);});
  const j=$('#hjoin');if(j)j.onclick=()=>{const c=($('#hcode').value||'').trim().toUpperCase();const m=c.match(/^ZSH-([A-Z]+)$/);if(!m){toast('Codice non valido');return;}
    const city=m[1][0]+m[1].slice(1).toLowerCase();const id='h-'+city.toLowerCase();if(G.hoods[id]){setHood(id);return;}
    const from=(G.friends||[])[1]?G.friends[1].id:'f2';G.hoods[id]=makeGuestHood({id,from,city});setHood(id);};
  const inv=$('#hinvite');if(inv)inv.onclick=()=>{if(window.doInvite)window.doInvite();setTimeout(()=>{const H=G.hoods.own;if(H.members.includes('f3'))return;H.members.push('f3');
    const r=rng(77);const free=LOTS.filter(l=>!G.lots[l.id]).sort(()=>r()-.5).slice(0,2);free.forEach((l,i)=>{G.lots[l.id]={kind:'house',lv:1,ten:{n:'orto'},owner:'f3',...(i===0?{sale:Math.round(l.cost*1.2/10)*10}:{})};});
    toast('@zia_pina è entrata nel tuo quartiere e ha comprato 2 edifici');if(S.tab==='orda'&&G.view==='hub')renderHub();},2600);};
}
/* edifici di altri: scheda dedicata; i propri: vendita */
const _lotSheet=lotSheet;
lotSheet=function(id){const b=G.lots[id];const l=LOTS.find(x=>x.id===id);
  if(b&&b.owner){const nick=FRIEND_NICK(b.owner);const nm=b.kind==='bld'?BLD[b.b].name:LOT_KIND[l.kind].n;
    openSheet(`${b.kind==='bld'?BLD[b.b].ic:'🏠'} ${nm} di @${esc(nick)}`,`<p style="font-weight:400;margin-bottom:8px">${ZL[l.zone]} · lo difendi anche tu: quando l’orda arriva qui, puoi correre a proteggerlo dal radar.</p>
      ${b.sale?`<div class="wsbuy ${G.coins<b.sale?'no':''}"><div><b>In vendita</b><small>@${esc(nick)} lo vende a 🪙 ${b.sale}</small>${G.coins<b.sale?`<small>Ti mancano ${b.sale-G.coins} monete.</small>`:''}</div><div class="col2"><button class="btn small" data-obuy ${G.coins<b.sale?'disabled':''}>Compra</button></div></div>`
        :`<button class="btn wide ghost" data-oask>Chiedi a @${esc(nick)} di vendertelo</button>`}`,
    card=>{const bb=card.querySelector('[data-obuy]');if(bb)bb.onclick=()=>{if(G.coins<b.sale)return;G.coins-=b.sale;delete b.owner;delete b.sale;sfx('coin');toast(`Comprato da @${nick}: ora è tuo`);closeSheet();renderHub();};
      const ak=card.querySelector('[data-oask]');if(ak)ak.onclick=()=>{ak.disabled=true;ak.textContent='Richiesta inviata…';setTimeout(()=>{b.sale=Math.round(l.cost*1.4/10)*10;toast(`@${nick} accetta: te lo vende a 🪙 ${b.sale}`);lotSheet(id);},1600);};});return;}
  _lotSheet(id);
  const H=curHood();const others=H.id==='own'?H.members:[H.host,...H.members.filter(m=>m!==H.host)];
  if(b&&others.length){const body=document.querySelector('#sheet .sheet-b');if(!body)return;const nick=FRIEND_NICK(others[0]);const price=Math.round(l.cost*(b.kind==='bld'?1.1:1)*(1+.2*((b.lv||1)-1))/10)*10;
    body.insertAdjacentHTML('beforeend',`<div class="wsbuy" style="margin-top:12px"><div><b>💱 Vendi a @${esc(nick)}</b><small>Prezzo proposto 🪙 ${price}. Lui o lei decide se comprare.</small></div><div class="col2"><button class="btn small alt" data-osell>Proponi</button></div></div>`);
    body.querySelector('[data-osell]').onclick=e=>{e.target.disabled=true;e.target.textContent='Proposta inviata';setTimeout(()=>{if(!G.lots[id])return;G.coins+=price;G.lots[id].owner=others[0];delete G.lots[id].sale;toast(`@${nick} ha comprato per 🪙 ${price}`);closeSheet();if(S.tab==='orda'&&G.view==='hub')renderHub();},1800);};}
};
</script>
<script>
/* =========================================================
   CAMPAGNA "LE NOTTI DELL'ASSEDIO": progressione chiara del gioco
   capitoli da 5 notti, stelle per notte, boss, notti da rigiocare
   ========================================================= */
const CHAP=['Prime notti','L’orda cresce','Il Bruto della Sagra','Notti senza luce','La grande migrazione','Assedio totale'];
function campHTML(){const max=Math.max(G.level+4,10);G.stars=G.stars||{};const totS=Object.values(G.stars).reduce((a,b)=>a+b,0);
  const ch=Math.floor((G.level-1)/5);
  return`<div class="panel camp"><div class="row spread"><div><b class="disp" style="font-size:22px">🌙 Le notti dell’assedio</b><small class="muted" style="display:block">Capitolo ${ch+1} · ${CHAP[ch%CHAP.length]}</small></div><span class="tag sp">★ ${totS} / ${(G.level-1)*3}</span></div>
   <div class="seg" style="margin:8px 0 0"><button class="${G.style!=='classico'?'on':''}" data-style="tattico">♟️ Tattico</button><button class="${G.style==='classico'?'on':''}" data-style="classico">👆 Classico</button></div><small class="muted" style="display:block;margin-top:4px">${G.style==='classico'?'Si colpiscono gli zombie toccandoli.':'Si gioca con carte, provviste e bersagli: conta la strategia.'}</small>
   <div class="cpath">${Array.from({length:max},(_,i)=>{const n=i+1;const done=n<G.level,cur=n===G.level,boss=n%5===0;const st=G.stars[n]||0;
     return`${n%5===1?`<div class="cch">Cap. ${Math.floor(i/5)+1}<br><small>${CHAP[Math.floor(i/5)%CHAP.length]}</small></div>`:''}<button class="cn ${done?'done':''} ${cur?'cur':''} ${boss?'boss':''}" data-night="${n}" ${n>G.level?'disabled':''} aria-label="Notte ${n}"><b>${boss?'👑':n}</b><small>${done?'★'.repeat(st)+'☆'.repeat(3-st):cur?'ORA':'🔒'}</small></button>`;}).join('')}</div>
   <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn small" data-rules>📖 Come si gioca</button><button class="btn small ${G.quick!==false?'':'ghost'}" data-quick>⚡ Avvio rapido: ${G.quick!==false?'sì':'no'}</button></div>

<script>

const RULES_Z=[['🧟','Vagante','lento, il più comune'],['🏃','Corridore','veloce: fermalo con trappole'],['💪','Bruto','tanta vita: segnalo come bersaglio'],['⛑️','Col casco','dimezza i danni'],['📣','Strillone','fa infuriare chi gli sta vicino'],['⛏️','Scavatore','sotto terra: solo il petardo lo colpisce'],['✨','D’oro','scappa: se lo prendi, 3 gemme'],['👑','Boss','ogni 5 notti, chiama rinforzi']];
function rulesHTML(){return`<div class="rules">

  <div class="rb"><b>🧟 I nemici</b><div class="rtab z">${RULES_Z.map(z=>`<div><span>${z[0]}</span><b>${z[1]}</b><small>${z[2]}</small></div>`).join('')}</div></div>

function openRules(){openSheet('📖 Come si gioca',rulesHTML(),card=>{const b=card.querySelector('[data-tutagain]');if(b)b.onclick=()=>{G.tutDone=false;toast('Il tutorial ripartirà alla prossima battaglia');closeSheet();};});}
const COACH=[[null,'Benvenuta nell’assedio!','Gli zombie arrivano da destra su 3 corsie. Prima abbattono la barricata, poi attaccano la casa. Il gioco è in pausa: leggi con calma.'],

 ['#cv','Bersaglio e combo','Tocca uno zombie: diventa il bersaglio e prende più danni. Scacciane tanti di fila per una combo che ridà provviste. A metà notte sceglierai un rifornimento.'],
 ['#hab','L’abilità della casa','Il pulsante arancione: un colpo speciale con ricarica, diverso per ogni edificio.'],
 ['.radar','La mappa dell’assedio','Se hai più edifici, toccali qui per correre a difenderli. “Vai dove serve” ti porta dove c’è più pericolo.'],
 [null,'Pronta!','In alto trovi l’obiettivo bonus. Le regole complete sono sempre nel pulsante ❓. Buona difesa!']];
function coach(st,i=0){document.querySelectorAll('.coach-hl').forEach(e=>e.classList.remove('coach-hl'));let o=document.getElementById('coach');if(!o){o=document.createElement('div');o.id='coach';document.body.appendChild(o);}

<script>

<script>
/* =========================================================
   ORDA · GIORNO E NOTTE
   Giorno: spedizioni con la tua squadra (tempo reale) → materiali
           laboratorio → kit montati automaticamente la notte
   Notte:  piano di difesa e battaglia (già esistenti)
   Nella versione online i tempi sono in minuti/ore; qui in secondi.
   ========================================================= */
const MATS={legno:'🪵',metallo:'🔩',batterie:'🔋',medicine:'💊',cibo:'🥫'};
const EXPS=[
 {id:'spon',n:'Magazzino di Ferramenta Volta',ic:'⭐',t:25,risk:0,loot:{legno:[2,3],metallo:[2,3]},sp:'ferr',d:'Offerto dallo sponsor: una volta al giorno, senza rischi'},
 {id:'super',n:'Supermercato abbandonato',ic:'🛒',t:35,risk:.15,loot:{cibo:[2,4],legno:[0,2]},d:'Vicino e sicuro: cibo e qualche asse'},
 {id:'ferr',n:'Cantiere dietro la chiesa',ic:'🏗️',t:55,risk:.25,loot:{metallo:[2,4],legno:[1,3]},d:'Metallo e legno per trappole e barricate'},
 {id:'osp',n:'Vecchio ospedale',ic:'🏥',t:80,risk:.35,loot:{medicine:[1,3],batterie:[0,2]},d:'Medicine preziose, ma l’orda è vicina'},
 {id:'cen',n:'Centrale elettrica',ic:'⚡',t:110,risk:.45,loot:{batterie:[2,4],metallo:[1,2]},d:'Batterie per le torrette: il posto più pericoloso'}];
const RECIPES=[
 {id:'trap',n:'Kit trappole',ic:'🪤',cost:{metallo:2,legno:1},eff:'+3 trappole sull’edificio più attaccato'},
 {id:'bar',n:'Barricata rinforzata',ic:'🪵',cost:{legno:3,metallo:1},eff:'+40% barricata a casa tua'},
 {id:'tur',n:'Torretta',ic:'🎯',cost:{metallo:2,batterie:2},eff:'+1 torretta a casa tua'},
 {id:'med',n:'Kit medico',ic:'⛑️',cost:{medicine:2,cibo:1},eff:'Casa tua parte con il 25% di resistenza in più'}];
function dayInit(){G.mat=G.mat||{legno:2,metallo:1,batterie:0,medicine:0,cibo:2};G.kit=G.kit||{trap:0,bar:0,tur:0,med:0};G.exp=G.exp||[];G.expDay=G.expDay||{};}
function squad(){const s=[{id:'fam',n:'La tua famiglia',p:2}];Object.entries(G.lots||{}).forEach(([id,b])=>{const t=tenOf(b);if(t&&!b.owner)s.push({id,n:t.type==='friend'?'@'+t.f.nick:TENANTS[t.role].name,p:1+(b.prep||1)});});return s;}
function busy(id){return G.exp.some(e=>e.who.includes(id));}
function dayHTML(){dayInit();const now=Date.now();const today=new Date().toDateString();
  return`<div class="panel dayp"><div class="row spread"><b class="disp" style="font-size:24px">☀️ Giorno: prepara la notte</b><span class="mats">${Object.entries(MATS).map(([k,i])=>`<span title="${k}">${i} ${G.mat[k]}</span>`).join('')}</span></div>
   <p style="font-weight:400;font-size:13px;margin:4px 0 8px">Manda la squadra in spedizione, torna a raccogliere, costruisci in laboratorio. I kit si montano da soli quando parte la notte.</p>
   ${G.exp.map((e,i)=>{const X=EXPS.find(x=>x.id===e.id)||{n:'Spedizione',ic:'🎒'};const done=now>=e.end;const pc=Math.min(100,(now-e.start)/(e.end-e.start)*100);return`<div class="exprun"><span>${X.ic}</span><div style="flex:1"><b>${X.n}</b><small>${e.who.length} in squadra · ${done?'rientrati':'rientro tra '+Math.ceil((e.end-now)/1000)+' s'}</small><div class="vbar"><span style="width:${pc}%"></span></div></div>${done?`<button class="btn small" data-expok="${i}">Raccogli</button>`:''}</div>`;}).join('')}
   <div class="explist">${EXPS.filter(x=>!x.hide).map(x=>{const used=x.sp&&G.expDay[x.id]===today;return`<button class="expc ${x.sp?'sp':''}" data-exp="${x.id}" ${used?'disabled':''}><span class="ei">${x.ic}</span><b>${x.n}</b><small>${x.d}</small><small>⏱ ${x.t} s · rischio ${Math.round(x.risk*100)}% · ${Object.keys(x.loot).map(k=>MATS[k]).join(' ')}</small>${used?'<small><b>Già fatta oggi</b></small>':''}</button>`;}).join('')}</div>
   <p class="disp" style="font-size:20px;margin:10px 0 6px">🧪 Laboratorio</p>
   <div class="recs">${RECIPES.map(r=>{const ok=Object.entries(r.cost).every(([k,v])=>G.mat[k]>=v);return`<button class="rec" data-rec="${r.id}" ${ok?'':'disabled'}><span>${r.ic}</span><b>${r.n} ${G.kit[r.id]?'×'+G.kit[r.id]:''}</b><small>${Object.entries(r.cost).map(([k,v])=>MATS[k]+v).join(' ')} → ${r.eff}</small></button>`;}).join('')}</div></div>`;}
function expSheet(id){const X=EXPS.find(x=>x.id===id);const sq=squad().filter(s=>!busy(s.id));const sel=new Set(sq.slice(0,1).map(s=>s.id));
  const draw=()=>openSheet(`${X.ic} ${X.n}`,`<p style="font-weight:400;margin-bottom:8px">${X.d}. Durata ${X.t} secondi (online: minuti o ore).</p>
    ${sq.length?sq.map(s=>`<button class="choice" data-sq="${s.id}"><span class="ci">${sel.has(s.id)?'✅':'⬜'}</span><span><b>${esc(s.n)}</b><small>forza ${s.p}</small></span><span class="cp">${sel.has(s.id)?'In squadra':'Aggiungi'}</span></button>`).join(''):'<p class="notice">Sono tutti fuori in spedizione: aspetta che rientrino.</p>'}
    <div class="notice" style="margin:8px 0">Probabilità di successo: <b>${Math.round(Math.min(.98,1-X.risk+[...sel].reduce((a,id)=>a+(sq.find(s=>s.id===id)||{p:0}).p*.05,0))*100)}%</b>. Più persone e più addestrate = meno rischi.</div>
    <button class="btn wide" data-sgo ${sel.size?'':'disabled'}>Parti</button>`,card=>{
    card.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{const k=b.dataset.sq;sel.has(k)?sel.delete(k):sel.add(k);draw();});
    card.querySelector('[data-sgo]').onclick=()=>{const now=Date.now();G.exp.push({id,who:[...sel],start:now,end:now+X.t*1000,pow:[...sel].reduce((a,id)=>a+(sq.find(s=>s.id===id)||{p:0}).p,0)});if(X.sp)G.expDay[id]=new Date().toDateString();closeSheet();toast('Squadra partita');sfx('tap');renderHub();if(window.__dayT)clearInterval(window.__dayT);window.__dayT=setInterval(()=>{if(S.tab==='orda'&&G.view==='hub'&&(G.sub||'q')==='q'&&!document.querySelector('#sheet.open'))dayRefresh();},1000);};});
  draw();}
function dayRefresh(){const el=app.querySelector('.dayp');if(!el)return;const n=document.createElement('div');n.innerHTML=dayHTML();el.replaceWith(n.firstElementChild);bindDay();}
function bindDay(){app.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>expSheet(b.dataset.exp));
  app.querySelectorAll('[data-expok]').forEach(b=>b.onclick=()=>{const e=G.exp[+b.dataset.expok];const X=EXPS.find(x=>x.id===e.id)||{risk:.2,loot:{cibo:[1,2]}};const ok=Math.random()<Math.min(.98,1-X.risk+e.pow*.05);
    const got={};Object.entries(X.loot).forEach(([k,[a,c]])=>{let n=a+Math.floor(Math.random()*(c-a+1));if(!ok)n=Math.floor(n/2);if(n>0){G.mat[k]+=n;got[k]=n;}});
    G.exp.splice(+b.dataset.expok,1);try{if(window.onExpDone)window.onExpDone(e.id,ok);}catch(x){}sfx(ok?'coin':'crack');if(typeof objAdd==='function'){}
    openSheet(ok?'Spedizione riuscita!':'Spedizione difficile',`<p style="font-size:18px">${ok?'La squadra torna con:':'Attaccati sulla via del ritorno, salvano solo:'}</p><p class="disp" style="font-size:34px;margin:10px 0">${Object.entries(got).map(([k,n])=>MATS[k]+' +'+n).join(' · ')||'niente'}</p>${X.sp?`<p class="notice">Materiali offerti da <b>${(SPONSORS[X.sp]||{name:'uno sponsor della zona'}).name}</b>. ${SP_OFF&&SP_OFF[X.sp]?'Nella vita vera: '+SP_OFF[X.sp]:''}</p>`:''}`);renderHub();});
  app.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{const r=RECIPES.find(x=>x.id===b.dataset.rec);if(!Object.entries(r.cost).every(([k,v])=>G.mat[k]>=v))return;Object.entries(r.cost).forEach(([k,v])=>G.mat[k]-=v);G.kit[r.id]++;sfx('coin');toast(`${r.ic} ${r.n} pronto per stanotte`);renderHub();});}
</script>
<script>
/* =========================================================
   ZONE > VIVERE QUI — dati di zona per chi cerca casa
   Produzione: negozi e servizi da Google Places / OpenStreetMap,
   trasporti da GTFS regionali, prezzi da quotazioni OMI (Agenzia
   delle Entrate) + annunci forniti dalle agenzie partner via feed.
   Nessun dato su criminalità o composizione sociale.
   ========================================================= */
const BIZ=[['bar','Bar','☕'],['alim','Alimentari','🧀'],['pane','Panificio','🥖'],['risto','Ristorante','🍝'],['edic','Edicola','🗞️'],['parr','Parrucchiere','💈'],['gym','Palestra','🏋️'],['banca','Banca','🏦'],['posta','Ufficio postale','✉️'],['ferr','Ferramenta','🔧']];
const SURN=['Rossi','Bianchi','Ferrari','Gatti','Bassi','Neri','Colombo','Galli','Mantovani','Bellini'];
const AGENCIES=[{n:'Immobiliare Mincio',c:'#2f5fb8'},{n:'Casa & Co.',c:'#d7263d'},{n:'Studio Abitare',c:'#3f9b5f'},{n:'Agenzia Lago Blu',c:'#6fa8dc'}];
function reData(z){
  if(z._re)return z._re;
  const r=rng((z.seed||7)+77);const k=z.type==='centro'?1:z.type==='periferia'?.6:.3;
  const shops=[];BIZ.forEach(([id,lab,ic])=>{const n=Math.max(id==='posta'||id==='banca'?1:0,Math.round((1+r()*2.4)*k));for(let i=0;i<n;i++)shops.push({id,lab,ic,name:id==='ferr'&&i===0?'Ferramenta Volta':`${lab} ${SURN[Math.floor(r()*SURN.length)]}`,partner:id==='ferr'&&i===0||r()<.12,x:.06+r()*.88,y:.08+r()*.84,dist:Math.round((60+r()*900)/(.4+k))});});
  const stops=Array.from({length:z.type==='centro'?5:z.type==='periferia'?3:1},()=>({x:.08+r()*.84,y:.1+r()*.8}));
  const station=Math.round((z.type==='centro'?400:z.type==='periferia'?1500:5200)*(.6+r()*.8));
  const schools=Array.from({length:z.type==='centro'?3:z.type==='periferia'?2:1},(_,i)=>({name:['Scuola dell’infanzia','Scuola primaria','Scuola media'][i],x:.1+r()*.8,y:.1+r()*.8}));
  const parks=z.type==='campagna'?4:Math.round(1+r()*2);
  const base=z.type==='centro'?1950:z.type==='periferia'?1550:z.type==='lago'?2600:z.type==='montagna'?2900:1100;const sale=Math.round(base*(.85+r()*.3)/10)*10;
  const rent=Math.round(sale*.0046*10)/10;const trend=Math.round((-2+r()*8)*10)/10;

const VNAME={hotel:['Hotel Mincio','Hotel Alla Torre','Grand Hotel Lago'],bb:['B&B La Corte','B&B Il Glicine','B&B Casa Nonna'],agri:['Agriturismo Le Valli','Corte Bassa'],risto:['Trattoria del Ponte','Osteria La Nebbia','Pizzeria Luna Piena'],attr:['Castello medievale','Pista ciclabile del fiume','Museo civico'],camp:['Camping Riva Verde']};
function rvGen(key,n,base){const r=rng(key.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*7+n);const out=[];
  for(let i=0;i<n;i++){let st=Math.max(1,Math.min(5,Math.round(base+(r()-.5)*2.4)));const pool=RV_TXT[st];const tx=pool[Math.floor(r()*pool.length)];
    out.push({nick:RV_NICK[Math.floor(r()*RV_NICK.length)],st,title:tx[0],txt:tx[1],type:RV_TYPE[Math.floor(r()*RV_TYPE.length)][0],when:['settembre 2026','agosto 2026','luglio 2026','giugno 2026','ottobre 2026'][Math.floor(r()*5)],useful:Math.floor(r()*14),ver:r()<.6});}
  return out;}
function rvStore(){S.rv=S.rv||{};return S.rv;}
function rvList(key,seedN,base){const st=rvStore();if(!st[key])st[key]=rvGen(key,seedN,base);return st[key];}
function rvAvg(l){return l.length?l.reduce((a,x)=>a+x.st,0)/l.length:0;}
function rvStars(v,size=14){const full=Math.round(v*2)/2;return`<span class="rstars" style="font-size:${size}px" aria-label="${v.toFixed(1).replace('.',',')} su 5">${[1,2,3,4,5].map(i=>`<i class="${full>=i?'f':full>=i-.5?'h':''}"></i>`).join('')}</span>`;}
function rvLine(key,seedN,base){const l=rvList(key,seedN,base);const a=rvAvg(l);return`${rvStars(a)} <b>${a.toFixed(1).replace('.',',')}</b> <small class="muted">(${l.length})</small>`;}
function vacData(z){const r=rng((z.seed||7)+333);const out=[];VAC.forEach(([k,l,ic,pr])=>{(VNAME[k]||[]).forEach((nm,i)=>{if(r()<(k==='camp'&&z.type==='centro'?.1:.85))out.push({k,l,ic,name:nm,price:pr[Math.floor(r()*pr.length)],dist:Math.round(200+r()*4000),base:3.2+r()*1.6,n:6+Math.floor(r()*10),key:'v-'+(z.address||'')+'-'+nm,partner:r()<.18});});});return out;}
function vacanzaHTML(z){
  const items=vacData(z);const f=S.vf||'tutti';const sorted=items.filter(x=>f==='tutti'||x.k===f).sort((a,b)=>(b.partner-a.partner)||(rvAvg(rvList(b.key,b.n,b.base))-rvAvg(rvList(a.key,a.n,a.base))));
  return`${commCard(z)}<div class="panel mapwrap" style="padding:0;overflow:hidden" id="vacmap"><div class="mapsvg">${mapScene(z,{poi:false,users:false,heat:false,me:false,mode:'day',comm:true,spons:true})}</div><div class="mapinfo" id="vacinfo"><span class="muted">Tocca un’area per vedere la community, o una ⭐ per lo sponsor.</span></div></div><div class="panel moon"><b class="disp" style="font-size:22px">Vacanza in zona</b><p style="font-weight:400;font-size:14px;margin-top:4px">Dove dormire, mangiare e cosa vedere, con le recensioni di chi c’è stato davvero. E il livello di sicurezza della zona, per dormire tranquilli.</p></div>
   <div class="chips" style="margin:8px 0">${[['tutti','Tutto'],...VAC.map(v=>[v[0],v[2]+' '+v[1]])].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-vf="${k}">${l}</button>`).join('')}</div>
   ${sorted.map(x=>{const l=rvList(x.key,x.n,x.base);const a=rvAvg(l);return`<div class="vcard ${x.partner?'feat':''}">
     <div class="vic">${x.ic}</div><div style="flex:1;min-width:0">${x.partner?'<span class="tag sp">Sponsorizzato</span> ':''}<b class="disp" style="font-size:20px">${esc(x.name)}</b>
     <div class="row" style="gap:6px;flex-wrap:wrap">${rvStars(a,15)}<b>${a.toFixed(1).replace('.',',')}</b><small class="muted">${l.length} recensioni</small></div>
     <small>${x.l} · ${x.price} · a ${x.dist<1000?x.dist+' m':(x.dist/1000).toFixed(1).replace('.',',')+' km'}</small>
     ${l[0]?`<p class="vq">“${esc(l[l.length-1].txt)}” <small>— @${esc(l[l.length-1].nick)}</small></p>`:''}
     <div class="row" style="gap:6px;margin-top:6px"><button class="btn small" data-rv="${esc(x.key)}" data-rvn="${esc(x.name)}" data-rvc="${x.n}" data-rvb="${x.base.toFixed(2)}">Recensioni</button><button class="btn small ghost" data-rvw="${esc(x.key)}" data-rvn="${esc(x.name)}" data-rvc="${x.n}" data-rvb="${x.base.toFixed(2)}">Scrivi</button></div></div></div>`;}).join('')}
   <p class="notice" style="margin:10px 0">Come verifichiamo: una recensione per persona e per attività, controllo prima della pubblicazione, nessuna recensione a pagamento. Le recensioni “verificate” arrivano da chi ha dimostrato la visita.</p>`;
}
function reviewsSheet(key,name,n,base){
  const l=rvList(key,n,base);const a=rvAvg(l);const flt=S.rvf||'tutti';const cnt=[5,4,3,2,1].map(s=>l.filter(x=>x.st===s).length);
  const shown=l.filter(x=>flt==='tutti'||x.type===flt).slice().reverse();
  openSheet(`Recensioni · ${esc(name)}`,`
    <div class="rvtop"><div class="rvbig"><b>${a.toFixed(1).replace('.',',')}</b>${rvStars(a,18)}<small>${l.length} recensioni</small></div>
      <div class="rvbars">${[5,4,3,2,1].map((s,i)=>`<div><span>${['Eccellente','Molto buono','Nella media','Scarso','Pessimo'][i]}</span><i><b style="width:${l.length?cnt[i]/l.length*100:0}%"></b></i><small>${cnt[i]}</small></div>`).join('')}</div></div>
    <div class="chips" style="margin:10px 0">${[['tutti','Tutti'],...RV_TYPE].map(([k,t])=>`<button class="chip ${flt===k?'on':''}" data-rvf="${k}">${t}</button>`).join('')}</div>
    <button class="btn wide alt" data-rvw2>Scrivi una recensione</button>
    ${shown.map((r,i)=>`<div class="rv"><div class="row spread"><div class="row" style="gap:8px"><span class="ti av" style="background:${['#d7263d','#2f7fb8','#3f9b5f','#a8743a','#8f86b8'][r.nick.length%5]};width:32px;height:32px">${esc(r.nick[0].toUpperCase())}</span><div><b>@${esc(r.nick)}</b><small class="muted" style="display:block">${RV_TYPE.find(t=>t[0]===r.type)[1]} · ${esc(r.when)}</small></div></div>${r.ver?'<span class="tag ia">✓ visita verificata</span>':''}</div>
      <div style="margin-top:6px">${rvStars(r.st,15)} <b>${esc(r.title)}</b></div><p style="font-weight:400;font-size:14px;margin:4px 0">${esc(r.txt)}</p>
      <div class="row" style="gap:8px"><button class="linkbtn" data-useful="${l.indexOf(r)}">👍 Utile (${r.useful})</button><button class="linkbtn" data-report="1">Segnala</button></div></div>`).join('')||'<p class="notice">Nessuna recensione per questo tipo di viaggio.</p>'}`,
  card=>{card.querySelectorAll('[data-rvf]').forEach(b=>b.onclick=()=>{S.rvf=b.dataset.rvf;reviewsSheet(key,name,n,base);});
    card.querySelector('[data-rvw2]').onclick=()=>writeReview(key,name,n,base);
    card.querySelectorAll('[data-useful]').forEach(b=>b.onclick=()=>{const r=l[+b.dataset.useful];if(r._u)return;r._u=1;r.useful++;b.textContent=`👍 Utile (${r.useful})`;});
    card.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>toast('Segnalazione inviata ai moderatori (demo)'));});
}
function writeReview(key,name,n,base){
  let st=0;
  openSheet(`La tua recensione · ${esc(name)}`,`
    <p class="muted" style="margin-bottom:6px">Com’è andata?</p>
    <div class="rpick" role="radiogroup" aria-label="Voto">${[1,2,3,4,5].map(i=>`<button data-st="${i}" role="radio" aria-label="${i} su 5">★</button>`).join('')}</div>
    <label class="fl" for="rT">Titolo</label><input class="field" id="rT" maxlength="60" placeholder="In breve">
    <label class="fl" for="rX">La tua esperienza</label><textarea class="field" id="rX" rows="4" placeholder="Cosa ti è piaciuto e cosa no? Almeno 50 caratteri."></textarea>
    <div class="row" style="gap:8px"><div style="flex:1"><label class="fl" for="rY">Con chi</label><select class="field" id="rY">${RV_TYPE.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>
      <div style="flex:1"><label class="fl" for="rM">Quando</label><select class="field" id="rM">${['ottobre 2026','settembre 2026','agosto 2026','luglio 2026'].map(m=>`<option>${m}</option>`).join('')}</select></div></div>
    <label class="ck"><input type="checkbox" id="rC"> Racconto una mia esperienza reale e non ho ricevuto compensi o sconti per questa recensione.</label>
    <p id="rErr" class="ferr" role="alert"></p>
    <button class="btn wide" id="rSend">Pubblica</button>
    <p class="muted" style="font-size:12px;margin-top:8px">Le recensioni vengono controllate prima della pubblicazione.</p>`,
  card=>{const btns=[...card.querySelectorAll('[data-st]')];btns.forEach(b=>b.onclick=()=>{st=+b.dataset.st;btns.forEach(x=>x.classList.toggle('on',+x.dataset.st<=st));});
    card.querySelector('#rSend').onclick=()=>{const t=card.querySelector('#rT').value.trim(),x=card.querySelector('#rX').value.trim(),e=card.querySelector('#rErr');
      if(!st){e.textContent='Scegli da 1 a 5 stelle.';return;}if(t.length<3){e.textContent='Scrivi un titolo.';return;}if(x.length<50){e.textContent=`Ancora ${50-x.length} caratteri, raccontaci qualcosa in più.`;return;}
      if(!card.querySelector('#rC').checked){e.textContent='Conferma che è un’esperienza reale e non pagata.';return;}
      rvList(key,n,base).push({nick:(S.user&&S.user.nick)||'tu',st,title:t,txt:x,type:card.querySelector('#rY').value,when:card.querySelector('#rM').value,useful:0,ver:false});
      toast('Grazie! La recensione è pubblicata (in produzione passa prima dalla moderazione)');sfx('coin');reviewsSheet(key,name,n,base);if(S.tab==='mappa')renderVivere();};});
}
function bindReviews(){
  app.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>reviewsSheet(b.dataset.rv,b.dataset.rvn,+b.dataset.rvc,+b.dataset.rvb));
  app.querySelectorAll('[data-rvw]').forEach(b=>b.onclick=()=>writeReview(b.dataset.rvw,b.dataset.rvn,+b.dataset.rvc,+b.dataset.rvb));
  app.querySelectorAll('[data-vf]').forEach(b=>b.onclick=()=>{S.vf=b.dataset.vf;renderVivere();});
  const vm=document.querySelector('#vacmap .mapsvg');if(vm){const z=S.reZone||S.zone;if(z)wireCommunity(vm,z,$('#vacinfo'));}
  app.querySelectorAll('[data-rvm]').forEach(b=>b.onclick=()=>{S.rvMode=b.dataset.rvm;renderVivere();});
}
function rvSeg(){return'';return`<div class="seg" style="margin-bottom:12px"><button class="${S.rvMode!=='vacanza'?'on':''}" data-rvm="vivere">🏘️ Ci vivo o compro</button><button class="${S.rvMode==='vacanza'?'on':''}" data-rvm="vacanza">🧳 Ci vado in vacanza</button></div>`;}

<script>
/* =========================================================
   MONDO REALE A FUMETTO
   - geocodifica dell'indirizzo (Nominatim) e dati della zona
     (Overpass / OpenStreetMap): strade con i nomi veri, edifici,
     verde, acqua, attività e servizi
   - disegno in stile fumetto; la casa dell'utente è evidenziata
     solo per lui; gli altri edifici sono sagome senza dati
   - se la rete non è disponibile (es. anteprima) si usa la mappa
     illustrata e lo si dice chiaramente
   ========================================================= */
const RM={cache:{}};
const RM_R=380;
function rmTimeout(ms){const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}
async function rmFetch(addr){
  if(RM.cache[addr])return RM.cache[addr];
  const w=await trWhere(addr);const lat=w.lat,lon=w.lon;const key='zsh_rm2_'+lat.toFixed(5)+'_'+lon.toFixed(5);
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.t<7*864e5){RM.cache[addr]=c.m;S.realNames=rmTopNames(c.m);return c.m;}}catch(e){}
  const A=`(around:${RM_R},${lat},${lon})`;
  const q=`[out:json][timeout:25];(way["highway"]${A};way["building"]${A};way["leisure"~"park|garden|pitch|playground"]${A};way["landuse"~"grass|meadow|farmland|forest|orchard|vineyard|recreation_ground"]${A};way["natural"~"water|wood"]${A};way["waterway"]${A};node["amenity"]${A};node["shop"]${A};node["craft"]${A};node["tourism"]${A};node["emergency"="assembly_point"]${A};way["amenity"]${A};way["shop"]${A};way["craft"]${A};);out geom;`;
  let d=null;try{d={elements:await trOverpass(q,15000)};}catch(e){}
  if(!d)throw new Error('mappa vera non raggiungibile');
  /* negozi e servizi disegnati come edifici: anche un segnaposto al centro */
  const extra=[];d.elements.forEach(e=>{if(e.type==='way'&&e.tags&&(e.tags.amenity||e.tags.shop||e.tags.craft)&&e.geometry&&e.geometry.length){const c=e.geometry.reduce((a,p)=>[a[0]+p.lat,a[1]+p.lon],[0,0]).map(v=>v/e.geometry.length);extra.push({type:'node',id:1e12+e.id,lat:c[0],lon:c[1],tags:e.tags});}});
  const parts=String(addr).split(',');
  const res={lat,lon,place:parts[0].trim()||addr,town:(parts[1]||'').trim(),els:d.elements.concat(extra)};
  RM.cache[addr]=res;S.realNames=rmTopNames(res);try{localStorage.setItem(key,JSON.stringify({t:Date.now(),m:res}));}catch(e){}return res;}
function rmTopNames(m){const len={};m.els.forEach(e=>{if(e.type==='way'&&e.tags&&e.tags.highway&&e.tags.name&&e.geometry){let L=0;for(let i=1;i<e.geometry.length;i++)L+=Math.hypot(e.geometry[i].lat-e.geometry[i-1].lat,e.geometry[i].lon-e.geometry[i-1].lon);len[e.tags.name]=(len[e.tags.name]||0)+L;}});
  return Object.entries(len).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
const RM_CAT=t=>{const a=t.amenity,s=t.shop,tu=t.tourism;
  if(['pharmacy'].includes(a))return['✚','Farmacia','pub'];if(['hospital','clinic','doctors'].includes(a))return['H','Sanità','pub'];if(a==='police')return['🚓','Forze dell’ordine','pub'];if(a==='fire_station')return['🚒','Vigili del fuoco','pub'];
  if(['townhall','post_office','school','kindergarten','library'].includes(a))return['🏛️',{townhall:'Municipio',post_office:'Ufficio postale',school:'Scuola',kindergarten:'Scuola',library:'Biblioteca'}[a],'pub'];
  if(['bar','cafe','pub'].includes(a))return['☕','Bar','biz'];if(['restaurant','fast_food','pizzeria'].includes(a))return['🍝','Ristorante','biz'];if(a==='bank')return['🏦','Banca','biz'];if(a==='fuel')return['⛽','Distributore','biz'];
  if(t.craft){const C={locksmith:['🔑','Fabbro'],electrician:['💡','Elettricista'],metal_construction:['🔩','Carpenteria metallica'],window_construction:['🪟','Serramenti'],builder:['🧱','Impresa edile'],carpenter:['🪚','Falegname'],plumber:['🔧','Idraulico']}[t.craft];if(C)return[C[0],C[1],'biz'];}
  if(t.emergency==='assembly_point')return['⛺','Punto di raccolta','pub'];
  if(s){const M={locksmith:['🔑','Fabbro'],security:['🛡️','Sicurezza e allarmi'],electrical:['💡','Materiale elettrico'],trade:['🧱','Materiali edili'],paint:['🎨','Colori'],glaziery:['🪟','Vetreria'],supermarket:['🛒','Supermercato'],convenience:['🛒','Alimentari'],bakery:['🥖','Panificio'],hardware:['🔧','Ferramenta'],doityourself:['🔧','Fai da te'],hairdresser:['💈','Parrucchiere'],clothes:['👕','Abbigliamento'],butcher:['🥩','Macelleria'],florist:['💐','Fiori'],car_repair:['🔩','Officina'],electronics:['📺','Elettronica']};const m=M[s]||['🛍️','Negozio'];return[m[0],m[1],'biz'];}
  if(tu){return['🛏️',{hotel:'Hotel',guest_house:'B&B',apartment:'Appartamenti',attraction:'Da vedere',museum:'Museo'}[tu]||'Turismo','biz'];}
  return null;};
function rmSVG(m,L={biz:true,spons:true,pub:true,comm:false},W=800,H=800){
  const k=Math.cos(m.lat*Math.PI/180),sc=(W/2)/RM_R;
  const P=(la,lo)=>[(W/2+(lo-m.lon)*k*111320*sc).toFixed(1),(H/2-(la-m.lat)*110540*sc).toFixed(1)];
  const path=(g,close)=>g.map((p,i)=>(i?'L':'M')+P(p.lat,p.lon).join(' ')).join('')+(close?'Z':'');
  const ways=m.els.filter(e=>e.type==='way'&&e.geometry&&e.geometry.length>1);
  let green='',water='',bld='',roads0='',roads1='',labels='',pins='',me='';
  ways.forEach(e=>{const t=e.tags||{};
    if(t.leisure||/grass|meadow|recreation|park/.test(t.landuse||''))green+=`<path d="${path(e.geometry,1)}" fill="#a9c98a" stroke="#140f1f" stroke-width="1.5"/>`;
    else if(/farmland|orchard|vineyard/.test(t.landuse||''))green+=`<path d="${path(e.geometry,1)}" fill="#e7d48d" stroke="#140f1f" stroke-width="1" opacity=".8"/>`;
    else if(/forest/.test(t.landuse||'')||t.natural==='wood')green+=`<path d="${path(e.geometry,1)}" fill="#6f9f6a" stroke="#140f1f" stroke-width="1.2"/>`;
    else if(t.natural==='water')water+=`<path d="${path(e.geometry,1)}" fill="#6fa8dc" stroke="#140f1f" stroke-width="2"/>`;
    else if(t.waterway)water+=`<path d="${path(e.geometry)}" fill="none" stroke="#140f1f" stroke-width="${t.waterway==='river'?18:7}" stroke-linecap="round"/><path d="${path(e.geometry)}" fill="none" stroke="#6fa8dc" stroke-width="${t.waterway==='river'?13:4}" stroke-linecap="round"/>`;});
  const pal=['#e8dcbf','#d9c7a8','#cfc6e6','#f3e9d2','#e6d3b3','#c9d6c0'];
  const blds=ways.filter(e=>e.tags&&e.tags.building).slice(0,2200);
  let mine=null;const [px,py]=[W/2,H/2];
  const inside=(g)=>{let c=false;const pts=g.map(p=>P(p.lat,p.lon).map(Number));for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))c=!c;}return c;};
  blds.forEach(e=>{if(!mine&&inside(e.geometry))mine=e;});
  if(!mine){let best=1e9;blds.forEach(e=>{const c=e.geometry.reduce((a,p)=>[a[0]+p.lat,a[1]+p.lon],[0,0]).map(v=>v/e.geometry.length);const[x,y]=P(c[0],c[1]).map(Number);const d=Math.hypot(x-px,y-py);if(d<best&&d<30){best=d;mine=e;}});}
  blds.forEach(e=>{if(e===mine)return;bld+=`<path d="${path(e.geometry,1)}" fill="${pal[e.id%pal.length]}" stroke="#140f1f" stroke-width="1.3"/>`;});
  const RW={motorway:20,trunk:18,primary:16,secondary:14,tertiary:12,unclassified:10,residential:10,living_street:9,service:6,pedestrian:8,track:5,footway:3,path:3,cycleway:3,steps:3};
  const rds=ways.filter(e=>e.tags&&e.tags.highway&&RW[e.tags.highway]);
  rds.sort((a,b)=>RW[a.tags.highway]-RW[b.tags.highway]).forEach(e=>{const w=RW[e.tags.highway];const d=path(e.geometry);
    if(w<=3){roads1+=`<path d="${d}" fill="none" stroke="#7c6f8f" stroke-width="2" stroke-dasharray="4 4"/>`;return;}
    roads0+=`<path d="${d}" fill="none" stroke="#140f1f" stroke-width="${w+4}" stroke-linecap="round" stroke-linejoin="round"/>`;
    roads1+=`<path d="${d}" fill="none" stroke="${w>=14?'#f7d64a':'#f3e9d2'}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;});
  /* nomi delle vie lungo la strada, una volta per nome */
  const byName={};rds.forEach(e=>{const n=e.tags.name;if(!n||RW[e.tags.highway]<=3)return;const g=e.geometry;let len=0;for(let i=1;i<g.length;i++){const a=P(g[i-1].lat,g[i-1].lon),b=P(g[i].lat,g[i].lon);len+=Math.hypot(a[0]-b[0],a[1]-b[1]);}if(!byName[n]||byName[n].len<len)byName[n]={e,len};});
  Object.entries(byName).forEach(([n,{e,len}],i)=>{if(len<n.length*7)return;let g=e.geometry;const a=P(g[0].lat,g[0].lon),b=P(g[g.length-1].lat,g[g.length-1].lon);if(+b[0]<+a[0])g=g.slice().reverse();
    const id='rp'+e.id;labels+=`<path id="${id}" d="${path(g)}" fill="none"/><text font-family="Bangers,Impact,sans-serif" font-size="13" letter-spacing=".5" fill="#140f1f" stroke="#fff" stroke-width="3.5" paint-order="stroke" dy="4"><textPath href="#${id}" startOffset="50%" text-anchor="middle">${esc(n.toUpperCase())}</textPath></text>`;});
  if(mine)me=`<path d="${path(mine.geometry,1)}" fill="#d7263d" stroke="#140f1f" stroke-width="3"/>`;
  me+=`<g transform="translate(${px} ${py})"><circle r="34" fill="#d7263d" opacity=".18"/><path d="M-14 6 V-8 L0 -20 L14 -8 V6Z" fill="#d7263d" stroke="#140f1f" stroke-width="3"/><rect x="-26" y="10" width="52" height="16" fill="#f7d64a" stroke="#140f1f" stroke-width="2"/><text y="22" text-anchor="middle" font-family="Bangers,Impact" font-size="12" fill="#140f1f">TU</text></g>`;
  /* attività e servizi */
  const nodes=m.els.filter(e=>e.type==='node'&&e.tags);m._pois=[];
  const biz=nodes.map(e=>({e,c:RM_CAT(e.tags)})).filter(x=>x.c);
  const bizOnly=biz.filter(x=>x.c[2]==='biz').map(x=>{const[X,Y]=P(x.e.lat,x.e.lon).map(Number);return{...x,X,Y,d:Math.hypot(X-px,Y-py)};}).sort((a,b)=>a.d-b.d);
  const GEO=window.SP_GEO||{};const useGeo=Object.keys(GEO).length>0;const spK=Object.keys(SPONSORS);const spSet=new Map();if(!useGeo)bizOnly.slice(0,spK.length).forEach((x,i)=>spSet.set(x.e.id,spK[i]));
  biz.forEach(x=>{const[X,Y]=P(x.e.lat,x.e.lon).map(Number);if(X<0||Y<0||X>W||Y>H)return;const t=x.e.tags,c=x.c;const i=m._pois.length;const sk=spSet.get(x.e.id);
    m._pois.push({name:t.name||c[1],cat:c[1],kind:c[2],sk,ic:c[0],phone:t.phone||t['contact:phone']||'',web:t.website||t['contact:website']||'',lat:x.e.lat,lon:x.e.lon});
    if(sk&&L.spons)pins+=`<g data-rmp="${i}" style="cursor:pointer"><path d="M${X} ${Y} l-9 -14 h18z" fill="#140f1f"/><rect x="${X-20}" y="${Y-42}" width="40" height="30" rx="5" fill="#f7d64a" stroke="#140f1f" stroke-width="3"/><text x="${X}" y="${Y-22}" text-anchor="middle" font-family="Bangers,Impact" font-size="15" fill="#140f1f">${SPONSORS[sk].logo}</text><text x="${X+17}" y="${Y-38}" font-size="12">⭐</text></g>`;
    else if(c[2]==='pub'&&L.pub)pins+=`<g data-rmp="${i}" style="cursor:pointer"><circle cx="${X}" cy="${Y}" r="11" fill="#fff" stroke="#2f5fb8" stroke-width="3"/><text x="${X}" y="${Y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#2f5fb8">${c[0]}</text></g>`;

  let comm='';if(L.comm){const r=rng(Math.round(m.lat*1e4+m.lon*1e3));for(let row=0;row<7;row++)for(let col=0;col<8;col++){const x=50+col*104+(row%2)*52,y=60+row*104;const n=Math.round(r()*14);const ok=n>=5;comm+=`<path d="${hexPath(x,y,58)}" fill="${ok?(r()<.5?'#3f9b5f':'#f7d64a'):'#cfc6e6'}" fill-opacity="${ok?.22:.1}" stroke="#140f1f" stroke-width="1" stroke-dasharray="${ok?'':'4 4'}"/>${ok?`<text x="${x}" y="${y+5}" text-anchor="middle" font-family="Bangers,Impact" font-size="16" fill="#140f1f" stroke="#fff" stroke-width="3" paint-order="stroke">${n}</text>`:''}`;}}
  const sb=Math.round(100*sc);

    ${green}${water}${roads0}${bld}${roads1}${me}${labels}${comm}${pins}
    <g transform="translate(24 ${H-34})"><rect width="${sb}" height="8" fill="#140f1f"/><rect width="${sb/2}" height="8" fill="#fff" stroke="#140f1f" stroke-width="1.5"/><text y="-6" font-size="12" font-weight="700" fill="#140f1f">100 m</text></g>

    ${mFrame(W,H,(m.town?m.town.toUpperCase()+' · ':'')+'ZONA VERA')}</svg>`;}
function rmBox(id){return`<div class="panel mapwrap" style="padding:0;overflow:hidden" id="${id}"><div class="maptools">${[['spons','Sponsor'],['biz','Attività'],['pub','Servizi pubblici'],['comm','Community']].map(([k,l])=>`<button class="chip ${(S.rmL||{spons:1,biz:1,pub:1})[k]?'on':''}" data-rml="${k}">${l}</button>`).join('')}</div>

function bizSpots(z){const r=rng((z.seed||7)+91);return BIZ_DEMO.map((b,i)=>({i,ic:b[0],name:b[1],cat:b[2],x:40+r()*320,y:70+r()*300,d:Math.round(120+r()*1600)}));}
