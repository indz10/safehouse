<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241a4a">
<title>ZombieSafeHouse</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZombieSafeHouse">
<meta name="description" content="Valuta quanto è sicura la tua casa vera e difendila in un gioco a fumetto. Sponsor e community della tua zona.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN =====
   Notte  #241A4A  · Inchiostro #140F1F · Carta #F3E9D2
   Luna   #F7D64A  · Sangue    #D7263D · Zombie #6FB59A */
:root{
  --night:#241a4a; --night2:#33276a; --ink:#140f1f; --paper:#f3e9d2; --paper2:#e8dcbf;
  --moon:#f7d64a; --blood:#d7263d; --zom:#6fb59a; --steel:#7c8794; --ok:#3f9b5f;
  --display:'Bangers','Impact','Haettenschweiler','Avenir Next Condensed','Arial Narrow Bold',sans-serif;
  --body:'Comic Neue','Trebuchet MS',system-ui,sans-serif;
  --line:3px solid var(--ink);
  --nav-h:68px;
  --tb-h:50px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);font-weight:700;color:var(--ink);background:var(--night);
  background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:9px 9px;}
button,input,select{font-family:inherit;font-weight:700;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper);margin-top:calc(var(--tb-h) + env(safe-area-inset-top));
  padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));overflow-x:hidden}
.dots{background-image:radial-gradient(rgba(20,15,31,.13) 1.1px,transparent 1.2px);background-size:7px 7px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95}
h2{font-size:34px}
h3{font-size:24px}
p{line-height:1.45}
.muted{color:#5b5368;font-weight:400}

/* ---- pannelli fumetto ---- */
.page{padding:16px 14px 8px}
.panel{background:#fff;border:var(--line);box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px;position:relative}
.panel.paper{background:var(--paper)}
.panel.night{background:var(--night);color:#fff}
.panel.moon{background:var(--moon)}
.caption{display:inline-block;background:var(--moon);border:var(--line);padding:6px 10px;font-weight:700;font-size:14px;line-height:1.3;box-shadow:3px 3px 0 var(--ink)}
.bubble{position:relative;background:#fff;border:var(--line);border-radius:22px;padding:12px 14px;line-height:1.4}
.bubble:after{content:"";position:absolute;left:28px;bottom:-14px;width:18px;height:18px;background:#fff;border-right:var(--line);border-bottom:var(--line);transform:skewX(-35deg) rotate(45deg)}
.sfx{font-family:var(--display);color:var(--moon);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);letter-spacing:.03em}

/* ---- bottoni ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--line);background:var(--blood);color:#fff;
  font-family:var(--display);font-size:24px;letter-spacing:.04em;padding:12px 18px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-height:52px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--moon);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.small{font-size:18px;padding:8px 12px;min-height:42px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}

/* ---- HERO ---- */
.hero{position:relative;height:calc(100svh - var(--nav-h) - var(--tb-h) - env(safe-area-inset-bottom) - env(safe-area-inset-top));max-height:900px;min-height:600px;overflow:hidden;border-bottom:var(--line);background:var(--night)}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.hero .title{position:absolute;left:16px;right:16px;top:calc(18px + env(safe-area-inset-top));}
.hero .title h1{font-size:clamp(58px,17vw,92px);color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--blood);transform:rotate(-3deg);transform-origin:left}
.hero .title h1 span{display:block;color:var(--moon)}
.hero .cta{position:absolute;left:16px;right:16px;bottom:22px;display:grid;gap:10px}
.hero .cta .caption{justify-self:start;font-size:15px;max-width:290px}
.hero .boom{position:absolute;right:10px;top:51%;font-size:34px;transform:rotate(9deg)}
@media (prefers-reduced-motion:no-preference){
  .hero .title h1{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
  .hero .boom{animation:slam .5s .5s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes slam{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{opacity:1}}
}

/* ---- strisce home ---- */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.strip .panel{margin:0;padding:0;overflow:hidden;cursor:pointer;text-align:left}
.strip .panel svg{display:block;width:100%;height:118px;border-bottom:var(--line)}
.strip .panel .t{padding:9px 10px 11px}
.strip .panel .t b{font-family:var(--display);font-weight:400;font-size:22px;display:block}
.strip .panel .t small{font-weight:400;font-size:13px;line-height:1.3;display:block;margin-top:2px}
.strip .wide{grid-column:1/-1}
.strip .wide svg{height:150px}
.num{position:absolute;top:8px;left:8px;width:30px;height:30px;border:var(--line);background:var(--moon);display:grid;place-items:center;font-family:var(--display);font-size:20px}

/* ---- nav ---- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:50;border-top:3px solid var(--moon)}
.nav button{background:none;border:0;color:#cfc6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--moon)}
.nav button.on svg{transform:scale(1.12)}

/* ---- wizard ---- */
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:10px;border:2px solid var(--ink);background:#fff}
.steps i.on{background:var(--blood)}
.steps i.done{background:var(--ink)}
.field{width:100%;border:var(--line);padding:12px;background:#fff;font-size:17px;min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:2px solid var(--ink);background:#fff;padding:9px 12px;font-size:15px;line-height:1.2;text-align:left;min-height:42px}
.chip.on{background:var(--ink);color:var(--moon)}
.chip.ai{position:relative}
.chip.ai.on:after{content:"IA";position:absolute;top:-9px;right:-6px;background:var(--zom);color:var(--ink);border:2px solid var(--ink);font-size:10px;padding:1px 4px}
.q{padding:14px 0;border-bottom:2px dashed rgba(20,15,31,.25)}
.q:last-child{border-bottom:0}
.q label{font-size:17px;display:block}
.q .hint{font-weight:400;font-size:13px;color:#5b5368;margin-top:2px}

/* ---- foto ---- */
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shot{border:var(--line);background:#fff;aspect-ratio:3/4;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;padding:6px;cursor:pointer}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .lbl{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font-size:12px;padding:4px}
.shot input{display:none}
.finding{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:2px dashed rgba(20,15,31,.2)}
.finding:last-child{border:0}
.tag{display:inline-block;border:2px solid var(--ink);font-size:11px;padding:1px 6px;background:var(--zom)}
.tag.sp{background:var(--moon)}
.tag.cm{background:#c9b8ff}
.tag.ia{background:var(--zom)}

/* ---- risultato ---- */
.score{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.bars .b{margin:7px 0}
.bars .b > div:last-child{height:14px;border:2px solid var(--ink);background:#fff;margin-top:3px}
.bars .fill{display:block;height:100%;background:var(--blood);transition:width .7s}
.bars .fill.good{background:var(--ok)}
.bars .fill.mid{background:var(--moon)}

/* ---- gioco ---- */
.game-scene{border:var(--line);box-shadow:5px 5px 0 var(--ink);background:var(--night);position:relative;overflow:hidden}
.game-scene svg{display:block;width:100%;height:auto}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.hud div{border:var(--line);background:#fff;padding:8px;text-align:center}
.hud b{font-family:var(--display);font-weight:400;font-size:28px;display:block;line-height:1}
.hud small{font-size:12px;font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:var(--line);background:#fff;padding:9px 4px;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--moon)}
.upg{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:var(--line);background:#fff;padding:10px;margin-bottom:10px}
.upg.on{background:#e3f3e8}
.upg b{font-size:16px}
.upg small{display:block;font-weight:400;font-size:13px;line-height:1.3;margin-top:2px}
.pop{position:absolute;font-size:40px;pointer-events:none;transform:rotate(-8deg)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop 1.1s ease-out forwards}@keyframes pop{0%{transform:scale(.2) rotate(-8deg);opacity:0}20%{transform:scale(1.15) rotate(-8deg);opacity:1}80%{opacity:1}100%{transform:translateY(-30px) scale(1) rotate(-8deg);opacity:0}}}
.zw{transition:transform 3.2s linear}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:50vh}
.msg{max-width:86%;border:var(--line);padding:10px 12px;line-height:1.4;font-size:15px;white-space:pre-wrap}
.msg.bot{background:#fff;align-self:flex-start;border-radius:4px 18px 18px 18px}
.msg.me{background:var(--moon);align-self:flex-end;border-radius:18px 4px 18px 18px}
.msg.typing{opacity:.7}
.composer{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--paper);padding:10px 0;display:flex;gap:8px}
.composer input{flex:1}

/* ---- varie ---- */
.notice{border:2px dashed var(--ink);padding:10px;font-size:13px;font-weight:400;background:rgba(255,255,255,.6)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{z-index:130!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 24px);background:var(--ink);color:var(--moon);border:3px solid var(--moon);padding:10px 14px;z-index:80;font-size:15px;max-width:90%}
.sponsor{display:flex;gap:10px;align-items:center}
.sponsor .logo{width:46px;height:46px;border:var(--line);display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--moon);flex:none}
.hidden{display:none!important}

/* ---- v2.1 ---- */
.stepbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 12px}
.sb{border:var(--line);background:#fff;padding:6px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sb span{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:17px;background:#fff}
.sb.on{background:var(--moon)} .sb.on span{background:var(--blood);color:#fff}
.sb.done{background:var(--ink);color:var(--moon)} .sb.done span{background:var(--moon);color:var(--ink)}
.sb[disabled]{opacity:.55}
.tavola svg{display:block;width:100%;height:auto}
.bubble.op{margin-left:8px}
.chip{border:var(--line);box-shadow:2px 2px 0 var(--ink);transition:transform .08s}
.chip.on{transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--blood)}
.chip.opt.on:before{content:"✓ ";color:var(--moon)}
.maptools{display:flex;gap:6px;padding:8px;background:var(--ink);flex-wrap:wrap}
.maptools .chip{font-size:13px;padding:6px 10px;min-height:34px;box-shadow:none;border:2px solid var(--moon)}
.maptools .chip.on{background:var(--moon);color:var(--ink)}
.maptools .chip:not(.on){background:transparent;color:#e5def5;border-color:#6b5fa0}
.mapsvg svg{display:block;width:100%;height:auto}
.mapinfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-top:var(--line);background:var(--paper);min-height:52px;font-size:14px}
.mapinfo b{font-size:16px}
.stat{flex:1;border:2px solid var(--ink);background:var(--paper);padding:6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.stat small{font-size:11px;font-weight:400}
details summary{list-style:none;margin:8px 0 4px}
.maphero{position:relative;border-bottom:var(--line)}
.maphero svg{display:block;width:100%;height:210px}
.mh-t{position:absolute;left:14px;right:14px;bottom:16px}
.mh-t h2{color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--blood);font-size:44px;margin-bottom:6px}
.game-scene{position:relative}
.cap{position:absolute;left:8px;top:8px;max-width:72%;background:var(--moon);border:var(--line);padding:6px 9px;font-size:14px;line-height:1.25;opacity:0}
.cap.in{opacity:1;animation:capin .35s ease-out}
@keyframes capin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.blink{animation:blink .35s steps(2) infinite}
@keyframes blink{50%{fill:#f7d64a}}
.flash{animation:flash .6s 3}
@keyframes flash{50%{opacity:.15}}
.zw,.actor{transform-box:view-box}
.smoke circle{animation:rise 3s ease-in-out infinite alternate}
@keyframes rise{to{transform:translate(6px,-6px)}}


/* ---- VIVERE QUI ---- */
.ring-s{width:96px;height:96px;border-radius:50%;border:var(--line);display:grid;place-items:center;align-content:center;background:conic-gradient(var(--c) calc(var(--v)*1%),#fff 0);position:relative;flex:none}
.ring-s:before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.ring-s b,.ring-s small{position:relative;z-index:1;text-align:center;line-height:1}.ring-s b{font-family:var(--display);font-weight:400;font-size:34px}.ring-s small{font-size:10px;font-weight:400}
.listing{display:flex;gap:12px;border:var(--line);background:#fff;padding:10px;margin-bottom:10px;box-shadow:4px 4px 0 var(--ink)}
.listing.feat{background:#fff8d6;box-shadow:4px 4px 0 var(--blood)}
.listing img{width:84px;height:120px;object-fit:cover;object-position:top;border:2px solid var(--ink);background:#33276a;flex:none}
.aglogo{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:14px}
.ptn{background:var(--moon);padding:0 3px}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.cmp th,.cmp td{border:2px solid var(--ink);padding:6px;text-align:left}.cmp th{background:var(--ink);color:var(--moon)}
.b2b{display:grid;gap:8px}.b2b div{background:#fff;color:var(--ink);border:var(--line);padding:8px}.b2b b{display:block}.b2b small{display:block;font-weight:400;font-size:12px}.b2b span{display:block;font-family:var(--display);font-size:20px;color:var(--blood)}
.zseg button{font-size:15px;padding:9px}
/* ---- CONTATTI ---- */
.pillars{display:grid;gap:10px}.pillars .panel{margin:0}.pillars .pi{font-size:26px}.pillars b{display:block;font-family:var(--display);font-weight:400;font-size:22px;margin-top:4px}.pillars p{font-weight:400;font-size:14px;margin-top:4px}
.values{display:grid;gap:10px}.values b{display:block}.values p{font-weight:400;font-size:14px;margin-top:2px}
.fl{display:block;font-size:14px;margin:10px 0 4px}.fl small{font-weight:400}
textarea.field{resize:vertical;font-weight:400}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:400;margin-top:10px}.ck input{width:20px;height:20px;flex:none;margin-top:1px}
.ferr{color:var(--blood);font-size:14px;min-height:20px;margin:8px 0}
.company div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:2px dashed rgba(20,15,31,.15)}.company div:last-child{border:0}.company span{font-weight:400;font-size:13px}.company b{text-align:right;font-size:14px}
.todo{background:#fff3cd;border:1.5px dashed var(--blood);color:var(--blood);font-size:11px;padding:1px 5px;font-weight:700}
.foot{background:var(--ink);color:#e5def5;border:var(--line);padding:16px;margin:14px 0}.foot p{font-weight:400;font-size:14px;margin-top:4px}.foot small{display:block;margin-top:12px;font-weight:400;font-size:11px;color:#9a91b8}
.musicfab{position:fixed;top:calc(env(safe-area-inset-top) + 12px);bottom:auto;left:max(62px,calc(50vw - 196px));right:auto;z-index:95;width:34px;height:34px;border:var(--line);background:var(--moon);box-shadow:3px 3px 0 var(--ink);font-size:20px;display:grid;place-items:center}
.musicfab.off{background:#cfc6e6}
@media (orientation:landscape) and (max-height:600px){body.inbattle .musicfab{bottom:8px;right:calc(env(safe-area-inset-right) + 8px)}}
.composer{padding-right:52px}
/* ---- errori ---- */
.errbox{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:200;width:min(480px,94vw);background:#fff3f3;border:3px solid var(--blood);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;font-size:13px}
.errbox b{display:block;color:var(--blood);font-size:15px}.errbox small{display:block;font-weight:400;margin:2px 0 6px}
.errbox code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-word;background:#fff;border:1.5px solid var(--ink);padding:6px;max-height:120px;overflow:auto}
.errbox div{display:flex;gap:8px;margin-top:8px}.errbox button{border:2px solid var(--ink);background:#fff;padding:6px 10px;font-size:13px}
/* ---- ASSEDIO DEL QUARTIERE ---- */
.radar{border:var(--line);background:#140f1f;margin-top:10px;padding:6px}
.radar-h{display:flex;justify-content:space-between;align-items:baseline;color:var(--moon);padding:0 2px 4px}.radar-h b{font-family:var(--display);font-weight:400;font-size:18px}.radar-h small{color:#cfc6e6;font-size:11px}
.radar canvas{display:block;width:100%;height:auto;border:2px solid #3b3550;touch-action:manipulation;cursor:pointer}
.sites{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.sites::-webkit-scrollbar{display:none}
.site{flex:none;min-width:104px;border:2px solid #cfc6e6;background:#241a4a;color:#fff;padding:5px 6px;text-align:left;display:grid;grid-template-columns:20px 1fr;gap:1px 4px;font-size:11px}
.site .si{grid-row:1/4;font-size:16px}.site .sn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .sb{height:6px;background:#3b3550;border:1px solid #140f1f}.site .sb i{display:block;height:100%;background:#3f9b5f}
.site .sz{font-size:10px;color:#cfc6e6}
.site.on{border-color:var(--moon);background:#33276a;box-shadow:0 0 0 2px var(--moon)}
.site.alert{border-color:var(--blood);animation:alertb .6s steps(2) infinite}@keyframes alertb{50%{background:#5a1f2a}}
.site.lost{opacity:.5;border-style:dashed}
.lostline{background:#fff3f3;border:2px solid var(--blood);padding:8px;font-size:13px;margin:6px 0 10px;color:var(--ink)}
.defbox{border:2px solid var(--ink);background:#fff;padding:10px;margin-top:12px;display:grid;gap:8px}.defbox .row span small{display:block;font-weight:400;font-size:11px}
.dbadge{font-size:11px;background:var(--paper);border:1.5px solid var(--ink);padding:0 4px;margin-left:4px;font-weight:700}
/* ---- PREMIO DEL GIORNO ---- */
.daily{background:#fff8d6}
.dtrack{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}

<script>
/* Mostra gli errori in chiaro dentro l'app.
   Sul telefono il browser nasconde i dettagli ("Script error"): per questo
   avvolgiamo tutti i gestori (tocchi, timer, animazioni) e catturiamo l'errore vero. */
(function(){let shown=0;window.__last='avvio';
  function show(err,where){if(shown>2)return;shown++;
    const msg=err&&err.message?err.name+': '+err.message:String(err);
    const st=err&&err.stack?String(err.stack).split('\n').slice(0,4).map(s=>s.trim().replace(/\(?(blob|data|https?|about):[^)\s]*/g,'').trim()).join(' | '):'';
    const d=document.createElement('div');d.className='errbox';d.setAttribute('role','alert');
    d.innerHTML='<b>Si è verificato un errore</b><small></small><code></code><div><button type="button" data-c>Copia dettagli</button><button type="button" data-x>Chiudi</button></div>';
    d.querySelector('small').textContent='Fai uno screenshot di questo riquadro e mandalo in chat.';
    const full=msg+'\nDove: '+(where||'')+'\nUltima azione: '+window.__last+(st?'\n'+st:'')+'\n'+(navigator.userAgent.match(/(iPhone|iPad|Android)[^;)]*|Version\/[\d.]+|OS [\d_]+/g)||[]).join(' ');
    d.querySelector('code').textContent=full;
    d.querySelector('[data-x]').onclick=()=>d.remove();
    d.querySelector('[data-c]').onclick=()=>{try{navigator.clipboard.writeText(full);}catch(e){}};
    (document.body||document.documentElement).appendChild(d);}
  window.__report=show;
  const wrap=(fn,where)=>typeof fn!=='function'?fn:function(){try{return fn.apply(this,arguments);}catch(e){show(e,where);}};
  const ael=EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener=function(t,fn,o){if(typeof fn==='function'){if(!fn.__w)fn.__w=wrap(fn,'evento '+t);return ael.call(this,t,fn.__w,o);}return ael.call(this,t,fn,o);};
  const rel=EventTarget.prototype.removeEventListener;
  EventTarget.prototype.removeEventListener=function(t,fn,o){return rel.call(this,t,fn&&fn.__w||fn,o);};
  ['onclick','onpointerdown','onpointerup','onpointermove','onkeydown','onchange','oninput','onload','onerror'].forEach(p=>{
    const proto=p==='onload'||p==='onerror'?null:HTMLElement.prototype;if(!proto)return;
    const desc=Object.getOwnPropertyDescriptor(HTMLElement.prototype,p);if(!desc||!desc.set)return;
    Object.defineProperty(HTMLElement.prototype,p,{configurable:true,enumerable:true,get(){return desc.get.call(this);},
      set(fn){desc.set.call(this,typeof fn==='function'?wrap(function(ev){window.__last=p.slice(2)+' su '+(this.id?'#'+this.id:'')+(this.dataset?Object.keys(this.dataset).map(k=>'['+k+'='+this.dataset[k]+']').join(''):'')+(this.textContent?' «'+this.textContent.trim().slice(0,24)+'»':'');return fn.call(this,ev);},p):fn);}});});
  const st=window.setTimeout,si=window.setInterval,raf=window.requestAnimationFrame;
  window.setTimeout=function(fn,ms,...a){return st.call(window,wrap(fn,'timer'),ms,...a);};
  window.setInterval=function(fn,ms,...a){return si.call(window,wrap(fn,'intervallo'),ms,...a);};
  window.requestAnimationFrame=function(fn){return raf.call(window,wrap(fn,'animazione'));};
  window.addEventListener('error',e=>{if(e.error)show(e.error,'pagina');else if(e.message&&e.message!=='Script error.')show(new Error(e.message),(e.filename||'pagina')+':'+e.lineno);});
  window.addEventListener('unhandledrejection',e=>{const r=e.reason;if(r&&/play\(\)|NotAllowedError|AbortError|fullscreen|orientation/i.test(String(r.message||r)))return;show(r instanceof Error?r:new Error('Promessa rifiutata: '+String(r)),'promessa');});
})();

function computeScore(ans,zone){
  const subs={};
  CHAPTERS.forEach(c=>{

    qs.forEach(q=>{const r=risk(q.id,ans[q.id]);if(r!=null){sum+=r;n++;}});
    subs[c.id]=n?sum/n:5;
  });
  Object.entries(EXTRA).forEach(([k,e])=>{if(ans[k]==='1')subs[e.ch]=Math.max(0,subs[e.ch]+e.b);});
  if(zone){subs.ris=subs.ris*.85+zone.resRisk*.15; subs.mob=subs.mob*.8+zone.mobRisk*.2;}
  let tot=0;CHAPTERS.forEach(c=>tot+=subs[c.id]*c.w);
  const idx=Math.max(1,Math.min(10,Math.round(tot*10)/10));
  return{idx,subs};
}

async function analyzeZone(address){
  if(CONFIG.GOOGLE_MAPS_API_KEY){
    /* PRODUZIONE: funzione server con Geocoding + Places -> {type,pois:[{kind,name,dist,lat,lng}]}
       e utenti dal database Supabase (solo profili pubblici, posizione arrotondata). */
  }
  await new Promise(r=>setTimeout(r,0));
  const r=rng(hash(address||'casa'));
  const lower=address.toLowerCase();
  let type=/monte|montagna|rifugio|baita|passo|alpe|malga|val |cortina|livigno/.test(lower)?'montagna':/lago|riva|mare|porto|spiaggia|lungolago|lido|darsena|garda/.test(lower)?'lago':/via roma|piazza|centro|corso/.test(lower)?'centro':/strada|cascina|località|loc\.|frazione/.test(lower)?'campagna':(r()<.33?'centro':r()<.5?'campagna':'periferia');
  const spread=type==='centro'?260:type==='periferia'?700:type==='lago'?900:type==='montagna'?3200:1900;
  const resources=[];
  POI_KINDS.forEach(([k,n])=>{const copies=type==='centro'&&['super','farm','ferr'].includes(k)?2:1;
    for(let i=0;i<copies;i++){const x=.08+r()*.84,y=.1+r()*.8;const dx=x-.5,dy=y-.5;resources.push({kind:k,name:n,x,y,dist:Math.round(Math.hypot(dx,dy)*2*spread*(.6+r()*.5))});}});
  const nU=type==='centro'?16:type==='periferia'?11:type==='lago'?9:type==='montagna'?4:6;
  const users=Array.from({length:nU},(_,i)=>{const idx=Math.round((1.6+r()*7)*10)/10;
    return{nick:NICKS[(i+Math.floor(r()*NICKS.length))%NICKS.length],idx,x:Math.round((.08+r()*.84)*20)/20,y:Math.round((.12+r()*.78)*20)/20,valutazioni:1+Math.floor(r()*6)};});
  const near=resources.filter(x=>x.dist<800).length;
  const resRisk=Math.max(1,9-near*.9);
  const mobRisk=type==='centro'?8:type==='periferia'?5:type==='lago'?6:type==='montagna'?4:3;
  const avgU=users.reduce((t,u)=>t+u.idx,0)/users.length;
  const level=Math.round((resRisk*.35+mobRisk*.35+avgU*.3)*10)/10;
  return{address,type,resources,users,resRisk,mobRisk,avgU,level,seed:hash(address)};
}

function appStep(t,s,sd){const bar=Math.floor(s/8)%16,st=s%8,ch=APP_CH[bar%4],cyc=Math.floor(bar/4);
  /* pad */
  if(st===0)ch.forEach((n,i)=>[-8,8].forEach(dt=>voice(t,NOTE(n),sd*8.2,{type:'sawtooth',v:.016,det:dt,lp:900,lp2:1800,a:.25,r:1,rev:.5,pan:(i-1)*.4})));

/* --- musica di gioco: "L'orda" (re minore, velocità con il livello) --- */
const G_CH=[[50,53,57],[46,50,53],[43,46,50],[45,49,52]];
const G_LEAD=[[74,0,0,72,74,0,77,0,76,0,74,0,72,0,69,0],[70,0,0,69,70,0,74,0,72,0,70,0,69,0,0,0],[67,0,70,0,74,0,72,70,69,0,67,0,65,0,67,0],[69,0,0,0,73,0,76,0,79,0,0,0,76,0,73,0]];

  if(st%2===0){const pat=[0,0,12,0,0,12,0,7];const n=ch[0]-12+pat[st/2];voice(t,NOTE(n),sd*1.7,{type:'sawtooth',v:.05,lp:900,lp2:260,a:.004,r:sd*1.4});voice(t,NOTE(n-12),sd*1.7,{type:'triangle',v:.05,a:.004,r:sd*1.4});}
  /* arpeggio (sezione A) */
  if(!B){const n=ch[[0,1,2,1][st%4]]+12+(st>=8?12:0);voice(t,NOTE(n),sd*.9,{type:'square',v:.016,lp:2600,a:.003,r:sd*.8,dly:.25,pan:st%2?.35:-.35});}
  /* tema (sezione B) */
  if(B){const n=G_LEAD[bar%4][st];if(n){voice(t,NOTE(n),sd*1.9,{type:'square',v:.028,lp:3200,a:.006,r:sd*1.4,dly:.28,rev:.18,det:-6});voice(t,NOTE(n),sd*1.9,{type:'sawtooth',v:.016,lp:2400,a:.006,r:sd*1.4,det:6,pan:.25});}

  if(boss&&st%4===0)ch.forEach(n=>voice(t,NOTE(n-12),sd*3,{type:'sawtooth',v:.016,lp:1100,a:.02,r:sd*2,rev:.2}));}

function silentWav(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};

  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}

    if(z.type==='campagna'&&r()<.55){city+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${r()<.5?'#d8c27a':'#a9c98a'}" stroke="${INK}" stroke-width="2"/>${Array.from({length:6},(_,k)=>`<path d="M${x0+6} ${y0+10+k*((y1-y0-14)/6)} H${x1-6}" stroke="${INK}" stroke-width="1" opacity=".35"/>`).join('')}`;continue;}
    if(r()<.14){city+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="#a9d18e" stroke="${INK}" stroke-width="2"/>`+Array.from({length:6},()=>`<circle cx="${x0+12+r()*(x1-x0-24)}" cy="${y0+12+r()*(y1-y0-24)}" r="${6+r()*6}" fill="#4f8f5f" stroke="${INK}" stroke-width="2"/>`).join('');continue;}

      if(r()>dense)continue;

    }
  }
  const roads=roadsX.slice(1,3).map(x=>`<rect x="${x-10}" y="0" width="20" height="${H}" fill="#f3e9d2" stroke="${INK}" stroke-width="2.5"/><path d="M${x} 0V${H}" stroke="#c9bd9d" stroke-width="2" stroke-dasharray="8 8"/>`).join('')
             +roadsY.slice(1,3).map(y=>`<rect x="0" y="${y-10}" width="${W}" height="20" fill="#f3e9d2" stroke="${INK}" stroke-width="2.5"/><path d="M0 ${y}H${W}" stroke="#c9bd9d" stroke-width="2" stroke-dasharray="8 8"/>`).join('');
  const ry=60+r()*300;
  const river=`<path d="M-10 ${ry} C110 ${ry-80} 250 ${ry+90} 410 ${ry-20}" stroke="${INK}" stroke-width="26" fill="none"/><path d="M-10 ${ry} C110 ${ry-80} 250 ${ry+90} 410 ${ry-20}" stroke="#6fa8dc" stroke-width="20" fill="none"/>`;
  /* arredi: ponti, ferrovia, monumenti, nomi delle vie, auto, notte */
  const r2=rng((z.seed||7)+3);
  const bridgeAt=xx=>{let best=0,bd=1e9;for(let t=0;t<=1;t+=.01){const bx=bezPt(-10,110,250,410,t);if(Math.abs(bx-xx)<bd){bd=Math.abs(bx-xx);best=t;}}return bezPt(ry,ry-80,ry+90,ry-20,best);};
  const bridges=[128,272].map(xx=>{const by=bridgeAt(xx);return`<rect x="${xx-14}" y="${by-15}" width="28" height="30" fill="#c9bd9d" stroke="${INK}" stroke-width="2.5"/><path d="M${xx-14} ${by-15} V${by+15} M${xx+14} ${by-15} V${by+15}" stroke="${INK}" stroke-width="4"/>`;}).join('');
  const rail=`<path d="M0 ${H-30} H${W}" stroke="${INK}" stroke-width="7"/><path d="M0 ${H-30} H${W}" stroke="#f3e9d2" stroke-width="3" stroke-dasharray="10 10"/>`+mLandmark('stazione',330,H-48);
  const centers=[[64,69],[200,69],[336,69],[64,211],[336,211],[64,352],[200,352]];
  const lmKinds=z.type==='montagna'?['cappella','cascina','stazione']:z.type==='lago'?['chiesa','mercato','municipio']:z.type==='campagna'?['cascina','cappella','cascina']:z.type==='periferia'?['chiesa','stadio','mercato']:['chiesa','municipio','mercato'];
  const used=[];const lms=lmKinds.map(k=>{let c;do{c=centers[Math.floor(r2()*centers.length)];}while(used.includes(c)&&used.length<centers.length);used.push(c);return mLandmark(k,c[0],c[1]);}).join('');
  const NAMES=['VIA ROMA','VIA GARIBALDI','VIALE DEI TIGLI','VIA MAZZINI','CORSO ITALIA','VIA VERDI','VIA DEI MULINI','STRADA ARGINE','VIA DANTE','VIA PO'];
  const nm=()=>NAMES[Math.floor(r2()*NAMES.length)];
  const streets=mBanner(64,138,nm())+mBanner(336,284,nm())+mBanner(128,70,nm(),-90)+mBanner(272,350,nm(),-90);
  const cars=Array.from({length:z.type==='campagna'?2:5},()=>{const hz=r2()<.5;const p=r2();const col=['#d7263d','#2f7fb8','#f7d64a','#3f9b5f'][Math.floor(r2()*4)];
    return hz?`<rect x="${20+p*340}" y="${(r2()<.5?138:284)-5}" width="16" height="9" rx="2" fill="${col}" stroke="${INK}" stroke-width="1.6"/>`:`<rect x="${(r2()<.5?128:272)-5}" y="${30+p*340}" width="9" height="16" rx="2" fill="${col}" stroke="${INK}" stroke-width="1.6"/>`;}).join('');
  const night=L.mode==='night';

     +[[128,30],[128,200],[128,390],[272,90],[272,250],[40,138],[200,138],[360,284],[90,284]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="16" fill="#f7d64a" opacity=".16"/><circle cx="${x}" cy="${y}" r="2.5" fill="#f7d64a"/>`).join('')
     +mFog(5,r2,W,H)+mZombieDots(z.type==='centro'?6:4,r2,W,H):'';
  let special='';
  if(z.type==='lago'){special=`<path d="M-10 ${H*.55} C80 ${H*.5} 160 ${H*.62} 260 ${H*.56} S380 ${H*.5} 410 ${H*.54} V${H+10} H-10Z" fill="#6fa8dc" stroke="${INK}" stroke-width="3"/>

     ${Array.from({length:8},()=>{const x=30+r2()*340,y=H*.62+r2()*H*.3;return`<path d="M${x-10} ${y} h20 l-4 6 h-12z" fill="#fff" stroke="${INK}" stroke-width="1.6"/><path d="M${x} ${y} v-12 l8 9z" fill="#f3e9d2" stroke="${INK}" stroke-width="1.4"/>`;}).join('')}

     ${mBanner(320,H*.58+20,'LUNGOLAGO')}`;}
  if(z.type==='montagna'){special=`<rect width="${W}" height="${H}" fill="#dfe7ee" opacity=".55"/>
     ${[0,1,2,3,4].map(i=>`<path d="M-10 ${80+i*70} Q100 ${40+i*70} 200 ${90+i*70} T410 ${60+i*70}" fill="none" stroke="#8a8f99" stroke-width="1.4" opacity=".7"/>`).join('')}
     <path d="M0 120 L60 30 L110 90 L170 20 L240 100 L300 36 L360 90 L410 50 V0 H0Z" fill="#9aa4b0" stroke="${INK}" stroke-width="2.5"/>
     <path d="M48 48 L60 30 L74 48 L66 44 L60 52 L54 44Z M158 38 L170 20 L184 38 L176 34 L170 42 L164 34Z M288 54 L300 36 L314 54 L306 50 L300 58 L294 50Z" fill="#fff" stroke="${INK}" stroke-width="1.6"/>
     ${Array.from({length:40},()=>{const x=10+r2()*380,y=130+r2()*270;return`<path d="M${x} ${y} l7 -18 l7 18z" fill="#2f6b45" stroke="${INK}" stroke-width="1.3"/>`;}).join('')}
     ${mBanner(300,150,'SENTIERO DEL RIFUGIO')}`;}
  const decor=special+bridges+rail+lms+streets+cars;
  /* livello aggregato a esagoni (solo celle con almeno 2 utenti) */
  let heat='';
  if(L.heat){const R=46;for(let cy=R;cy<H;cy+=R*1.5)for(let cx=(Math.round(cy/(R*1.5))%2)*R*.87;cx<W+R;cx+=R*1.74){
      const us=z.users.filter(u=>Math.hypot(u.x*W-cx,u.y*H-cy)<R);if(us.length<2)continue;

  ${L.spons&&typeof sponsorLayer==='function'?sponsorLayer(z):''}</svg>`;
}

<script>
/* =========================================================
   COMMUNITY E SPONSOR SULLA MAPPA REALE
   - celle esagonali: si mostra il numero di utenti solo se >= 5
   - sponsor: segnaposto con scheda e collegamento
   Produzione: celle H3 su Supabase (si salva solo la cella).
   ========================================================= */
const K_MIN=5;
const SP_CAT={ferr:'Ferramenta e sicurezza',sic:'Allarmi e porte blindate',sol:'Energia e fotovoltaico'};
const SP_LINK={ferr:{web:'https://www.example.com/ferramenta-volta',ig:'https://www.instagram.com/',fb:'https://www.facebook.com/'},sic:{web:'https://www.example.com/sicurcasa',ig:'https://www.instagram.com/'},sol:{web:'https://www.example.com/solarbox',fb:'https://www.facebook.com/'}};
const SP_OFF={ferr:'−10% sulle grate con il codice dell’app',sic:'Sopralluogo gratuito dopo la valutazione',sol:'Check-up energetico gratuito'};
function commCells(z){const gr=(typeof S!=='undefined'&&S.commGrowth)||1;if(z._comm&&z._commG===gr)return z._comm;z._commG=gr;const r=rng((z.seed||7)+11);const R=34,s3=Math.sqrt(3);const base=z.type==='centro'?14:z.type==='periferia'?8:4;const out=[];
  for(let row=0;row<6;row++)for(let col=0;col<8;col++){const x=24+col*R*s3+(row%2)*R*s3/2,y=36+row*R*1.5;if(x>392)continue;
    const n=Math.max(0,Math.round(base*gr*(.15+r()*1.5)));const avg=Math.max(1,Math.min(10,(z.avgU||5)+(r()-.5)*3));out.push({x,y,n,avg});}
  z._comm=out;return out;}
function commSummary(z){const c=commCells(z);const vis=c.filter(x=>x.n>=K_MIN);const tot=c.reduce((a,x)=>a+x.n,0);const avg=vis.length?vis.reduce((a,x)=>a+x.avg*x.n,0)/vis.reduce((a,x)=>a+x.n,0):0;return{tot,cells:vis.length,avg};}
function hexPath(x,y,R){let d='';for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);d+=(i?'L':'M')+(x+R*Math.cos(a)).toFixed(1)+' '+(y+R*Math.sin(a)).toFixed(1);}return d+'Z';}
function commLayer(z){return`<g class="commL">${commCells(z).map((c,i)=>{const ok=c.n>=K_MIN;const col=c.avg<=4?'#3f9b5f':c.avg<=6?'#f7d64a':'#d7263d';
  return`<g data-hex="${i}" style="cursor:pointer"><path d="${hexPath(c.x,c.y,33)}" fill="${ok?col:'#cfc6e6'}" fill-opacity="${ok?.32:.18}" stroke="#140f1f" stroke-width="1.2" stroke-dasharray="${ok?'':'3 3'}"/>
   ${ok?`<rect x="${c.x-15}" y="${c.y-11}" width="30" height="20" fill="#fff" stroke="#140f1f" stroke-width="1.5"/><text x="${c.x}" y="${c.y+4}" text-anchor="middle" font-family="Bangers,Impact" font-size="13" fill="#140f1f">${c.n}</text>`:`<text x="${c.x}" y="${c.y+4}" text-anchor="middle" font-size="9" font-weight="700" fill="#140f1f" opacity=".7">&lt;5</text>`}</g>`;}).join('')}</g>`;}
function sponsorSpots(z){const r=rng((z.seed||7)+57);return Object.keys(SPONSORS).map(k=>({k,x:50+r()*300,y:60+r()*300,d:Math.round(150+r()*1400)}));}
function sponsorLayer(z){return sponsorSpots(z).map(s=>`<g data-spn="${s.k}" style="cursor:pointer"><path d="M${s.x} ${s.y+16} l-7 -10 h14z" fill="#140f1f"/><rect x="${s.x-16}" y="${s.y-22}" width="32" height="26" rx="4" fill="#f7d64a" stroke="#140f1f" stroke-width="2.5"/>
  <text x="${s.x}" y="${s.y-5}" text-anchor="middle" font-family="Bangers,Impact" font-size="13" fill="#140f1f">${SPONSORS[s.k].logo}</text><text x="${s.x+14}" y="${s.y-18}" font-size="10">⭐</text><rect x="${s.x-17}" y="${s.y+6}" width="34" height="11" rx="3" fill="#fff" stroke="#140f1f" stroke-width="1.2"/><text x="${s.x}" y="${s.y+14.5}" text-anchor="middle" font-size="8" font-weight="700" fill="#140f1f">${typeof rvStarsTxt==='function'?rvStarsTxt('sp-'+s.k).split(' (')[0]:''}</text></g>`).join('');}
function hexInfo(z,i){const c=commCells(z)[i];if(c.n<K_MIN)return`<b>Area con meno di ${K_MIN} utenti</b><span>Per proteggere la privacy non mostriamo numeri sotto questa soglia.</span>`;
  return`<b>👥 ${c.n} superstiti in quest’area</b><span>Indice medio ${fmtI(c.avg)} · ${c.avg<=4?'zona ben preparata':c.avg<=6?'zona da presidiare':'zona fragile'}</span>`;}
function sponsorSheet(k,z){const s=SPONSORS[k];const sp=sponsorSpots(z).find(x=>x.k===k);
  openSheet(`⭐ ${esc(s.name)}`,`<p class="muted" style="margin-bottom:6px">${SP_CAT[k]||'Sponsor'} · a ${sp?(sp.d<1000?sp.d+' m':(sp.d/1000).toFixed(1).replace('.',',')+' km'):'—'}</p>
    <div class="row" style="gap:8px;align-items:center;margin-bottom:8px">${rvLine('sp-'+k,8,4.2)}${rvBtn('sp-'+k,s.name)}</div>
    <div class="notice" style="margin-bottom:10px">🎁 ${SP_OFF[k]||'Offerta per i superstiti'}</div>
    <p style="font-weight:400;font-size:14px;margin-bottom:10px">Alleato del quartiere: compare sulla mappa vera e come edificio nel quartiere del gioco.</p>
    <div class="splinks">${SP_LINK[k]&&SP_LINK[k].web?`<a class="btn small" href="${SP_LINK[k].web}" target="_blank" rel="noopener">🌐 Sito</a>`:''}${SP_LINK[k]&&SP_LINK[k].ig?`<a class="btn small alt" href="${SP_LINK[k].ig}" target="_blank" rel="noopener">📷 Instagram</a>`:''}${SP_LINK[k]&&SP_LINK[k].fb?`<a class="btn small alt" href="${SP_LINK[k].fb}" target="_blank" rel="noopener">📘 Facebook</a>`:''}</div>
    <button class="btn small ghost" data-tosp style="margin-top:8px">Tutti gli sponsor</button><p class="muted" style="font-size:11px;margin-top:6px">Contenuto sponsorizzato · link di esempio nell’anteprima.</p>`,
  card=>{card.querySelector('[data-tosp]').onclick=()=>{closeSheet();go('sponsor');};});}
function wireCommunity(root,z,info){if(!root||root.__comm)return;root.__comm=1;
  root.addEventListener('click',e=>{const h=e.target.closest('[data-hex]'),p=e.target.closest('[data-spn]');
    if(p){sponsorSheet(p.dataset.spn,z);return;}if(h&&info){info.innerHTML=hexInfo(z,+h.dataset.hex);}});}
function commCard(z){const c=commSummary(z);return`<div class="panel commc"><div class="row spread"><b>👥 Community in zona</b><small class="muted">aree con almeno ${K_MIN} utenti</small></div>
  <div class="row" style="gap:8px;margin-top:8px"><div class="stat"><b>${c.tot}</b><small>superstiti</small></div><div class="stat"><b>${c.cells}</b><small>aree attive</small></div><div class="stat"><b>${c.avg?fmtI(c.avg):'–'}</b><small>indice medio</small></div></div></div>`;}
</script>
<script>

function bindGo(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{vibe();if(b.dataset.step)S.step=+b.dataset.step;if(b.dataset.mot2)S.motivo=b.dataset.mot2;else if(b.dataset.go==='contatti')S.motivo='info';go(b.dataset.go);});}

/* ---------------- VALUTA ---------------- */
const STEP_LBL=['Zona','Foto','Domande','Verdetto'];

function stepsBar(){return`<div class="stepbar">${STEP_LBL.map((l,i)=>`<button class="sb ${i<S.step?'done':i===S.step?'on':''}" data-jump="${i}" ${i>S.step&&!(i===3&&S.result)?'disabled':''}><span>${i<S.step?'✓':i+1}</span>${l}</button>`).join('')}</div>`;}

function zoneCard(z,key='z',me=true){

     <p class="notice" style="margin-top:10px">${CONFIG.GOOGLE_MAPS_API_KEY?'Servizi da Google Maps.':'Servizi e superstiti simulati. In produzione: servizi da Google Maps, superstiti dal database.'} I superstiti compaiono solo con profilo pubblico, in posizione approssimativa (circa 200 m) e con il solo indice generale: i punti deboli delle case non sono mai visibili.</p>
   ${me?`<div style="padding:8px 12px"><button class="btn small alt" data-realmap="${esc(z.address)}">🗺️ Vedi la tua zona vera a fumetto</button></div>`:''}</div>`;

function bindMap(key,z,me=true){
  const box=document.getElementById('map-'+key);if(!box)return;
  box.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{S.layers[b.dataset.layer]=!S.layers[b.dataset.layer];box.querySelector('.mapsvg').innerHTML=mapScene(z,{...S.layers,me,mode:'night'});box.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('on',S.layers[x.dataset.layer]));wirePins();});

function siege(){const sTo=(f,ms)=>setTimeout(()=>{if(!document.getElementById('scene')||!document.getElementById('report'))return;try{f();}catch(e){console.warn(e);}},ms);
  const a=gameAnswers();const sc=computeScore(a,S.zone).idx;
  const helpers=a.gruppo==='org'?2:(a.vicini==='20'&&a.gruppo==='qualche')?1:0;
  const eff=Math.max(1,sc-(helpers===2?1:helpers===1?.4:0));
  const key=finaleKey(a,eff,helpers);const strong=FINALI[key].ok;
  const fence=a.recinzione==='muro2'?'muro alto':a.recinzione==='muro1'?'cancellata':(a.recinzione==='rete'||a.recinzione==='cond')?'rete':null;
  const box=$('#scene');box.innerHTML=houseScene(a,{siege:true,sid:'s'})+`<div class="cap" id="cap"></div>`;
  box.scrollIntoView({behavior:'smooth',block:'center'});
  ($('#siege')||{}).disabled=true;($('#report')||{}).innerHTML='';
  const svg=box.querySelector('svg');const sid='gs';

  const cap=t=>{const c=$('#cap');if(!c)return;c.textContent=t;c.classList.remove('in');void c.offsetWidth;c.classList.add('in');};

  const move=(el,dx,dur,dy=0)=>{if(!el)return;el.style.transition=`transform ${dur}s linear, opacity .8s`;el.style.transform=`translate(${dx}px,${dy}px)`;};
  const stopL=fence?(fence==='rete'?150:120):200, stopR=fence?(fence==='rete'?300:330):250;
  const log=[];const T=(ms,fn)=>sTo(fn,ms);
  cap('Mezzanotte. L’orda arriva dalla strada.');try{sfx('horn');}catch(e){}
  requestAnimationFrame(()=>requestAnimationFrame(()=>Z.forEach((g,i)=>{const x=+g.dataset.x,l=g.dataset.side==='l';const k=+g.dataset.i%5;move(g,(l?stopL-k*22:stopR+k*22)-x,3+k*.35);})));
  if(a.luci==='sensore'){T(1800,()=>{svg.querySelector('.cone')&&svg.querySelector('.cone').classList.add('flash');pop('FLASH!','8%','30%');});log.push('Le luci a sensore hanno scoperto l’orda in anticipo');}
  if(a.cane==='1'){T(1500,()=>pop('WOOF!','12%','62%'));log.push('Il cane ha dato l’allarme');}
  if(a.allarme==='cam'||a.allarme==='allarme'){T(2600,()=>{const s=document.getElementById('siren'+sid);s&&s.classList.add('blink');pop('UIIIUUU!','58%','40%','#d7263d');});log.push('L’allarme ha svegliato tutto il quartiere');}
  if(a.energia==='fv'||a.energia==='gen'){T(3200,()=>{cap('Blackout nel quartiere… ma da te le luci restano accese.');});log.push(a.energia==='fv'?'Il fotovoltaico ha tenuto accesa la casa':'Il generatore ha tenuto accesa la casa');}
  T(4000,()=>{if(fence){pop(fence==='rete'?'CRAAK!':'BONK!','30%','70%');cap(fence==='rete'?'La rete scricchiola…':`Il ${fence} li tiene fuori.`);}else cap('Niente recinzione: sono già in giardino!');});
  log.push(fence?`Recinzione: ${fence}`:'Nessuna recinzione: orda subito alla porta');
  if(a.porta==='b4'||a.porta==='blindata')log.push('La porta blindata ha retto agli urti');
  if(a.grate==='tutte')log.push('Le grate hanno chiuso le finestre basse');
  let t=5400;
  if(helpers){T(t,()=>{cap(helpers===2?'Il gruppo di quartiere arriva in aiuto!':'Un vicino accorre con la torcia!');const h=document.getElementById('help'+sid);if(h){h.style.opacity=1;move(h,helpers===2?190:150,2.4);}pop('ARRIVIAMO!','4%','46%','#f7d64a');
      Z.filter(g=>g.dataset.side==='l').forEach(g=>{const cur=g.style.transform.match(/-?\d+(\.\d+)?/);const dx=cur?+cur[0]:0;move(g,dx-260,2.2);g.style.opacity=.25;});});
    log.push(helpers===2?'I vicini del gruppo hanno respinto il lato sinistro':'Un vicino ha dato una mano');t+=2800;}
  T(t,()=>{
    if(strong){cap(key==='fortezza'?'Nessun varco: l’orda si arrende.':'Alba. La casa ha resistito.');const d=document.getElementById('dawn'+sid);if(d)d.style.opacity=.55;const m=document.getElementById('moon'+sid);if(m)m.style.opacity=.2;
      Z.forEach(g=>{const l=g.dataset.side==='l';move(g,l?-420:420,3);g.style.opacity=0;});pop(key==='fortezza'?'FORTEZZA!':'RESISTITO!','22%','26%','#6fb59a');finish();return;}
    cap('Le difese cedono!');pop('SFONDATO!','24%','26%','#d7263d');
    Z.forEach(g=>{const x=+g.dataset.x,l=g.dataset.side==='l';move(g,(l?190:250)-x+(Math.random()*20-10),1.6);});

      if(key==='elicottero'){cap('SOS via radio… arrivano i soccorsi!');pop('FLAP FLAP!','55%','10%','#f7d64a');if(fam){fam.style.opacity=1;move(fam,0,1.6,-90);T(1700,()=>fam.style.opacity=0);}log.push('La radio ha chiamato i soccorsi');}
      else if(key==='auto'){if(fam){fam.style.opacity=1;move(fam,175,1.2,40);}cap('Tutti in macchina, via di fuga libera!');T(1300,()=>{if(fam)fam.style.opacity=0;move(document.getElementById('vehicle'+sid),260,1.6);pop('VROOOM!','60%','62%','#f7d64a');});log.push('Fuga in auto riuscita');}
      else if(key==='bici'){if(fam){fam.style.opacity=1;move(fam,-150,1.2,40);}cap('In bici lungo la via di fuga!');T(1300,()=>{if(fam)fam.style.opacity=0;move(document.getElementById('vehicle'+sid),-200,2);pop('DLIN DLIN!','10%','62%','#f7d64a');});log.push('Fuga in bici riuscita');}
      else if(key==='zaino'||key==='piedi'){if(fam){fam.style.opacity=1;move(fam,320,key==='zaino'?3:2.4,40);}cap(key==='zaino'?'Zaini in spalla: ritirata organizzata.':'Si scappa a piedi: correte!');pop(key==='zaino'?'VIA!':'SCAPPA!','56%','58%','#f7d64a');log.push(key==='zaino'?'Lo zaino di fuga ha fatto la differenza':'Fuga a piedi senza preparazione');}
      else if(key==='tetto'){if(fam){fam.style.opacity=1;move(fam,0,1.4,-130);}cap('Tutti sul terrazzo!');pop('SU, SU!','46%','20%','#f7d64a');log.push('Il terrazzo raggiungibile solo da dentro vi ha salvati');}
      else if(key==='rifugio'){cap('Tutti nella stanza rifugio.');pop('CLANG!','50%','60%');log.push('La stanza rifugio ha retto');}
      else{cap('Nessuna via di fuga. Game over.');pop('GAME OVER','14%','40%','#d7263d');log.push('Nessuna via di fuga e nessun rifugio');}
      finish();});
  });
  function finish(){
    T(strong?2600:3000,()=>{const rep=$('#report');rep.innerHTML='<div id="tavole"></div><div id="finale"></div>';playTavole(a,$('#tavole'),()=>showFinale());});
  }
  function showFinale(){
    T(400,()=>{
      ($('#siege')||{}).disabled=false;S.finali=S.finali||{};const nuovo=!S.finali[key];S.finali[key]=true;const nf=Object.keys(S.finali).length;
      const F=FINALI[key];
      $('#finale').innerHTML=`<div class="panel finale ${F.ok?'ok':''}"><div class="fin-h"><span class="tag ${F.ok?'ia':'sp'}">${nuovo?'Nuovo finale!':'Finale'} · ${nf}/12 scoperti</span><h3>${F.t}</h3></div>
        <div class="fin-art">${finaleSVG(key,a)}</div><p style="font-weight:400;margin:8px 0">${F.d}</p>
        <div class="fin-list">${Object.keys(FINALI).map(k=>`<span class="${S.finali[k]?'on':''}" title="${FINALI[k].t}">${S.finali[k]?FINALI[k].t:'???'}</span>`).join('')}</div></div>
        <div class="panel ${F.ok?'':'night'}"><h3 ${F.ok?'':'style="color:var(--moon)"'}>Rapporto della notte</h3>
        <p style="margin:6px 0 8px">${F.ok?`Esito: <b>resistito</b>. Autonomia stimata: ${nightsFor(sc)} notti.`:'Esito: <b>difese superate</b>.'}</p>
        ${log.map(l=>`<div class="finding"><span class="tag ${F.ok?'ia':'sp'}">✓</span><div>${l}</div></div>`).join('')}
        ${F.ok?'':'<p style="margin-top:8px;font-weight:400">Prova i potenziamenti consigliati dall’IA e scopri un finale migliore.</p>'}</div>`;
      $('#finale').scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
}

}
async function sendChat(fromElsewhere){
  S.chat.push({r:'bot',t:'…',typing:true});if(S.tab==='radio')renderRadio();
  const hist=S.chat.filter(m=>!m.typing).slice(-10).map(m=>({role:m.r==='me'?'user':'assistant',content:m.t}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  let reply;
  try{reply=await askAI(CHAT_SYSTEM,hist);if(!reply)throw 0;}
  catch(e){reply=fallbackChat(hist[hist.length-1].content);}
  S.chat=S.chat.filter(m=>!m.typing);S.chat.push({r:'bot',t:reply});
  if(S.tab==='radio')renderRadio();
}

function sfx(k){if(G.mute)return;try{const c=audioCtx();if(!c)return;const t=c.currentTime;
  const tone=(f,d,type='square',v=.06,f2)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AUD.master);o.start(t);o.stop(t+d);};
  const noise=(d,v=.12)=>{const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AUD.master);s.start(t);};
  if(k==='tap')tone(320+Math.random()*80,.08,'square',.05,160);
  if(k==='poof')tone(500,.18,'triangle',.05,900);
  if(k==='coin'){tone(988,.07,'square',.035);setTimeout(()=>tone(1319,.12,'square',.035),60);}
  if(k==='boom'){noise(.4,.22);tone(120,.35,'sine',.12,40);}
  if(k==='horn'){tone(110,.6,'sawtooth',.05,90);tone(165,.6,'sawtooth',.03,140);}
  if(k==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.045),i*110));}
  if(k==='lose'){[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.06),i*150));}
  if(k==='crack')noise(.15,.15);
}catch(e){}}

function tenOf(b){if(!b||b.kind!=='house'||!b.ten)return null;
  if(b.ten.f){const f=G.friends.find(x=>x.id===b.ten.f);if(!f)return null;return{type:'friend',f,role:f.role,lv:fLv(f)};}
  return{type:'npc',role:b.ten.n,lv:b.lv};}
function lotRole(b){const t=tenOf(b);return t?t.role:null;}
function lotLv(b){const t=tenOf(b);return t?t.lv:0;}
function totalRent(){return Object.values(G.lots).filter(b=>tenOf(b)&&tenOf(b).type==='npc').reduce((t,b)=>t+Math.round(TENANTS[b.ten.n].rent*b.lv*(G.type==='schiera'?1.2:1)),0);}
function friendBonus(){return Object.values(G.lots).filter(b=>tenOf(b)&&tenOf(b).type==='friend').length*25;}
function houseOfFriend(fid){return Object.entries(G.lots).find(([,b])=>b.kind==='house'&&b.ten&&b.ten.f===fid);}
function renoCost(l,lv,base){return lv>=3?null:Math.round((base||l.cost)*(.6+lv*.3));}
function toolCd(tl,lv){return tl.cd*(1-(lv-1)*.15)*(1-hUp('energia')*.2)*Math.max(.6,1-bLv('radio')*.08);}

const SCR=[['🪙','200 monete',g=>{g.coins+=200;}],['💎','10 gemme',g=>{g.gems+=10;}],['🍀','2 giri di ruota',g=>{g.spins+=2;}],['🧰','un attrezzo migliorato',g=>{const t=TOOLS.find(t=>G.tools[t.id]&&G.tools[t.id]<3);if(t)G.tools[t.id]++;else G.coins+=150;}]];
function luckInit(){G.spins=G.spins??1;G.scratch=G.scratch??1;G.perk=G.perk||{};G.wins=G.wins||0;G.jar=G.jar||{goal:60,mine:0,fr:{},round:1};G.lastDaily=G.lastDaily||null;}
function dailyBonus(){luckInit();const today=new Date().toDateString();if(G.lastDaily===today)return;G.lastDaily=today;
  const team=G.friends?G.friends.filter(f=>f.on&&houseOfFriend(f.id)).length:0;G.spins+=1+team;
  if(G.famOut){const f=G.friends.find(x=>x.id===G.famOut);const c=15*famSize(G.level);G.coins+=c;setTimeout(()=>toast(`La tua famiglia ha difeso il quartiere di @${f?f.nick:'un amico'}: +${c} 🪙`),2600);}
  setTimeout(()=>toast(team?`Giro del giorno + ${team} bonus squadra: i tuoi amici-inquilini hanno giocato oggi 🎡`:'Giro della ruota del giorno 🎡'),400);}
function jarAfterWave(win){luckInit();G.jar.mine+=win?3:1;(G.friends||[]).forEach(f=>{if(Math.random()<(f.on?.8:.35))G.jar.fr[f.id]=(G.jar.fr[f.id]||0)+1+Math.floor(Math.random()*3);});}
function jarTotal(){return G.jar.mine+Object.values(G.jar.fr).reduce((a,b)=>a+b,0);}
function luckHTML(){
  luckInit();const tot=jarTotal(),pct=Math.min(100,tot/G.jar.goal*100);const fr=G.friends||[];const absent=fr.filter(f=>!G.jar.fr[f.id]);

   </div>

   <div class="panel">

     <div class="row wrap" style="gap:8px">${pct>=100?'<button class="btn small" id="jarDraw">Estrai il premio del gruppo</button>':''}${absent.length?`<button class="btn small ghost" id="jarPoke">Sprona chi manca</button>`:''}</div>
   </div>
   ${G.perk.house||G.perk.power?`<div class="notice" style="margin-top:8px">Pronti per la prossima ondata: ${G.perk.house?'🛡️ Casa blindata':''}${G.perk.house&&G.perk.power?' · ':''}${G.perk.power?'💪 Superpugno':''}</div>`:''}`;
}
function bindLuck(){
  app.querySelectorAll('[data-luck]').forEach(b=>b.onclick=()=>b.dataset.luck==='wheel'?wheelSheet():scratchSheet());
  const d=$('#jarDraw');if(d)d.onclick=()=>{const all=(G.friends||[]).every(f=>G.jar.fr[f.id]);const m=all?2:1;G.coins+=100*m;G.gems+=10*m;sfx('win');
    toast(`Estrazione del quartiere: +${100*m} 🪙 e +${10*m} 💎 a te e a ogni amico${all?' (doppio: avete giocato tutti!)':''}`);G.jar={goal:Math.round(G.jar.goal*1.25),mine:0,fr:{},round:G.jar.round+1};renderHub();};
  const p=$('#jarPoke');if(p)p.onclick=()=>{const ab=(G.friends||[]).filter(f=>!G.jar.fr[f.id]);toast(`Promemoria inviato a ${ab.map(f=>'@'+f.nick).join(', ')}: “Manca solo il tuo biglietto!”`);vibe();};
}
function wheelSheet(){
  const tw=WHEEL.reduce((a,s)=>a+s.w,0);const n=WHEEL.length,A=360/n;
  const sl=WHEEL.map((s,i)=>{const a0=(i*A-90-A/2)*Math.PI/180,a1=((i+1)*A-90-A/2)*Math.PI/180;const r=120;
    const x0=Math.cos(a0)*r,y0=Math.sin(a0)*r,x1=Math.cos(a1)*r,y1=Math.sin(a1)*r;const am=(i*A-90)*Math.PI/180;
    return`<path d="M0 0 L${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${s.c}" stroke="${INK}" stroke-width="3"/>
      <g transform="rotate(${i*A}) translate(0 -84)"><text text-anchor="middle" font-size="22">${s.ic}</text><text y="22" text-anchor="middle" font-family="Bangers,Impact" font-size="${s.l.length>6?12:16}" fill="${INK}">${s.l}</text></g>`;}).join('');
  openSheet('🎡 Ruota del superstite',`
    <div class="wheelbox"><div class="pointer">▼</div><svg viewBox="-130 -130 260 260" class="wheel" id="wheel">${sl}<circle r="22" fill="${INK}"/><circle r="12" fill="#f7d64a"/></svg></div>
    <button class="btn wide" id="spin" ${G.spins<1?'disabled':''}>${G.spins<1?'Nessun giro disponibile':`Gira (${G.spins} ${G.spins===1?'giro':'giri'})`}</button>
    <p id="wres" class="wres"></p>
    <details class="odds"><summary>Probabilità dei premi</summary>${WHEEL.map(s=>`<div class="row spread"><span>${s.ic} ${s.l}${s.k==='coins'?' monete':s.k==='gems'&&s.l!=='JACKPOT'?' gemme':s.l==='JACKPOT'?' (50 gemme)':''}</span><b>${(s.w/tw*100).toFixed(1).replace('.',',')}%</b></div>`).join('')}</details>`,
  card=>{let rot=G.wheelRot||0;const w=card.querySelector('#wheel');w.style.transform=`rotate(${rot}deg)`;
    card.querySelector('#spin').onclick=e=>{if(G.spins<1||card.spinning)return;card.spinning=true;G.spins--;e.target.disabled=true;sfx('tap');
      let r=Math.random()*tw,i=0;for(;i<n;i++){r-=WHEEL[i].w;if(r<=0)break;}i=Math.min(i,n-1);
      const target=360-i*A+(Math.random()-.5)*A*.6;rot=rot+360*5+((target-rot%360)+360)%360;G.wheelRot=rot;
      w.style.transition='transform 3.6s cubic-bezier(.12,.75,.15,1)';w.style.transform=`rotate(${rot}deg)`;
      let tick=0;const tk=setInterval(()=>{if(++tick>14)return clearInterval(tk);sfx('tap');},200);
      setTimeout(()=>{const s=WHEEL[i];if(s.k==='coins')G.coins+=s.v;if(s.k==='gems')G.gems+=s.v;if(s.k==='house')G.perk.house=1;if(s.k==='power')G.perk.power=1;
        sfx(s.l==='JACKPOT'?'win':'coin');card.querySelector('#wres').innerHTML=`<span class="sfx" style="font-size:30px">${s.l==='JACKPOT'?'JACKPOT!':'HAI VINTO!'}</span><br>${s.ic} ${s.k==='coins'?s.v+' monete':s.k==='gems'?s.v+' gemme':s.k==='house'?'Casa blindata: −40% danni alla casa nella prossima ondata':'Superpugno: tocchi doppi all’inizio della prossima ondata'}`;
        card.spinning=false;const b=card.querySelector('#spin');b.disabled=G.spins<1;b.textContent=G.spins<1?'Nessun giro disponibile':`Gira ancora (${G.spins})`;renderHub();},3700);};});
}
function scratchSheet(){
  if(G.scratch<1){openSheet('🎟️ Gratta e vinci','<p>Non hai biglietti. Li guadagni scacciando un boss o conquistando una medaglia.</p>');return;}
  G.scratch--;const win=Math.random()<.4;const pick=SCR[Math.floor(Math.random()*SCR.length)];
  let cells;if(win)cells=[pick,pick,pick];else{do{cells=[0,1,2].map(()=>SCR[Math.floor(Math.random()*SCR.length)]);}while(cells[0]===cells[1]&&cells[1]===cells[2]);}
  openSheet('🎟️ Gratta e vinci della notte',`
    <p class="muted" style="margin-bottom:8px">Gratta con il dito: tre simboli uguali vincono. Vince circa 1 biglietto su 2,5.</p>
    <div class="ticket"><div class="cells">${cells.map(c=>`<span>${c[0]}</span>`).join('')}</div><canvas id="scr" width="600" height="220" aria-label="Superficie da grattare"></canvas></div>
    <p id="sres" class="wres"></p>
    <div class="legendp">${SCR.map(s=>`<span>${s[0]}${s[0]}${s[0]} = ${s[1]}</span>`).join('')}</div>`,
  card=>{const cv=card.querySelector('#scr'),ctx=cv.getContext('2d');
    const g=ctx.createLinearGradient(0,0,600,220);g.addColorStop(0,'#9aa4b0');g.addColorStop(.5,'#cfd5dc');g.addColorStop(1,'#8a939e');ctx.fillStyle=g;ctx.fillRect(0,0,600,220);
    ctx.fillStyle='#140f1f';ctx.font='54px Bangers, Impact, sans-serif';ctx.textAlign='center';ctx.fillText('GRATTA QUI',300,128);
    for(let i=0;i<200;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.25})`;ctx.fillRect(Math.random()*600,Math.random()*220,2,2);}
    let done=false,down=false,n=0;
    const at=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*600,(e.clientY-r.top)/r.height*220];};
    const scratch=e=>{if(!down||done)return;e.preventDefault();const[x,y]=at(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,34,0,7);ctx.fill();if(++n%6===0){sfx('tap');check();}};
    const check=()=>{const d=ctx.getImageData(0,0,600,220).data;let clear=0;for(let i=3;i<d.length;i+=64)if(d[i]===0)clear++;if(clear/(d.length/64)>.55)reveal();};
    const reveal=()=>{if(done)return;done=true;cv.style.transition='opacity .5s';cv.style.opacity=0;
      if(win){pick[2](G);sfx('win');card.querySelector('#sres').innerHTML=`<span class="sfx" style="font-size:30px">TRIS!</span><br>Hai vinto ${pick[1]}`;}
      else{sfx('lose');card.querySelector('#sres').innerHTML='Niente tris stavolta. Il prossimo biglietto arriva con un boss o una medaglia.';}
      renderHub();};
    cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);scratch(e);});
    cv.addEventListener('pointermove',scratch);['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{down=false;}));
  });
}
</script>
<script>
/* =========================================================
   PREMI GIORNALIERI E MISSIONI (per far tornare ogni giorno)
   ========================================================= */
const DAILY=[
 {ic:'🪙',t:'100 monete',f:g=>{g.coins+=100;}},
 {ic:'🎡',t:'1 giro di ruota',f:g=>{g.spins=(g.spins||0)+1;}},
 {ic:'💎',t:'10 gemme',f:g=>{g.gems+=10;}},
 {ic:'🎟️',t:'1 gratta e vinci',f:g=>{g.scratch=(g.scratch||0)+1;}},
 {ic:'🪙',t:'300 monete',f:g=>{g.coins+=300;}},
 {ic:'🎡',t:'2 giri di ruota',f:g=>{g.spins=(g.spins||0)+2;}},
 {ic:'👑',t:'40 gemme + cassa forte',f:g=>{g.gems+=40;g.perk=g.perk||{};g.perk.house=1;g.perk.power=1;}}
];
const MISSIONS=[{k:'z',n:'Scaccia 40 zombie',goal:40,g:10},{k:'w',n:'Vinci 2 ondate',goal:2,g:10},{k:'s',n:'Saluta o aiuta un amico',goal:1,g:5}];
const dayKey=d=>d.toDateString();
function dailyState(){G.streak=G.streak||{day:0,last:null};const today=dayKey(new Date()),yest=dayKey(new Date(Date.now()-864e5));
  if(!G.today||G.today.date!==today)G.today={date:today,z:0,w:0,s:0,got:{},all:false};
  const claimed=G.streak.last===today;const cont=G.streak.last===yest;const missed=!claimed&&!cont&&G.streak.day>0;
  const next=claimed?G.streak.day:(cont?G.streak.day%7+1:1);return{today,claimed,missed,next};}
function missionAdd(k,n){if(!G.today)return;G.today[k]=(G.today[k]||0)+n;}
function dailyHTML(){
  const s=dailyState();const fr=(G.friends||[]).filter(f=>f.on).length;

    <div class="row spread"><b class="disp" style="font-size:22px">🎁 Premio del giorno</b><span class="tag ${s.claimed?'':'sp'}">${s.claimed?'Riscosso':'Giorno '+s.next+' di 7'}</span></div>
    ${s.missed?'<p class="muted" style="font-size:12px;margin:4px 0">Hai saltato un giorno: la serie riparte dal giorno 1.</p>':''}
    <div class="dtrack">${DAILY.map((d,i)=>{const n=i+1;const done=s.claimed?n<=s.next:n<s.next;const now=!s.claimed&&n===s.next;return`<div class="dday ${done?'done':''} ${now?'now':''} ${n===7?'big':''}"><small>G${n}</small><span>${done?'✓':d.ic}</span></div>`;}).join('')}</div>

    <p class="muted" style="font-size:12px;margin-top:6px">👥 Oggi hanno già riscosso ${fr} tuoi amici. Se riscuotete in almeno 3, +5 💎 a tutti.</p>
    <div class="missions"><b>Missioni di oggi</b>${MISSIONS.map(m=>{const v=Math.min(m.goal,G.today[m.k]||0),ok=v>=m.goal,got=G.today.got[m.k];return`<div class="mis"><div style="flex:1"><span>${m.n}</span><div class="hp" style="height:9px;margin-top:3px"><span style="width:${v/m.goal*100}%;background:var(--ok)"></span></div><small>${v}/${m.goal}</small></div>${got?'<span class="tag ia">✓</span>':`<button class="btn small" data-mis="${m.k}" ${ok?'':'disabled'}>+${m.g} 💎</button>`}</div>`;}).join('')}
      <small class="muted">Completale tutte e tre: +1 gratta e vinci bonus. Si rinnovano a mezzanotte.</small></div>
  </div>`;
}
function bindDaily(){
  const b=$('#dClaim');if(b)b.onclick=()=>{const s=dailyState();if(s.claimed)return;DAILY[s.next-1].f(G);G.streak={day:s.next,last:s.today};
    const fr=(G.friends||[]).filter(f=>f.on).length;if(fr+1>=3)G.gems+=5;sfx('win');toast(`Giorno ${s.next}: ${DAILY[s.next-1].t}${fr+1>=3?' + 5 💎 bonus di gruppo':''}`);renderHub();};
  app.querySelectorAll('[data-mis]').forEach(x=>x.onclick=()=>{const m=MISSIONS.find(y=>y.k===x.dataset.mis);G.gems+=m.g;G.today.got[m.k]=true;sfx('coin');
    if(MISSIONS.every(y=>G.today.got[y.k])&&!G.today.all){G.today.all=true;G.scratch=(G.scratch||0)+1;toast('Tutte le missioni: +1 gratta e vinci!');}else toast(`+${m.g} 💎`);renderHub();});

<script>
/* =========================================================
   VIATICO: la valutazione vera della casa dà un vantaggio in Orda
   - livello di partenza più alto se la casa è sicura (indice basso)
   - le difese reali diventano difese nel gioco (porta, grate, luci…)
   - pieno valore solo per ciò che è confermato dalle foto (IA)
   ========================================================= */
const VIA_FOTO=['porta','finestre','grate','tapparelle','recinzione','cancello','luci'];
function viatico(){
  if(!S.result||!S.game||!S.game.base)return null;
  const a=S.game.base,idx=S.result.idx;
  const ver=VIA_FOTO.filter(k=>S.aiFilled&&S.aiFilled[k]).length,verR=ver/VIA_FOTO.length,w=.5+.5*verR;
  const L0=idx<=2.5?8:idx<=3.5?6:idx<=4.5?5:idx<=5.5?4:idx<=6.5?3:idx<=7.5?2:1;
  const level=1+Math.round((L0-1)*w), coins=Math.round(80*(L0-1)*w/10)*10, gems=ver>=5?15:ver>=3?8:0;
  const h={},why=[];const up=(k,v,t)=>{if(v>0){h[k]=Math.max(h[k]||0,v);why.push(t);}};
  up('porta',a.porta==='b4'?2:a.porta==='blindata'?1:0,a.porta==='b4'?'porta blindata classe 4':'porta blindata');
  up('grate',Math.min(3,(a.grate==='tutte'?2:a.grate==='alcune'?1:0)+(a.tapparelle==='blind'?1:0)),'grate e tapparelle');
  up('muro',a.recinzione==='muro2'?2:a.recinzione==='muro1'?1:0,a.recinzione==='muro2'?'muro alto':'cancellata');
  up('luci',a.luci==='sensore'?2:a.luci==='fisse'?1:0,a.luci==='sensore'?'luci a sensore':'luci esterne');
  up('energia',a.energia==='fv'?2:a.energia==='gen'?1:0,a.energia==='fv'?'fotovoltaico':'generatore');
  up('vedetta',a.allarme==='cam'?1:0,'allarme con telecamere');
  const q={};if(a.gruppo==='org'){q.rossi=1;q.bianchi=1;why.push('gruppo di vicini');}else if(a.gruppo==='qualche'&&a.vicini==='20'){q.rossi=1;why.push('un vicino vicino');}
  const tipo=a.tipo==='schiera'?'schiera':/^apt/.test(a.tipo||'')?'apt':a.zona==='montagna'?'rifugio':a.zona==='campagna'?'casale':'villa';
  return{idx,L0,level,coins,gems,ver,verR,h,q,why,tipo};
}
function viaticoCard(){
  const v=viatico();
  if(!v)return`<div class="panel moon via"><b class="disp" style="font-size:22px">Parti avvantaggiato</b>
    <p style="font-weight:400;margin:4px 0 10px">Valuta la tua casa vera: più è protetta, più alto è il livello da cui parti in Orda. Porta blindata, grate e luci diventano difese anche nel gioco.</p>
    <button class="btn small" data-go="valuta">Valuta la mia casa</button></div>`;
  const on=S.useVia!==false;
  return`<div class="panel via ${on?'moon':''}">
    <div class="row spread"><b class="disp" style="font-size:22px">Viatico della tua casa</b><label class="sw"><input type="checkbox" id="viaOn" ${on?'checked':''}><span>${on?'Attivo':'Spento'}</span></label></div>
    <p style="font-weight:400;font-size:14px;margin:4px 0 8px">Indice reale <b>${fmtI(v.idx)}</b>: parti dall’<b>ondata ${v.level}</b>${v.coins?` con <b>+${v.coins} monete</b>`:''}${v.gems?` e <b>+${v.gems} gemme</b>`:''}.</p>
    ${v.why.length?`<p style="font-size:13px;font-weight:400;margin-bottom:8px">Difese portate dalla casa vera: ${v.why.join(', ')}.</p>`:'<p class="muted" style="font-size:13px;margin-bottom:8px">Nessuna difesa reale da portare nel gioco: migliora la casa e rivaluta.</p>'}
    <div class="vbar"><span style="width:${Math.round(v.verR*100)}%"></span></div>
    <small>${v.ver}/${VIA_FOTO.length} difese confermate dalle foto. ${v.ver<VIA_FOTO.length?`Con tutte confermate partiresti dall’ondata ${v.L0}.`:'Bonus pieno.'}</small>
    ${v.ver<VIA_FOTO.length?'<div style="margin-top:8px"><button class="btn small ghost" data-go="valuta" data-step="1">Conferma con le foto</button></div>':''}
    <p class="muted" style="font-size:11px;margin-top:8px">Il viatico vale una volta per casa e per account. Rispondere il falso non conviene: senza foto vale metà.</p></div>`;
}
function applyViatico(){
  const v=viatico();if(!v||S.useVia===false)return null;
  G.level=Math.max(G.level,v.level);G.best=Math.max(G.best||0,v.level-1);G.coins+=v.coins;G.gems+=v.gems;
  Object.entries(v.h).forEach(([k,lv])=>{const max=(HUP.find(u=>u.id===k)||{cost:[]}).cost.length;G.h[k]=Math.max(G.h[k]||0,Math.min(max,lv));});
  Object.entries(v.q).forEach(([k,lv])=>{G.q[k]=Math.max(G.q[k]||0,lv);});
  G.via={level:v.level,idx:v.idx};
  setTimeout(()=>toast(`Viatico attivo: parti dall’ondata ${v.level}${v.why.length?' con '+v.why.length+' difese della casa vera':''}`),300);
  return v;
}
</script>
<script>
/* =========================================================
   CREDITI CASA VERA + SFIDE TRA PROPRIETÀ (asincrone)
   - crediti: dalla casa vera verificata e dagli acquisti reali
     verificati presso gli sponsor (codice sullo scontrino)
   - sfida: scegli una tua proprietà; l'avversario è la difesa
     registrata di un altro giocatore con potenza simile;
     stessa orda per entrambi, vince chi resiste più ondate
   ========================================================= */

function duelStats(pow,seed){const r=rng(seed);return{hp:Math.round(pow*.9),bar:Math.round(pow*.45),def:pow*.11*(.92+r()*.16),arm:Math.min(.45,pow/1600)};}
async function duelStart(me){
  if(duelTickets()<1)return;G.today.duels--;

    ${side('dB',imgB,'@'+esc(opp.nick)+' · '+opp.name,opp.pow)}
    <div class="row" style="gap:6px;margin-top:10px"><button class="btn small" data-di="fix">🔧 Ripara</button><button class="btn small" data-di="pet">💥 Petardo</button><button class="btn small" data-di="sir">📢 Sirena</button></div>
    <p class="muted" style="font-size:12px;margin-top:6px">Tre interventi, uno a testa per tutta la sfida. L’avversario usa i suoi in automatico: è la sua difesa registrata.</p>
    <div id="dres"></div></div>`;
  window.scrollTo(0,0);setMusic('game',6);
  const used={};let mod={dmg:1};
  app.querySelectorAll('[data-di]').forEach(b=>b.onclick=()=>{const k=b.dataset.di;if(used[k]||end)return;used[k]=1;b.disabled=true;sfx(k==='pet'?'boom':'tap');
    if(k==='fix'){A.hp=Math.min(A.max,A.hp+A.max*.3);A.bar=Math.min(A.bmax,A.bar+A.bmax*.3);}if(k==='pet')mod.pet=1;if(k==='sir')mod.sir=1;draw();});
  const oppUse={fix:3+Math.floor(r()*5),pet:2+Math.floor(r()*5),sir:4+Math.floor(r()*5)};
  let w=0,end=false,wA=0,wB=0;
  function hit(S,str,cut){let d=Math.max(0,str-S.def)*cut;if(S.bar>0){const t=Math.min(S.bar,d);S.bar-=t;d-=t;}S.hp-=d*(1-S.arm);}
  function draw(){[['dA',A],['dB',B]].forEach(([id,S])=>{const e=document.getElementById(id);if(!e)return;e.querySelector('.dh').style.width=Math.max(0,S.hp/S.max*100)+'%';e.querySelector('.db').style.width=Math.max(0,S.bar/S.bmax*100)+'%';e.classList.toggle('down',S.hp<=0);});}
  draw();
  const tick=()=>{if(end||!document.getElementById('dA'))return;w++;const str=14*Math.pow(1.2,w-1)*(.95+rng(seed+w)()*.1);
    $('#dw').textContent='Ondata '+w;
    const cA=(mod.pet===1?.6:1)*(mod.sir===1?.7:1);if(mod.pet===1)mod.pet=2;if(mod.sir===1)mod.sir=2;
    let cB=1;if(w===oppUse.pet)cB*=.6;if(w===oppUse.sir)cB*=.7;if(w===oppUse.fix&&B.hp>0){B.hp=Math.min(B.max,B.hp+B.max*.3);B.bar=Math.min(B.bmax,B.bar+B.bmax*.3);}
    if(A.hp>0){hit(A,str,cA);if(A.hp>0)wA=w;}if(B.hp>0){hit(B,str,cB);if(B.hp>0)wB=w;}
    ['dA','dB'].forEach(id=>{const z=document.querySelector('#'+id+' .dz');if(z)z.textContent='🧟'.repeat(Math.min(12,2+Math.floor(w/2)));});
    draw();sfx('crack');

    G.duelLog.unshift({win,mine:me.name,opp:opp.nick,w1:wA,w2:wB,dt});sfx(win?'win':'lose');setMusic('app');
    $('#dres').innerHTML=`<div class="panel ${win?'moon':'night'}" style="margin-top:12px"><div class="sfx" style="font-size:34px;${win?'':'color:#d7263d'}">${win?'SFIDA VINTA!':'SFIDA PERSA'}</div>

      <p style="font-weight:400;font-size:13px">${win?'La tua difesa resta registrata: ora può essere sfidata dagli altri.':'Fortifica e addestra chi ci abita: la potenza conta più della fortuna.'}</p>
      <div class="row" style="gap:8px;margin-top:8px"><button class="btn small" id="dBack">Torna al quartiere</button>${duelTickets()>0?'<button class="btn small alt" id="dAgain">Nuova sfida</button>':''}</div></div>`;
    $('#dBack').onclick=()=>{G.view='hub';renderOrda();};const ag=$('#dAgain');if(ag)ag.onclick=()=>{G.view='hub';renderOrda();duelPick();};
    $('#dres').scrollIntoView({behavior:'smooth',block:'center'});}
}

const OPP_N=['bunkerboy','nonna_ninja','il_geometra','luna_rossa','fortezza_mn','zia_pina','vedetta','cascinaz','mister_grate','lago_blu','montanaro','tetto_sicuro','ilfabbro','casamatta','torre_nord','ponte_vecchio'];
function randCust(r){const c={...CUST_DEF,colore:CUST_COL[Math.floor(r()*CUST_COL.length)]};Object.entries(CUST).forEach(([k,S_])=>{c[k]=S_.o[Math.floor(r()*S_.o.length)][0];});return c;}
function makeOpp(pow,r,nick){const kinds=['villa','apt','schiera','casale','barca','rifugio','camper','residence','attico','loft','bifamiliare','ringhiera','faro','trullo','albero'];
  return{nick:nick||OPP_N[Math.floor(r()*OPP_N.length)],kind:kinds[Math.floor(r()*kinds.length)],pow:Math.round(pow*(.88+r()*.24)),cust:randCust(r),lega:league(Math.round(G.trof*(.7+r()*.6)))[0]};}
function oppStats(o){const d={hp:0,bar:0,arm:0,dps:0,regen:0,slow:0};Object.keys(CUST).forEach(k=>{const x=CUST[k].o.find(y=>y[0]===o.cust[k]);if(x)Object.entries(x[2]).forEach(([s,v])=>d[s]+=v);});
  return{hp:Math.round(90+o.pow*.32+d.hp),bar:Math.round(40+o.pow*.12+d.bar),arm:Math.min(.5,.02+d.arm),dps:.45+o.pow/700+d.dps,regen:d.regen,slow:Math.min(.4,d.slow),tap:1+Math.floor(o.pow/450)};}
function waveSpec(w,seed){const r=rng(seed*31+w);const n=3+Math.floor(w*1.6);const out=[];for(let i=0;i<n;i++){const x=r();out.push({ty:w>=3&&x<.08+w*.015?'brute':x<.3+w*.02?'runner':'walker',lane:Math.floor(r()*3),at:i*Math.max(.35,1.1-w*.05)+r()*.3});}return out;}
const AZT={walker:{hp:2.2,sp:20,dps:5,s:.5},runner:{hp:1.4,sp:38,dps:4,s:.48},brute:{hp:6,sp:12,dps:10,s:.62}};
function ghostWaves(st,seed){ /* stima onesta delle ondate di un giocatore medio con quelle difese */
  let hp=st.hp,bar=st.bar,w=0;const tapDps=2.6*st.tap;
  while(hp>0&&w<60){w++;const spec=waveSpec(w,seed);const hm=1+.18*(w-1);let H=0,D=0;spec.forEach(z=>{H+=AZT[z.ty].hp*hm;D+=AZT[z.ty].dps*(1+.12*(w-1));});
    const clear=H/(st.dps+tapDps);const expo=Math.max(0,clear-3.5*(1+st.slow))*.3;let dmg=D*expo/Math.max(1,spec.length/3);
    if(bar>0){const t=Math.min(bar,dmg);bar-=t;dmg-=t;}hp-=dmg*(1-st.arm);hp=Math.min(st.hp,hp+st.regen*clear);}
  return Math.max(0,w-1);}

  window.scrollTo(0,0);

    svgImage(spr(zombie(0,0,1,true),'-50 -80 100 125',100,125)),svgImage(spr(zombie(0,0,1,true).replace(/#7a6a56/g,'#d7263d'),'-50 -80 100 125',100,125)),svgImage(spr(zombie(0,0,1,true).replace(/#7a6a56/g,'#2b2240'),'-50 -80 100 125',100,125))]);

  const axy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*480,(e.clientY-r.top)/r.height*300];};let adown=false,alast=null,ahit=new Set();
  cv.addEventListener('pointerdown',e=>{if(S_.end)return;const[x,y]=axy(e);adown=true;alast=[x,y];ahit=new Set();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    let best=null,bd=48;S_.zs.forEach(z=>{const d=Math.hypot(z.x-x,(LN[z.lane]-30)-y);if(d<bd){bd=d;best=z;}});
    if(best){const Z=AZT[best.ty];const crit=y<LN[best.lane]-118*Z.s+42*Z.s;best.hp-=st.tap*(crit?2:1);best.fl=.12;ahit.add(best);pop(crit?'CRITICO!':['POW!','BAM!','TOC!'][Math.floor(Math.random()*3)],x-10,y-10,crit?'#d7263d':'#f7d64a');sfx('tap');}});
  cv.addEventListener('pointermove',e=>{if(!adown||S_.end)return;const[x,y]=axy(e);const[x0,y0]=alast;alast=[x,y];if(ahit.size>=5)return;

function tourInit(){if(G.tour)return G.tour;const r=rng(4242+(G.trof||0));const best=Math.max(...myProps().map(p=>p.pow));
  const groups={A:[],B:[],C:[],D:[]};const names=OPP_N.slice().sort(()=>r()-.5);let n=0;
  Object.keys(groups).forEach(g=>{for(let i=0;i<4;i++){if(g==='A'&&i===0){groups[g].push({me:true,nick:'Tu',pts:0,gw:0,ga:0,p:0});continue;}const o=makeOpp(best,r,names[n++]);groups[g].push({...o,pts:0,gw:0,ga:0,p:0});}});
  G.tour={week:1,phase:'gironi',groups,day:0,ko:null,out:false,prize:null,seed:Math.floor(r()*1e5)};return G.tour;}
function grpSort(arr){return arr.slice().sort((a,b)=>b.pts-a.pts||(b.gw-b.ga)-(a.gw-a.ga)||b.gw-a.gw);}
function simMatch(a,b,seed){const wa=a.me?0:ghostWaves(oppStats(a),seed)+Math.floor(rng(seed+1)()*3),wb=ghostWaves(oppStats(b),seed)+Math.floor(rng(seed+2)()*3);return[wa,wb];}
function addRes(x,y,wx,wy){x.p++;y.p++;x.gw+=wx;x.ga+=wy;y.gw+=wy;y.ga+=wx;if(wx>wy)x.pts+=3;else if(wy>wx)y.pts+=3;else{x.pts++;y.pts++;}}
function tourHTML(){
  const T=tourInit();const A=T.groups.A;const me=A[0];
  const table=(g,arr)=>`<table class="gt"><tr><th>Girone ${g}</th><th>G</th><th>Ond.</th><th>Pt</th></tr>${grpSort(arr).map((p,i)=>`<tr class="${p.me?'me':''} ${i<2?'q':''}"><td>${i+1}. ${p.me?'<b>Tu</b>':'@'+esc(p.nick)}</td><td>${p.p}</td><td>${p.gw}-${p.ga}</td><td><b>${p.pts}</b></td></tr>`).join('')}</table>`;
  let body='';
  if(T.phase==='gironi'){const opp=A[T.day+1];
    body=`${table('A',A)}<p class="muted" style="font-size:12px;margin:6px 0">Passano i primi 2 di ogni girone (in verde).</p>
      <div class="nextm"><div><small>Giornata ${T.day+1} di 3</small><b>Tu contro @${esc(opp.nick)}</b><small>${HTYPES[opp.kind]?HTYPES[opp.kind].name:''} · potenza ${opp.pow}</small></div><button class="btn small" id="tPlay">Gioca</button></div>
      <details class="howto"><summary>Altri gironi</summary>${['B','C','D'].map(g=>table(g,T.groups[g])).join('')}</details>`;}
  else if(T.phase==='ko'){const K=T.ko;const rnd=K.round;const lbl=['Quarti','Semifinale','Finale'][rnd];
    const bracket=K.rounds.map((ms,ri)=>`<div class="bcol"><small>${['Quarti','Semifinali','Finale'][ri]}</small>${ms.map(m=>`<div class="bm"><span class="${m.w===0?'w':''} ${m.a.me?'me':''}">${m.a.me?'Tu':'@'+esc(m.a.nick)} ${m.s?m.s[0]:''}</span><span class="${m.w===1?'w':''} ${m.b.me?'me':''}">${m.b.me?'Tu':'@'+esc(m.b.nick)} ${m.s?m.s[1]:''}</span></div>`).join('')}</div>`).join('');

  if(T.prize)body+=`<div class="notice" style="margin-top:8px">${T.prize}</div><button class="btn small alt" id="tNew" style="margin-top:8px">Iscriviti alla prossima Coppa</button>`;

function tourPlay(){
  const T=G.tour;let opp,onRes;
  if(T.phase==='gironi'){const A=T.groups.A;opp=A[T.day+1];
    onRes=res=>{addRes(A[0],opp,res.mine,res.opp);const others=A.slice(1).filter(p=>p!==opp);const sd=T.seed+T.day*7;
      const [a,b]=simMatch(others[0],others[1],sd);addRes(others[0],others[1],a,b);
      ['B','C','D'].forEach((g,gi)=>{const P=T.groups[g];const pairs=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][T.day];pairs.forEach(([i,j],k)=>{const[x,y]=simMatch(P[i],P[j],sd+gi*13+k);addRes(P[i],P[j],x,y);});});
      T.day++;let extra='';
      if(T.day>=3){const q=['A','B','C','D'].map(g=>grpSort(T.groups[g]));const meIn=q[0].slice(0,2).some(p=>p.me);
        if(meIn){T.phase='ko';const qf=[[q[0][0],q[1][1]],[q[1][0],q[0][1]],[q[2][0],q[3][1]],[q[3][0],q[2][1]]].map(([a,b])=>({a,b}));T.ko={round:0,rounds:[qf]};extra='<p><b>Passi il girone! Si va ai quarti.</b></p>';}
        else{T.phase='fine';T.out=true;T.prize='Fuori ai gironi: +10 💎. La prossima Coppa parte lunedì.';G.gems+=10;extra='<p><b>Eliminato ai gironi.</b></p>';}}
      arenaResult(res,opp,null,extra);};}
  else{const K=T.ko,ms=K.rounds[K.round],m=ms.find(x=>(x.a.me||x.b.me)&&x.w==null);opp=m.a.me?m.b:m.a;
    onRes=res=>{const meA=m.a.me;m.s=meA?[res.mine,res.opp]:[res.opp,res.mine];const iw=res.mine>res.opp||(res.mine===res.opp&&Math.random()<.5);m.w=iw?(meA?0:1):(meA?1:0);
      ms.forEach((x,k)=>{if(x.w==null){const[a,b]=simMatch(x.a,x.b,T.seed+K.round*31+k);x.s=[a,b];x.w=a>=b?0:1;}});
      let extra='';
      if(!iw){T.out=true;T.phase='fine';const pr=[20,35,60][K.round];G.gems+=pr;if(K.round===2)G.trof+=50;T.prize=`Eliminato in ${['quarti','semifinale','finale'][K.round]}: +${pr} 💎${K.round===2?' e +50 coppe':''}.`;extra=`<p><b>${T.prize}</b></p>`;}
      else if(K.round===2){T.phase='fine';G.gems+=100;G.trof+=100;G.champ=(G.champ||0)+1;T.prize='🏆 CAMPIONE DELLA SETTIMANA! +100 💎 e +100 coppe.';extra=`<p><b>${T.prize}</b></p>`;sfx('win');}
      else{const win=ms.map(x=>x.w===0?x.a:x.b);const nx=[];for(let i=0;i<win.length;i+=2)nx.push({a:win[i],b:win[i+1]});K.rounds.push(nx);K.round++;extra=`<p><b>Avanti: ${['semifinale','finale'][K.round-1]}!</b></p>`;}
      arenaResult(res,opp,null,extra);};}
  const ps=myProps();
  openSheet('🏆 Schiera la tua casa',`<p class="muted" style="margin-bottom:8px">Avversario: @${esc(opp.nick)} · potenza ${opp.pow}. Puoi schierare una casa diversa a ogni partita.</p>
    ${ps.sort((a,b)=>b.pow-a.pow).map(p=>`<div class="choice2"><img alt="" src="${custImg(p.id,54,64)}"><span><b>${esc(p.name)}</b><small>Potenza ${p.pow}</small></span><span class="col2"><button class="btn small" data-tp="${p.id}">Schiera</button><button class="btn small ghost" data-tw="${p.id}">🛠️</button></span></div>`).join('')}`,
  card=>{card.querySelectorAll('[data-tw]').forEach(b=>b.onclick=()=>workshop(b.dataset.tw,tourPlay));
    card.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{closeSheet();arenaPlay(b.dataset.tp,opp,{title:'Coppa del Quartiere',seed:T.seed+T.day*3+(T.ko?T.ko.round*17:0),onEnd:onRes});});});
}
